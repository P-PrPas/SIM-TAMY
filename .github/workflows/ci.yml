name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sim
          POSTGRES_PASSWORD: sim
          POSTGRES_DB: simtamy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sim -d simtamy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sim:sim@localhost:5432/simtamy
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest --cov=app
      - name: engine coverage gate (>= 85%)
        run: coverage report --include='app/engine/*' --fail-under=85
      - name: validate-content
        run: python -m app.content.validator_cli
        env:
          CONTENT_DIR: ../../content
      - name: no hidden fields in play-time schemas
        run: python ../../scripts/leakcheck.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: generated API types match docs/openapi.yaml
        run: |
          npm run gen:api
          git diff --exit-code -- lib/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: smoke test /health
        run: |
          docker compose up -d --wait db api
          curl -fsS http://localhost:8000/health
          python3 scripts/smoke.py http://localhost:8000
          docker compose down
