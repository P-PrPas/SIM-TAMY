# AI-01 held-out set: different wording from dev.yaml. Never tune prompts, rules or the mock on it;
# run it only to report a number. story A = gs-a-postpartum-warning, B = gs-b-thai-recovery.
paraphrase:
  - {id: H001, story: A, step: discover-mother, text: "เลือดที่ไหลออกมาช่วงนี้มากแค่ไหน", expect: {kind: accept, code: ASK_BLEEDING}}
  - {id: H002, story: A, step: discover-mother, text: "เรารู้สึกเจ็บแน่นที่อกหรือเปล่า", expect: {kind: accept, code: ASK_CHEST}}
  - {id: H003, story: A, step: discover-mother, text: "ยายวางแผนจะให้เราอยู่ไฟแบบไหน", expect: {kind: accept, code: ASK_PLAN}}
  - {id: H004, story: A, step: discover-father, text: "ช่วงเดินไปห้องน้ำมะลิดูเหนื่อยไหม", expect: {kind: accept, code: ASK_BREATHING}}
  - {id: H005, story: A, step: discover-father, text: "ผ้าอนามัยที่เปลี่ยนแล้วมีเลือดมากไหม", expect: {kind: accept, code: ASK_PADS}}
  - {id: H006, story: A, step: discover-father, text: "คนที่ประเมินอาการเรื่องนี้ได้คือใคร", expect: {kind: accept, code: ASK_WHO_ASSESSES}}
  - {id: H007, story: A, step: ask-grandmother, text: "อยู่ไฟกับอบสมุนไพรคือสิ่งเดียวกันไหมยาย", expect: {kind: accept, code: ASK_TRADITION}}
  - {id: H008, story: A, step: ask-grandmother, text: "สมุนไพรทุกอย่างปลอดภัยใช่ไหมยาย", expect: {kind: accept, code: ASK_HERB_SAFE}}
  - {id: H009, story: A, step: ask-grandmother, text: "คนที่ดูแลเรื่องอยู่ไฟควรมีสิทธิไหม", expect: {kind: accept, code: ASK_WHO_PROVIDES}}
  - {id: H010, story: B, step: ask-service-mother, text: "นวดประคบสมุนไพรมีไว้เพื่ออะไรหลังคลอด", expect: {kind: accept, code: ASK_PURPOSE}}
  - {id: H011, story: B, step: ask-service-mother, text: "ถ้าผ่าคลอดมาต้องแจ้งอะไรก่อนใช้บริการ", expect: {kind: accept, code: ASK_TIMING_WOUND}}
  - {id: H012, story: B, step: ask-service-mother, text: "การประคบร้อนต้องระวังอะไรไหมคะ", expect: {kind: accept, code: ASK_HEAT}}
  - {id: H013, story: B, step: ask-service-father, text: "ใครเป็นคนให้บริการแล้วเขามีสิทธิหรือเปล่า", expect: {kind: accept, code: ASK_PROVIDER}}
  - {id: H014, story: B, step: ask-service-father, text: "สมุนไพรที่ใช้มีส่วนผสมอะไรบ้างครับ", expect: {kind: accept, code: ASK_INGREDIENTS}}
  - {id: H015, story: B, step: ask-service-father, text: "ถ้าผมขอข้อมูลเพิ่มก่อนยินยอมได้ไหมครับ", expect: {kind: accept, code: ASK_CONSENT}}
  - {id: H016, story: A, step: discover-mother, text: "ผ้าอนามัยที่ใช้ชุ่มเร็วจนผิดสังเกตไหม", expect: {kind: accept, code: ASK_BLEEDING}}
  - {id: H017, story: A, step: discover-mother, text: "ตอนนี้แน่นอกบ้างหรือเปล่านะ", expect: {kind: accept, code: ASK_CHEST}}
  - {id: H018, story: A, step: discover-father, text: "เห็นมะลิหายใจเหนื่อยลำบากบ้างไหม", expect: {kind: accept, code: ASK_BREATHING}}
  - {id: H019, story: B, step: ask-service-father, text: "ผู้ให้บริการที่นี่เป็นใคร มีสิทธิให้บริการไหม", expect: {kind: accept, code: ASK_PROVIDER}}
  - {id: H020, story: B, step: ask-service-mother, text: "ช่วงหลังคลอดกี่วันถึงรับบริการได้คะ", expect: {kind: accept, code: ASK_TIMING_WOUND}}
multiturn:
  - {id: HM01, story: A, step: discover-mother, history: [{text: "เจ็บหน้าอกไหม", code: ASK_CHEST}], text: "แล้วเรื่องนั้นล่ะ ขอฟังอีกที", expect: {kind: accept, code: ASK_CHEST}}
  - {id: HM02, story: A, step: discover-father, history: [{text: "ผ้าอนามัยที่ทิ้งเป็นยังไง", code: ASK_PADS}], text: "ส่วนอันนั้นเป็นอย่างไรต่อ", expect: {kind: accept, code: ASK_PADS}}
  - {id: HM03, story: A, step: ask-grandmother, history: [{text: "อยู่ไฟคืออะไร", code: ASK_TRADITION}], text: "แล้วสมุนไพรที่เป็นธรรมชาติปลอดภัยเสมอไหม", expect: {kind: accept, code: ASK_HERB_SAFE}}
  - {id: HM04, story: B, step: ask-service-mother, history: [{text: "ความร้อนต้องระวังอะไร", code: ASK_HEAT}], text: "เรื่องนั้นต้องระวังอะไรอีกไหม", expect: {kind: accept, code: ASK_HEAT}}
  - {id: HM05, story: B, step: ask-service-father, history: [{text: "ปฏิเสธได้ไหม", code: ASK_CONSENT}], text: "แล้วข้อนี้ล่ะ", expect: {kind: accept, code: ASK_CONSENT}}
  - {id: HM06, story: B, step: ask-service-father, history: [], text: "ส่วนข้อนั้นล่ะ", expect: {kind: not_accept}}
  - {id: HM07, story: A, step: discover-mother, history: [{text: "สวัสดี", code: OUT_OF_SCOPE}], text: "ข้อนี้ล่ะ", expect: {kind: not_accept}}
  - {id: HM08, story: B, step: ask-service-mother, history: [{text: "บริการนี้ช่วยอะไร", code: ASK_PURPOSE}], text: "แล้วต้องบอกอะไรเรื่องผ่าคลอดไหม", expect: {kind: accept, code: ASK_TIMING_WOUND}}
