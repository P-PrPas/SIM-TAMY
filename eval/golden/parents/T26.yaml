# T26 (MOM-001) Perfect Path: asks about every danger sign and the appointment, decides to go, explains, writes a note.
id: T26
case: MOM-001
variant: A
steps:
  - {say: "ช่วงนี้เป็นยังไงบ้างจ๊ะ", expect_actions_any: [A01]}
  - {say: "เริ่มรู้สึกแบบนี้ตั้งแต่เมื่อไหร่จ๊ะ", expect_actions_any: [A02]}
  - {say: "ลูกดิ้นเหมือนเดิมไหมจ๊ะ", expect_actions_any: [A03]}
  - {say: "ปวดหัวบ้างไหมจ๊ะ", expect_actions_any: [A04]}
  - {say: "หน้าหรือมือบวมไหมจ๊ะ", expect_actions_any: [A05]}
  - {say: "มีเลือดออกไหมจ๊ะ", expect_actions_any: [A06]}
  - {say: "ปวดท้องรุนแรงไหมจ๊ะ", expect_actions_any: [A07]}
  - {say: "พรุ่งนี้มีนัดหมอไหม", expect_actions_any: [A08]}
  - {say: "เข้าใจนะ ไม่ต้องกลัว เราอยู่ตรงนี้", expect_actions_any: [C01]}
  - {say: "เราขออธิบายขั้นตอนต่อไปนะ", expect_actions_any: [C02]}
  - {decision: go_hospital_now}
  - {complete: true, note: "บันทึกทดสอบ: ไปโรงพยาบาลเพราะมีอาการที่ต้องรีบไป จดเวลาและอาการแล้วนำสมุดไปด้วย"}
expect:
  safety_status: SAFETY_MET
  revealed: [H1, H2, H3, H4, H5, H6]
  events_include: [DECISION_COMMITTED, SESSION_COMPLETED]
  events_exclude: [UNSAFE_ACTION]
  items: {R-RISK-01: pass, R-RISK-02: pass, R-DEC-01: pass, R-DEC-03: pass}
