# T55 (STF-002) Refusal in words: Variant C, the learner says there is no need to refer. The lexical fallback must read
# that as giving in (C04), not as insisting on the referral (C03).
id: T55
case: STF-002
variant: C
steps:
  - {say: "ปวดศีรษะไหมคะ", expect_actions_any: [A03]}
  - {say: "ตามัวหรือตาพร่าไหมคะ", expect_actions_any: [A04]}
  - {decision: hold_and_refer}
  - {say: "ไม่ต้องส่งต่อก็ได้ค่ะ", expect_actions_any: [C04]}
  - {complete: true}
expect:
  safety_status: SAFETY_NOT_MET
  items: {R-COMM-03: fail, R-COMM-02: fail, R-DEC-03: fail}
  replay_terminal_state: UnsafeProceed
