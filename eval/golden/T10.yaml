id: T10
case: DEV-001
variant: A
steps:
  - {say: "ขอถามเรื่องสัญญาณทดสอบกหน่อยค่ะ", expect_actions_any: [A03]}
  - {say: "ขอถามเรื่องสัญญาณทดสอบกอีกครั้งค่ะ", expect_actions_any: [A03], expect_events: [ACTION_REPEATED]}
