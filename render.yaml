# Render Blueprint (ADR-14, T-090). Staging on the free plans: see docs/RUNBOOK-deploy.md.
# Values marked `sync: false` are typed into the Render dashboard; no secret lives in this repo.
databases:
  - name: sim-tamy-db
    plan: free
    region: singapore
    databaseName: simtamy
    user: sim

services:
  - type: web
    name: sim-tamy-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # no preDeployCommand on the free plan, so migrate on start (idempotent)
    dockerCommand: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sim-tamy-db
          property: connectionString
      - key: LLM_PROVIDER
        value: mock
      - key: ALLOW_DRAFT_CASES
        value: "true"
      - key: INSTRUCTOR_SECRET
        sync: false
      - key: CORS_ORIGINS # the production web origin, e.g. https://sim-tamy.vercel.app
        sync: false
      - key: CORS_ORIGIN_REGEX # Vercel previews, e.g. https://sim-tamy-.*-<team>\.vercel\.app
        sync: false
