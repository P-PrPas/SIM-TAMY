# Render Blueprint (ADR-14, T-090). Staging on the free plans: see docs/RUNBOOK-deploy.md.
# Values marked `sync: false` are typed into the Render dashboard; no secret lives in this repo.
databases:
  - name: sim-tamy-db
    plan: free
    region: singapore
    databaseName: simtamy
    user: sim

services:
  - type: web
    name: sim-tamy-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # no preDeployCommand on the free plan, so migrate on start (idempotent)
    dockerCommand: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sim-tamy-db
          property: connectionString
      - key: LLM_PROVIDER # staging stays offline; set openai_like in the dashboard to use GLM
        value: mock
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL # Z.ai general API, not the Coding Plan endpoint
        value: https://api.z.ai/api/paas/v4
      - key: LLM_MODEL_INTERPRETER
        value: glm-5.3
      - key: LLM_MODEL_GENERATOR
        value: glm-5.3
      - key: LLM_MODEL_DEBRIEF
        value: glm-5.3
      - key: LLM_REASONING_EFFORT
        value: low
      - key: LLM_TIMEOUT_S
        value: "30"
      - key: ALLOW_DRAFT_CASES
        value: "true"
      - key: INSTRUCTOR_SECRET
        sync: false
      - key: CORS_ORIGINS # the production web origin, e.g. https://sim-tamy.vercel.app
        sync: false
      - key: CORS_ORIGIN_REGEX # Vercel previews, e.g. https://sim-tamy-.*-<team>\.vercel\.app
        sync: false
