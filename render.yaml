# Render Blueprint (ADR-14, T-090). Staging on the free plans: see docs/RUNBOOK-deploy.md.
# Values marked `sync: false` are typed into the Render dashboard; no secret lives in this repo.
databases:
  - name: sim-tamy-db
    plan: free
    region: singapore
    databaseName: simtamy
    user: sim

services:
  - type: web
    name: sim-tamy-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass # staging follows main once CI is green; production: v* tag (RUNBOOK-deploy.md)
    # the image CMD migrates, then serves (no preDeployCommand on the free plan)
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sim-tamy-db
          property: connectionString
      - key: LLM_PROVIDER
        sync: false # Preserve the provider selected in the dashboard on Blueprint updates.
      - key: ALLOW_DRAFT_CASES
        value: "true"
      - key: ENABLE_REPLAY
        value: "true"
      - key: INSTRUCTOR_SECRET
        sync: false
      - key: CORS_ORIGINS # the production web origin, e.g. https://sim-tamy.vercel.app
        sync: false
      - key: CORS_ORIGIN_REGEX # Vercel previews, e.g. https://sim-tamy-.*-<team>\.vercel\.app
        sync: false
