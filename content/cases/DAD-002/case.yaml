case_id: DAD-002
version: "0.2"
status: Draft
audience: dad
title_th: "DAD-002 ภรรยาหลังคลอดบอกว่าแค่เหนื่อย"
learning_objectives: [risk_recognition, referral_decision, communication_under_pressure]

patient_profile:
