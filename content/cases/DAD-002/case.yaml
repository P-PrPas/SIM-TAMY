  - id: H1
    kind: hidden
    text_th: "ผ้าอนามัยชุ่มเต็มหนึ่งผืนหรือมากกว่าภายในหนึ่งชั่วโมง และมีลิ่มเลือดก้อนใหญ่ออกมา"
    unlock_on: [A03]
    keywords_th: ["ชุ่มเต็ม", "ลิ่มเลือด"]
    leak_terms_th: ["ชุ่มเต็ม", "ลิ่มเลือด", "ผ้าอนามัย"]
    fallback_utterances_th: ["ผ้าอนามัยชุ่มเต็มหนึ่งผืนภายในหนึ่งชั่วโมงเลยค่ะ แล้วก็มีลิ่มเลือดก้อนใหญ่ออกมา"]
