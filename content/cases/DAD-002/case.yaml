variants:
  A:
    persona: {minimization: low, family_pressure: false, style_th: "คุณเป็นภรรยาที่กำลังคุยกับสามีซึ่งเป็นผู้เรียน แทนตัวเองว่าเรา เรียกสามีว่าคุณ ใช้ประโยคสั้น เว้นจังหวะ และพูดอย่างสนิทใจ ตอบตามข้อมูลที่มี ไม่เติมอาการเพื่อให้สมบทบาท"}
    fact_set: default
  C:
    persona: {minimization: high, family_pressure: true, style_th: "คุณเป็นภรรยาที่กำลังคุยกับสามีซึ่งเป็นผู้เรียน แทนตัวเองว่าเรา เรียกสามีว่าคุณ พูดอย่างเกรงใจ มีญาติอยู่ด้วย น้ำเสียงพยายามทำให้สามีสบายใจแต่ต้องตอบข้อเท็จจริงครบ ไม่รับรองว่าปลอดภัยและไม่พูดแทนญาติ"}
    fact_set: default
    pressure_script:
      # scripted, not LLM-generated (AGENTS.md); opened once the learner decides to refer
      - {speaker: relative, text_th: "ผู้หญิงหลังคลอดก็เหนื่อยแบบนี้กันทุกคน พักเดี๋ยวก็หาย"}

# TODO(content): diagnosis words the character must never say; the list below is minimal.
forbidden_terms_th: ["ตกเลือด", "ติดเชื้อ", "ซึมเศร้าหลังคลอด"]

decision_options:
  - {id: seek_care_now, label_th: "พาภรรยาไปโรงพยาบาลตอนนี้", maps_to_actions: [B01, B02]}
  - {id: support_at_home, label_th: "ช่วยดูแลที่บ้านก่อน", maps_to_actions: [B03]}

branch_rules:
  - {from: INTERVIEW, on_action_any: [A03, A04, A05, A06, A07], set_risk_state: recognized}
  - {from: INTERVIEW, on_decision: seek_care_now, to: PRESSURE, if_variant: [C]}
  - {from: INTERVIEW, on_decision: seek_care_now, to: CLOSING, if_variant: [A]}
  - {from: INTERVIEW, on_decision: support_at_home, to: CLOSING, mark_unsafe: true}
  - {from: PRESSURE, on_action_any: [C03], to: CLOSING}
  - {from: PRESSURE, on_action_any: [C04], to: CLOSING, mark_unsafe: true}

critical_facts_for_replay: [H1, H2, H3, H4, H5]

# Each line is the learner's decision or a next step to take, never something that happened.
# TODO(content): clinical consequences are for the experts to write.
outcome_scripts:
  Referral:
    timeline_th:
      - "ผู้เรียนเลือกพาภรรยาไปโรงพยาบาลตอนนี้"
      - "ขั้นตอนที่ควรทำต่อ: บอกเจ้าหน้าที่ว่าเลือดออกอย่างไร มีไข้ตั้งแต่เมื่อไหร่ และอารมณ์ของภรรยาช่วงที่ผ่านมา และอยู่ข้าง ๆ เธอ"
    disclaimer_th: "ฉบับร่าง ผลลัพธ์หลังส่งต่อรอผู้เชี่ยวชาญกำหนด เพื่อการศึกษาเท่านั้น"
  UnsafeProceed:
    timeline_th:
      - "ผู้เรียนเลือกช่วยดูแลที่บ้านก่อน ทั้งที่ภรรยามีอาการที่สามารถถามได้"
      - "เคสเข้าสู่การทบทวน (debrief) เพื่อดูว่าควรไปโรงพยาบาลเมื่อใด"
    disclaimer_th: "ฉบับร่าง ผลลัพธ์ทางคลินิกรอผู้เชี่ยวชาญกำหนด เพื่อการศึกษาเท่านั้น"

