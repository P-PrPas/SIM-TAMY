# PP-001 = PN-R01 "ขอฟื้นฟูหลังคลอด แต่มีเลือดออกมาก" (Phase 4, Variants A and C).
# DRAFT written by Engineering from docs/SIM-TAMY-curriculum-and-solution.md section 7 (and 6.2 for the gate).
# Every fact below is taken from the table in 7.1; nothing was added. NOT reviewed by the Content team or an expert
# (the source document itself says the figures and rules are a design proposal). Keep status Draft until reviewed.
# TODO(content): items the source leaves to experts are marked TODO(content) below. Do not fill them in from here.
case_id: PP-001
version: "0.1"
status: Draft
# The title is shown in the CaseBrief before the learner asks anything, so it must not state a hidden fact.
# The source calls this case "PN-R01 ขอฟื้นฟูหลังคลอด แต่มีเลือดออกมาก"; that internal name stays out of title_th.
title_th: "PN-R01 ขอฟื้นฟูหลังคลอด (ฉบับร่าง ยังไม่ผ่านผู้เชี่ยวชาญ)"
learning_objectives: [risk_recognition, referral_decision, communication_under_pressure]

patient_profile:
  display_th: "ผู้รับบริการสมมติ อายุ 29 ปี หลังคลอด 10 วัน มาขอนวดและทับหม้อเกลือเพราะรู้สึกเพลีย ญาติคิดว่าการฟื้นฟูจะช่วยให้สบายขึ้น"
  known_facts: [K1]

facts:
  - id: K1
    kind: known
    text_th: "หลังคลอด 10 วัน มาขอฟื้นฟู (นวดและทับหม้อเกลือ) และรู้สึกเพลีย"
    source: "[SIM-TAMY หลักสูตรและแนวคิดโซลูชัน v0.1, §7.1 แถว 1]"
  - id: H1
    kind: hidden
    text_th: "เลือดออกมากขึ้นตั้งแต่เช้า ผ้าอนามัยชุ่มเต็มมากกว่า 1 แผ่นต่อชั่วโมง"
    unlock_on: [A03]
    keywords_th: ["เลือดออกมากขึ้น", "ผ้าอนามัยชุ่ม"]
    leak_terms_th: ["เลือดออกมาก", "ผ้าอนามัยชุ่ม", "ชุ่มเต็ม"]
    fallback_utterances_th: ["เลือดออกมากขึ้นตั้งแต่เช้าค่ะ ผ้าอนามัยชุ่มเต็มมากกว่าหนึ่งแผ่นต่อชั่วโมงเลยค่ะ"]
    risk_relevance: critical
    source: "[SIM-TAMY หลักสูตรและแนวคิดโซลูชัน v0.1, §7.1 แถว 2; CDC Urgent Maternal Warning Signs]"
    status: Draft
  - id: H2
    kind: hidden
    text_th: "เวียนศีรษะเวลาเปลี่ยนท่า"
    unlock_on: [A04]
    keywords_th: ["เวียนศีรษะ", "เปลี่ยนท่า"]
    leak_terms_th: ["เวียนศีรษะ", "หน้ามืดตอนเปลี่ยนท่า"]
    fallback_utterances_th: ["มีเวียนศีรษะเวลาเปลี่ยนท่าค่ะ"]
    risk_relevance: critical
    source: "[SIM-TAMY หลักสูตรและแนวคิดโซลูชัน v0.1, §7.1 แถว 3]"
    status: Draft
  # TODO(content): delivery details, medicines and treatment history are "fixed data in the case file" per 7.1 but the
  # source gives no values. Only the delivery route (vaginal) is stated, so H3 says only that. No digits in the text or
  # the fallback: the Validator compares number tokens with their trailing letters ("10 วันก่อนค่ะ" != "10 วันก่อน").
  # Add facts for medicines/history and a vital-signs fact for A07 when the experts define them.
  - id: H3
    kind: hidden
    text_th: "คลอดทางช่องคลอด"
    unlock_on: [A05]
    keywords_th: ["คลอดทางช่องคลอด"]
    leak_terms_th: ["คลอดทางช่องคลอด"]
    fallback_utterances_th: ["คลอดทางช่องคลอดค่ะ"]
    risk_relevance: contextual
    source: "[SIM-TAMY หลักสูตรและแนวคิดโซลูชัน v0.1, §7.1 หัวข้อเรื่องราวของเคส]"
    status: Draft

variants:
  A:
    # TODO(content): persona wording is a placeholder; the source defines no persona text.
    persona: {minimization: low, family_pressure: false, style_th: "พูดสุภาพ ตอบตามที่ถาม"}
    fact_set: default
  C:
    persona: {minimization: high, family_pressure: true, style_th: "พูดเบา ตอบสั้น มีญาติอยู่ด้วย"}
    fact_set: default
    pressure_script:
      # the only relative line the source gives (7.1, last row); opened after the learner says referral is needed
      - {speaker: relative, text_th: "นวดก่อนแล้วค่อยไปโรงพยาบาลได้ไหม"}

# TODO(content): diagnosis words and clinical figures the patient must never say; the list below is minimal.
forbidden_terms_th: ["ตกเลือดหลังคลอด", "ภาวะช็อก"]

decision_options:
  - {id: refer, label_th: "ระงับการเริ่มฟื้นฟูและประสานส่งต่อ", maps_to_actions: [B01, B02]}
  - {id: proceed_service, label_th: "เริ่มกิจกรรมฟื้นฟูตามที่ขอ", maps_to_actions: [B03]}

# 7.2 of the source: asking and finding the signs, stopping with referral, starting the activity (with or without
# asking first) are the branches. "Tells the patient to go to hospital but still starts the activity" needs more
# than one decision per session and is not modelled here. TODO(content): decide whether it should be.
branch_rules:
  - {from: INTERVIEW, on_action_any: [A03, A04], set_risk_state: recognized}
  - {from: INTERVIEW, on_decision: refer, to: PRESSURE, if_variant: [C]}
  - {from: INTERVIEW, on_decision: refer, to: CLOSING, if_variant: [A]}
  - {from: INTERVIEW, on_decision: proceed_service, to: CLOSING, mark_unsafe: true}
  - {from: PRESSURE, on_action_any: [C03], to: CLOSING}
  - {from: PRESSURE, on_action_any: [C04], to: CLOSING, mark_unsafe: true}

critical_facts_for_replay: [H1, H2]

# The source (7.2) says the case must not invent a deterioration. Each line is either the learner's decision
# (always true on that path) or is worded as a next step the learner should take, never as something that happened.
# TODO(content): clinical consequences after referral / after starting the activity are for the experts to write.
outcome_scripts:
  Referral:
    timeline_th:
      - "ผู้เรียนเลือกระงับการเริ่มฟื้นฟูและประสานส่งต่อ"
      - "ขั้นตอนที่ควรทำต่อ: อธิบายเหตุผลกับผู้รับบริการและญาติ แล้วส่งมอบข้อมูลให้ทีมปลายทาง"
    disclaimer_th: "ฉบับร่าง ผลลัพธ์หลังการส่งต่อรอผู้เชี่ยวชาญกำหนด เพื่อการศึกษาเท่านั้น"
  UnsafeProceed:
    timeline_th:
      - "ผู้เรียนเลือกเริ่มกิจกรรมฟื้นฟูตามที่ขอ ทั้งที่ผู้รับบริการมีข้อมูลเสี่ยงที่สามารถซักถามได้"
      - "เคสเข้าสู่การทบทวน (debrief) เพื่อดูว่าควรหยุดและส่งต่อเมื่อใด"
    disclaimer_th: "ฉบับร่าง ผลลัพธ์ทางคลินิกรอผู้เชี่ยวชาญกำหนด เพื่อการศึกษาเท่านั้น"

references:
