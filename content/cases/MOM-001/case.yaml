# DRAFT written by Engineering from docs/research/2026-10-17-parent-and-staff-content.md (section 8, PAR-M01). Every hidden
# fact is worded from the official source named on it. NOT reviewed by the Content team or an expert.
# The learner is a mother who has been through pregnancy and is helping a pregnant friend by chat. The engine reveals a fact
