forbidden_terms_th: ["ครรภ์เป็นพิษ", "รกลอกตัว", "ความดันสูง"]

decision_options:
  - {id: go_hospital_now, label_th: "ชวนเพื่อนไปโรงพยาบาลตอนนี้", maps_to_actions: [B01, B02]}
  - {id: self_care_and_keep_appointment, label_th: "ให้ดูแลตัวเองที่บ้านก่อน", maps_to_actions: [B03]}

branch_rules:
  - {from: INTERVIEW, on_action_any: [A03, A04, A05, A06, A07], set_risk_state: recognized}
  - {from: INTERVIEW, on_decision: go_hospital_now, to: PRESSURE, if_variant: [C]}
  - {from: INTERVIEW, on_decision: go_hospital_now, to: CLOSING, if_variant: [A]}
  - {from: INTERVIEW, on_decision: self_care_and_keep_appointment, to: CLOSING, mark_unsafe: true}
  - {from: PRESSURE, on_action_any: [C03], to: CLOSING}
  - {from: PRESSURE, on_action_any: [C04], to: CLOSING, mark_unsafe: true}

critical_facts_for_replay: [H1, H2, H3, H4, H5]

