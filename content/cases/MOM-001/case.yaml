variants:
  A:
    # TODO(content): persona wording is a placeholder; the research defines no persona text.
    persona: {minimization: low, family_pressure: false, style_th: "คุยแบบเพื่อนสนิท ตอบตามที่ถาม"}
    fact_set: default
  C:
    persona: {minimization: high, family_pressure: true, style_th: "ลดความสำคัญของอาการ กลัวเสียเวลา มีญาติอยู่ด้วย"}
    fact_set: default
