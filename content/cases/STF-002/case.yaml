outcome_scripts:
  Referral:
    timeline_th:
      - "ผู้เรียนเลือกระงับการนวดและประคบ แล้วประสานส่งต่อ"
      - "ขั้นตอนที่ควรทำต่อ: อธิบายเหตุผลกับผู้รับบริการและสามี แล้วส่งมอบข้อมูลที่พบให้ทีมปลายทาง (รายการส่งมอบรอผู้เชี่ยวชาญกำหนด)"
    disclaimer_th: "ฉบับร่าง ผลลัพธ์หลังส่งต่อรอผู้เชี่ยวชาญกำหนด เพื่อการศึกษาเท่านั้น"
  UnsafeProceed:
    timeline_th:
      - "ผู้เรียนเลือกให้บริการนวดและประคบตามที่ขอ ทั้งที่ผู้รับบริการมีข้อมูลเสี่ยงที่สามารถซักถามได้"
      - "เคสเข้าสู่การทบทวน (debrief) เพื่อดูว่าควรหยุดและส่งต่อเมื่อใด"
    disclaimer_th: "ฉบับร่าง ผลลัพธ์ทางคลินิกรอผู้เชี่ยวชาญกำหนด เพื่อการศึกษาเท่านั้น"

