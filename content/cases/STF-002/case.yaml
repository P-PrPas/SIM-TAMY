variants:
  A:
    persona: {minimization: low, family_pressure: false, style_th: "คุณเป็นผู้รับบริการที่กำลังคุยกับเจ้าหน้าที่ซึ่งเป็นผู้เรียน แทนตัวเองว่าดิฉัน เรียกผู้เรียนว่าคุณ พูดสุภาพและตรงไปตรงมา ตอบตามข้อมูลที่มี ไม่เรียกผู้เรียนว่าหมอและไม่บอกแนวทางประเมิน"}
    fact_set: default
  C:
    persona: {minimization: high, family_pressure: true, style_th: "คุณเป็นผู้รับบริการที่กำลังคุยกับเจ้าหน้าที่ซึ่งเป็นผู้เรียน แทนตัวเองว่าดิฉัน เรียกผู้เรียนว่าคุณ น้ำเสียงเร่งรีบและไม่อยากเสียเวลา มีสามีอยู่ด้วย ตอบข้อเท็จจริงที่ถามครบ ไม่เรียกเจ้าหน้าที่ว่าหมอและไม่พูดแทนสามี"}
    fact_set: default
    pressure_script:
      # scripted, not LLM-generated (AGENTS.md); opened once the learner decides to refer
      - {speaker: relative, text_th: "นวดไปก่อนเถอะ เดี๋ยวค่อยไปหาหมอทีหลัง"}

# TODO(content): diagnosis words the character must never say; the list below is minimal.
forbidden_terms_th: ["ครรภ์เป็นพิษ", "รกลอกตัว", "ชัก"]

decision_options:
  - {id: hold_and_refer, label_th: "ระงับการนวดและประคบ แล้วประสานส่งต่อ", maps_to_actions: [B01, B02]}
  - {id: proceed_service, label_th: "ให้บริการนวดและประคบตามที่ขอ", maps_to_actions: [B03]}

branch_rules:
  - {from: INTERVIEW, on_action_any: [A03, A04, A05, A06, A07, A08], set_risk_state: recognized}
  - {from: INTERVIEW, on_decision: hold_and_refer, to: PRESSURE, if_variant: [C]}
  - {from: INTERVIEW, on_decision: hold_and_refer, to: CLOSING, if_variant: [A]}
  - {from: INTERVIEW, on_decision: proceed_service, to: CLOSING, mark_unsafe: true}
  - {from: PRESSURE, on_action_any: [C03], to: CLOSING}
  - {from: PRESSURE, on_action_any: [C04], to: CLOSING, mark_unsafe: true}

critical_facts_for_replay: [H1, H2, H3, H4, H5, H6]

# Each line is the learner's decision or a next step to take, never something that happened.
