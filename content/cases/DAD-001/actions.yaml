  - เป็นอะไรไหม
- id: A02
  category: HX
  type: info
  label_th: ถามว่าเริ่มไม่สบายตัวตั้งแต่เมื่อไหร่
  examples_th:
  - เริ่มไม่สบายตัวตั้งแต่กี่โมงครับ
  - เป็นมาตั้งแต่เมื่อไหร่ครับ
  - อาการเริ่มตั้งแต่เมื่อไรครับ
  - ไม่สบายตัวมานานแค่ไหนแล้วครับ
  - เริ่มรู้สึกแบบนี้ตั้งแต่เมื่อไหร่ครับ
  keywords_th:
  - ตั้งแต่เมื่อไหร่
  - ตั้งแต่กี่โมง
  - นานแค่ไหน
- id: A03
  category: HX
  type: critical_info
  label_th: ถามว่ามีน้ำไหลออกจากช่องคลอดหรือเปียกชื้นโดยกลั้นไม่ได้หรือไม่
