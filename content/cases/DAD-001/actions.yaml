  examples_th:
  - ลูกดิ้นเหมือนเดิมไหมครับ
  - ช่วงนี้ลูกดิ้นเป็นยังไงบ้างครับ
  - ลูกดิ้นน้อยลงหรือเปล่าครับ
  - วันนี้รู้สึกว่าลูกดิ้นไหมครับ
  - ลูกยังดิ้นอยู่ไหมครับ
  - เมื่อคืนลูกดิ้นดีไหมครับ
