- id: A01
  category: HX
  type: info
  label_th: ทักทายและถามว่าตอนนี้รู้สึกอย่างไร
  examples_th:
  - ตอนนี้รู้สึกยังไงบ้างครับ
  - เป็นอะไรไหมครับ ไหนเล่าให้ฟังหน่อย
  - วันนี้รู้สึกอย่างไรบ้างครับ
  - บอกผมหน่อยว่าตอนนี้เป็นยังไง
  - เมื่อคืนไม่สบายตัวยังไงครับ
  keywords_th:
