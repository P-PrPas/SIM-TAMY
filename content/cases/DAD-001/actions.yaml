  category: COM
  type: communication
  label_th: ยอมตามญาติให้รออยู่บ้านก่อน
  examples_th:
  - ก็ได้ครับ รอที่บ้านก่อนตามที่แนะนำ
  - โอเค ไว้ตอนเช้าค่อยไปก็ได้
  - งั้นรออยู่บ้านก่อนนะครับ
  - ตามที่ญาติว่าครับ รอดูอาการก่อน
  - ยังไม่ต้องรีบก็ได้ครับ รอดูอาการก่อน
  keywords_th:
