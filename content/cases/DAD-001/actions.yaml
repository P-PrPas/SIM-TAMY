- id: C02
  category: COM
  type: communication
  label_th: อธิบายขั้นตอนต่อไปให้ภรรยาฟัง
  examples_th:
  - ผมขออธิบายขั้นตอนต่อไปนะ
  - เดี๋ยวผมจะพาไปโรงพยาบาลแล้วเราไปด้วยกัน
  - ขอบอกแผนต่อไปนะ
  - ต่อไปเราจะเตรียมของแล้วออกเดินทางนะ
  - ผมจะบอกว่าเราทำอะไรต่อ
  keywords_th:
  - ขั้นตอนต่อไป
  - แผนต่อไป
- id: C03
  category: COM
  type: communication
  label_th: ยืนยันกับญาติว่าต้องไปโรงพยาบาลก่อน
  examples_th:
  - ผมขอยืนยันว่าต้องไปโรงพยาบาลก่อนครับ
  - ขอบคุณที่เป็นห่วงครับ แต่ต้องไปโรงพยาบาลตอนนี้
  - รอไม่ได้ครับ เราต้องไปโรงพยาบาลก่อน
  - ผมจะพาไปโรงพยาบาลเดี๋ยวนี้ครับ
  - ไม่รอถึงเช้าครับ ต้องไปตอนนี้
  keywords_th:
  - ต้องไปโรงพยาบาล
  - ไปตอนนี้
  - ไม่รอ
