  - น้ำไหล
  - เปียก
  source: "[S05 กรมอนามัย คู่มือการฝากครรภ์ 2565 หน้า 62-63; research §2.1 D5-D6]"
- id: A04
  category: HX
  type: critical_info
  label_th: ถามว่ามีมูกหรือเลือดออกทางช่องคลอดหรือไม่
