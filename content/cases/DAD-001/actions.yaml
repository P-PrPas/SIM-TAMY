  - ปวดท้องบ่อยแค่ไหนครับ
  - ที่ปวดท้องนี่ถี่ขึ้นไหมครับ
  - นอนพักแล้วปวดท้องทุเลาไหมครับ
  - เจ็บท้องเป็นพัก ๆ หรือเจ็บถี่ขึ้นครับ
  - ปวดท้องแล้วหายไหมถ้านอนพัก
  - ตอนนี้ปวดท้องเป็นยังไงบ้างครับ
  keywords_th:
  - ปวดท้อง
  - เจ็บท้อง
  - เจ็บถี่
  source: "[S05 กรมอนามัย คู่มือการฝากครรภ์ 2565 ภาคผนวก ก ไตรมาส 3]"
- id: A06
  category: HX
  type: critical_info
  label_th: ถามว่าลูกดิ้นเป็นอย่างไร
