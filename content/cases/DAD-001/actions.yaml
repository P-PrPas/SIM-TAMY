- id: C01
  category: COM
  type: communication
  label_th: แสดงความเข้าใจและให้กำลังใจ
  examples_th:
  - ผมเข้าใจนะ ไม่ต้องกลัว ผมอยู่ตรงนี้
  - ขอบคุณที่บอกนะ ค่อย ๆ เล่าได้เลย
  - ไม่เป็นไรนะ ผมอยู่ข้าง ๆ
  - เข้าใจแล้วครับ ไม่ต้องกังวล
  - รับทราบครับ ผมจะดูแลเอง
