  - มีมูกออกมาไหมครับ
  - มีเลือดออกมาไหมครับ
  - มีมูกปนเลือดหรือเปล่าครับ
  - มีเลือดออกทางช่องคลอดไหมครับ
  - ลองดูหน่อยว่ามีมูกหรือเลือดไหมครับ
