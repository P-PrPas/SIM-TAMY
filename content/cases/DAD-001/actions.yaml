  examples_th:
  - มีน้ำไหลออกมาไหมครับ
  - รู้สึกเปียกข้างล่างไหมครับ
  - มีน้ำเดินหรือเปล่าครับ
  - มีน้ำไหลออกมาจากข้างล่างไหมครับ
  - ตอนนี้มีน้ำซึมออกมาไหมครับ
  - ข้างล่างเปียกหรือเปล่าครับ
