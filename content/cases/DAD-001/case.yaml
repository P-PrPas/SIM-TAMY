variants:
  A:
    persona: {minimization: low, family_pressure: false, style_th: "คุณเป็นภรรยาที่กำลังคุยกับสามีซึ่งเป็นผู้เรียน แทนตัวเองว่าเรา เรียกสามีว่าคุณ พูดนุ่มนวล เป็นกันเอง และตอบตรงคำถามทีละเรื่อง ไม่ใช้คำเรียกบุคลากรทางการแพทย์ ไม่แต่งความทรงจำหรือข้อมูลครอบครัว"}
    fact_set: default
  C:
    persona: {minimization: high, family_pressure: true, style_th: "คุณเป็นภรรยาที่กำลังคุยกับสามีซึ่งเป็นผู้เรียน แทนตัวเองว่าเรา เรียกสามีว่าคุณ ตอบสั้นอย่างเกรงใจและไม่อยากรบกวน มีญาติอยู่ด้วย น้ำเสียงลดความสำคัญได้แต่ต้องบอกข้อมูลที่ถูกถามครบ ไม่พูดแทนญาติ"}
    fact_set: default
    pressure_script:
      # the relative line is scripted (AGENTS.md: pressure lines are not LLM-generated); opened once he decides to go
      - {speaker: relative, text_th: "รออยู่บ้านก่อนเถอะ ไว้ตอนเช้าค่อยไปก็ได้"}

# TODO(content): diagnosis words the patient must never say; the list below is minimal.
forbidden_terms_th: ["ถุงน้ำคร่ำแตก", "รกลอกตัว", "ครรภ์เป็นพิษ"]

decision_options:
  - {id: go_hospital_now, label_th: "พาภรรยาไปโรงพยาบาลตอนนี้", maps_to_actions: [B01, B02]}
  - {id: monitor_at_home, label_th: "รอดูอาการที่บ้านก่อน", maps_to_actions: [B03]}

branch_rules:
  - {from: INTERVIEW, on_action_any: [A03, A04, A05, A06], set_risk_state: recognized}
  - {from: INTERVIEW, on_decision: go_hospital_now, to: PRESSURE, if_variant: [C]}
  - {from: INTERVIEW, on_decision: go_hospital_now, to: CLOSING, if_variant: [A]}
  - {from: INTERVIEW, on_decision: monitor_at_home, to: CLOSING, mark_unsafe: true}
  - {from: PRESSURE, on_action_any: [C03], to: CLOSING}
  - {from: PRESSURE, on_action_any: [C04], to: CLOSING, mark_unsafe: true}

critical_facts_for_replay: [H1, H2, H3, H4]

