      - "ขั้นตอนที่ควรทำต่อ: ให้ภรรยาเลี่ยงการยืนหรือเดิน จดเวลาที่เริ่มมีน้ำไหล สี และปริมาณ แล้วนำสมุดบันทึกสุขภาพแม่และเด็กกับบัตรประชาชนไปด้วย"
