# Authored demonstration dialogue. Clinical facts remain owned by content/cases/.
# fact_ids identify the existing facts paraphrased in each patient reply.
DAD-001:
  case_version: "0.2"
  turns:
    - learner_th: "ตอนนี้รู้สึกยังไงบ้าง บอกเราได้นะ"
      patient_th: "ไม่ค่อยสบายตัวเลยน่ะ ใกล้ครบกำหนดคลอดแล้วด้วย เราเลยไม่ค่อยแน่ใจว่าควรทำยังไง"
      fact_ids: [K1]
    - learner_th: "เริ่มไม่สบายตัวตั้งแต่เมื่อไหร่"
      patient_th: "ตั้งแต่เมื่อคืนแล้ว ตอนแรกก็คิดว่าเดี๋ยวคงดีขึ้น"
      fact_ids: [K1]
    - learner_th: "มีน้ำเดินหรือเปล่า รู้สึกว่ามีน้ำไหลออกมาไหม"
      patient_th: "มีน้ำใส ๆ ไหลออกมาน่ะ กลั้นไม่ได้เหมือนตอนปัสสาวะเล็ดเลย"
      fact_ids: [H1]
    - learner_th: "มีมูกออกมาด้วยไหม"
      patient_th: "มีมูกปนเลือดออกมาด้วย เราเห็นแล้วก็เริ่มกังวล"
      fact_ids: [H2]
    - learner_th: "ปวดท้องบ่อยแค่ไหน พอนอนพักแล้วดีขึ้นไหม"
      patient_th: "มันปวดถี่ขึ้นเรื่อย ๆ เลย ลองนอนพักแล้วก็ยังไม่ทุเลา"
      fact_ids: [H3]
    - learner_th: "แล้วลูกดิ้นเหมือนเดิมไหม"
      patient_th: "เรารู้สึกว่าลูกดิ้นน้อยลงกว่าปกตินะ ไม่เหมือนที่เคยรู้สึก"
      fact_ids: [H4]
    - learner_th: "กระเป๋าเตรียมคลอดอยู่ตรงไหน เตรียมเอกสารไว้แล้วใช่ไหม"
      patient_th: "สมุดบันทึกสุขภาพแม่และเด็กกับบัตรประชาชนของเราสองคนอยู่ในกระเป๋าเตรียมคลอดแล้วนะ"
      fact_ids: [H5]
    - learner_th: "ผมเข้าใจนะ ไม่ต้องกลัว ผมอยู่ตรงนี้ เราจะไปด้วยกัน"
      patient_th: "ขอบคุณนะ มีเธออยู่ด้วยเราก็อุ่นใจขึ้น ช่วยอยู่ข้าง ๆ เราหน่อยนะ"
    - learner_th: "ผมขออธิบายขั้นตอนต่อไปนะ เราจะไปโรงพยาบาลด้วยกัน ผมจะช่วยเตรียมของให้"
      patient_th: "ได้เลย เราไปด้วยกันนะ ฝากช่วยเตรียมของให้ด้วย"

DAD-002:
  case_version: "0.2"
  turns:
    - learner_th: "ตอนนี้รู้สึกยังไงบ้าง เห็นเธอบอกว่าเหนื่อย"
      patient_th: "รู้สึกเหนื่อยอยู่เลย เพิ่งคลอดมาได้ไม่กี่วันเอง ลูกก็นอนอยู่ข้าง ๆ นี่แหละ"
      fact_ids: [K1]
    - learner_th: "คลอดมากี่วันแล้ว ยังไม่กี่วันใช่ไหม"
      patient_th: "ใช่ ยังเพิ่งคลอดมาได้ไม่กี่วัน เราก็เลยคิดว่าอาจจะแค่เหนื่อยน่ะ"
      fact_ids: [K1]
    - learner_th: "ผ้าอนามัยเปลี่ยนบ่อยแค่ไหน เล่าให้เราฟังหน่อย"
      patient_th: "ผ้าอนามัยชุ่มเต็มหนึ่งผืนหรือมากกว่าภายในหนึ่งชั่วโมงเลยนะ แล้วก็มีลิ่มเลือดก้อนใหญ่ออกมาด้วย"
      fact_ids: [H1]
    - learner_th: "น้ำคาวปลามีกลิ่นไหม"
      patient_th: "มีกลิ่นเหม็นน่ะ เราก็รู้สึกว่ามันไม่เหมือนเดิม"
      fact_ids: [H2]
    - learner_th: "มีไข้ไหม รู้สึกตัวร้อนหรือเปล่า"
      patient_th: "ตัวร้อนเหมือนมีไข้ตั้งแต่เมื่อวานแล้ว ยังรู้สึกอยู่เลย"
      fact_ids: [H3]
    - learner_th: "ช่วงนี้อารมณ์เป็นยังไงบ้าง เล่าให้เราฟังได้นะ"
      patient_th: "เราร้องไห้โดยไม่มีสาเหตุมาหลายวันแล้ว รู้สึกสิ้นหวังจนบางครั้งเคยคิดอยากทำร้ายตัวเองหรือลูก พูดออกมาก็ยาก แต่เราอยากให้เธอรู้นะ"
      fact_ids: [H4]
    - learner_th: "ปวดหัวไหม แล้วมองเห็นชัดเหมือนเดิมหรือเปล่า"
      patient_th: "ปวดศีรษะไม่หายเลย แล้วก็มองเห็นพร่ามัวด้วย"
      fact_ids: [H5]
    - learner_th: "อยากให้ผมช่วยอะไรไหม บอกได้เลยนะ"
      patient_th: "ช่วยอุ้มลูกกับช่วยงานบ้านให้หน่อยได้ไหม เราอยากได้พักบ้าง"
      fact_ids: [H6]
    - learner_th: "ผมเข้าใจนะ ไม่ต้องกลัว ผมอยู่ตรงนี้ เราจะไปด้วยกัน"
      patient_th: "ขอบคุณที่ฟังเรานะ เราไม่ค่อยกล้าพูดเรื่องนี้ แต่มีเธอรับฟังแล้วรู้สึกอุ่นใจขึ้น"
    - learner_th: "ผมขออธิบายขั้นตอนต่อไปนะ เราจะไปโรงพยาบาลด้วยกัน แล้วเล่าอาการให้เจ้าหน้าที่ฟัง"
      patient_th: "ได้ เราอยากให้ช่วยพาไป ฝากช่วยเล่าให้เจ้าหน้าที่ฟังด้วยนะ"

MOM-001:
  case_version: "0.2"
  turns:
    - learner_th: "ช่วงนี้เป็นยังไงบ้าง เห็นเธอบอกว่าไม่ค่อยสบาย"
      patient_th: "ไม่ค่อยสบายตัวน่ะ ใกล้ครบกำหนดแล้วด้วย แต่ตอนแรกเราก็คิดว่าคงไม่เป็นไร"
      fact_ids: [K1]
    - learner_th: "เริ่มรู้สึกแบบนี้ตั้งแต่เมื่อไหร่ พอจำได้ไหม"
      patient_th: "เราไม่แน่ใจว่าเริ่มตอนไหน ขอค่อย ๆ นึกแล้วเล่าให้ฟังนะ"
    - learner_th: "ลูกดิ้นเหมือนเดิมไหม"
      patient_th: "ลูกดิ้นน้อยลงตั้งแต่เมื่อคืนเลย เรารู้สึกได้ว่าไม่เหมือนปกติ"
      fact_ids: [H1]
    - learner_th: "ปวดหัวบ้างไหม เล่าเรื่องนี้ให้เราฟังหน่อย"
      patient_th: "ปวดศีรษะมากไม่ยอมหาย กินยาแล้วก็ไม่ดีขึ้น แถมตาพร่ามัวด้วย"
      fact_ids: [H2]
    - learner_th: "หน้าหรือมือบวมไหม"
      patient_th: "หน้าและมือบวมมากกว่าปกติเลย แหวนที่เคยใส่ก็ใส่ไม่ได้แล้ว"
      fact_ids: [H3]
    - learner_th: "มีเลือดออกไหม"
      patient_th: "มีเลือดออกทางช่องคลอดด้วยน่ะ เราเริ่มกังวลแล้ว"
      fact_ids: [H4]
    - learner_th: "ปวดท้องรุนแรงไหม ปวดตรงไหนบ้าง"
      patient_th: "ปวดท้องรุนแรงไม่หายเลย แล้วก็จุกแน่นใต้ชายโครงด้านขวาด้วย"
      fact_ids: [H5]
    - learner_th: "พรุ่งนี้มีนัดหมอไหม"
      patient_th: "มีนัดฝากครรภ์ที่โรงพยาบาลพรุ่งนี้อยู่แล้ว เราเลยลังเลว่าจะรอถึงพรุ่งนี้ดีไหม"
      fact_ids: [H6]
    - learner_th: "เข้าใจนะ ไม่ต้องกลัว เราอยู่ตรงนี้ ขอบใจที่เล่าให้ฟัง"
      patient_th: "ขอบใจนะ เรากำลังกังวลอยู่เลย พอเธอรับฟังแบบนี้ก็กล้าเล่าให้ฟังมากขึ้น"
    - learner_th: "เราขออธิบายขั้นตอนต่อไปนะ เราจะพาเธอไปโรงพยาบาล แล้วช่วยเล่าอาการให้เจ้าหน้าที่ฟัง"
      patient_th: "ตกลง เราไปด้วยกันนะ ช่วยอยู่เป็นเพื่อนเราด้วย"

MOM-002:
  case_version: "0.2"
  turns:
    - learner_th: "ช่วงนี้เป็นยังไงบ้าง ได้พักบ้างไหม"
      patient_th: "เพิ่งคลอดมาได้ไม่นานน่ะ ตอนนี้คุณยายชวนให้อยู่ไฟกับทับหม้อเกลือ เราเลยอยากคุยกับเธอก่อน"
      fact_ids: [K1]
    - learner_th: "คลอดมากี่วันแล้ว พอเล่าให้ฟังได้ไหม"
      patient_th: "ยังเพิ่งคลอดมาได้ไม่นานเลย เรื่องเวลาที่แน่นอนขอเช็กให้ชัดก่อนนะ"
      fact_ids: [K1]
    - learner_th: "คลอดด้วยวิธีไหนจ๊ะ"
      patient_th: "เราผ่าคลอดมาน่ะ ยังไม่ถึงหนึ่งเดือนเลย แผลก็ยังไม่หายสนิท"
      fact_ids: [H1]
    - learner_th: "มีไข้ไหม รู้สึกตัวร้อนหรือเปล่า"
      patient_th: "ตัวร้อนมีไข้ตั้งแต่เมื่อวานแล้ว ยังรู้สึกไม่ค่อยสบายอยู่เลย"
      fact_ids: [H2]
    - learner_th: "น้ำคาวปลามีกลิ่นไหม"
      patient_th: "มีกลิ่นเหม็นน่ะ เราเองก็เริ่มไม่สบายใจแล้ว"
      fact_ids: [H3]
    - learner_th: "เวียนศีรษะไหม โดยเฉพาะตอนลุกขึ้น"
      patient_th: "เวลาลุกขึ้นยืนจะหน้ามืดเวียนศีรษะเลย"
      fact_ids: [H4]
    - learner_th: "คุณยายให้กินยาอะไร รู้ไหมว่าใส่อะไรบ้าง"
      patient_th: "เป็นยาต้มที่คุณยายเตรียมให้น่ะ เราไม่รู้ว่าใส่อะไรบ้าง แล้วก็ไม่ได้มาจากผู้ประกอบวิชาชีพด้วย"
      fact_ids: [H5]
    - learner_th: "ตอนท้องเคยมีเรื่องความดันไหม"
      patient_th: "เคยถูกบอกว่าความดันสูงมากตอนท้องน่ะ"
      fact_ids: [H6]
    - learner_th: "เข้าใจนะ ไม่ต้องกลัว เราอยู่ตรงนี้ ค่อย ๆ เล่าได้เลย"
      patient_th: "ขอบใจนะ เราเกรงใจคุณยายด้วย แต่ก็อยากให้แน่ใจก่อนว่าเราควรทำยังไง"
    - learner_th: "เราขออธิบายขั้นตอนต่อไปนะ เราจะพาเธอไปพบแพทย์ แล้วบอกอาการที่เธอเล่าให้ฟังด้วย"
      patient_th: "ได้เลย ช่วยไปเป็นเพื่อนเราหน่อยนะ เราจะได้เล่าเรื่องทั้งหมดให้ฟัง"

PP-001:
  case_version: "0.2"
  turns:
    - learner_th: "สวัสดีค่ะ วันนี้มาด้วยเรื่องอะไรคะ"
      patient_th: "สวัสดีค่ะ เพิ่งคลอดมาได้ 10 วัน รู้สึกเพลีย เลยอยากมานวดกับทับหม้อเกลือค่ะ"
      fact_ids: [K1]
    - learner_th: "คลอดมากี่วันแล้วคะ ขอทวนข้อมูลอีกครั้งนะคะ"
      patient_th: "คลอดมาได้ 10 วัน ยังรู้สึกเพลียอยู่เลยค่ะ"
      fact_ids: [K1]
    - learner_th: "คลอดด้วยวิธีไหนคะ"
      patient_th: "คลอดทางช่องคลอดค่ะ"
      fact_ids: [H3]
    - learner_th: "ตอนนี้ทานยาอะไรอยู่บ้างคะ"
      patient_th: "เรื่องยาขอเช็กให้แน่ใจก่อนนะคะ ยังตอบรายละเอียดตอนนี้ไม่ได้ค่ะ"
    - learner_th: "ผ้าอนามัยเปลี่ยนบ่อยแค่ไหนคะ"
      patient_th: "ตั้งแต่เช้าเลือดออกมากขึ้นค่ะ ผ้าอนามัยชุ่มเต็มมากกว่า 1 แผ่นต่อชั่วโมง จนกังวลแล้วค่ะ"
      fact_ids: [H1]
    - learner_th: "มีอาการเวียนศีรษะไหมคะ"
      patient_th: "มีค่ะ เวลาเปลี่ยนท่าจะเวียนศีรษะขึ้นมา"
      fact_ids: [H2]
    - learner_th: "เข้าใจความรู้สึกนะคะ ขอบคุณที่เล่าให้ฟังค่ะ"
      patient_th: "ขอบคุณที่รับฟังนะคะ ตอนแรกก็คิดว่าแค่เพลีย เลยอยากมาฟื้นฟูให้สบายขึ้นค่ะ"
      fact_ids: [K1]
    - learner_th: "ขออธิบายขั้นตอนต่อไปนะคะ วันนี้เราจะส่งต่อให้โรงพยาบาลประเมินก่อนค่ะ"
      patient_th: "เข้าใจแล้วค่ะ ถ้าอย่างนั้นขอให้ช่วยประสานเรื่องส่งต่อให้ด้วยนะคะ"

STF-002:
  case_version: "0.2"
  turns:
    - learner_th: "สวัสดีค่ะ วันนี้มาด้วยเรื่องอะไรคะ"
      patient_th: "สวัสดีค่ะ ท้องใกล้ครบกำหนดแล้ว ปวดหลัง เลยอยากมานวดกับประคบให้สบายขึ้นค่ะ"
      fact_ids: [K1]
    - learner_th: "ตั้งครรภ์ได้กี่เดือนแล้วคะ"
      patient_th: "ตอนนี้ใกล้ครบกำหนดคลอดแล้วค่ะ"
      fact_ids: [K1]
    - learner_th: "ปวดศีรษะไหมคะ"
      patient_th: "มีปวดศีรษะมากขึ้นมาใหม่ค่ะ ลองกินยาแล้วก็ยังไม่ทุเลาเลย"
      fact_ids: [H1]
    - learner_th: "ตามัวหรือตาพร่าไหมคะ"
      patient_th: "ตาพร่ามัวค่ะ บางทีก็เห็นเหมือนมีแสงวาบด้วย"
      fact_ids: [H2]
    - learner_th: "หน้าหรือมือบวมไหมคะ"
      patient_th: "หน้าและมือบวมมากกว่าปกติค่ะ รู้สึกว่าไม่เหมือนเดิมเลย"
      fact_ids: [H3]
    - learner_th: "จุกแน่นใต้ลิ้นปี่ไหมคะ"
      patient_th: "จุกแน่นค่ะ ทั้งใต้ลิ้นปี่แล้วก็ใต้ชายโครงด้านขวาด้วย"
      fact_ids: [H4]
    - learner_th: "ขอวัดความดันก่อนนะคะ"
      patient_th: "ได้ค่ะ วัดได้เลยนะคะ"
      observation_fact_ids: [H5]
    - learner_th: "ลูกดิ้นเหมือนเดิมไหมคะ"
      patient_th: "รู้สึกว่าลูกดิ้นน้อยลงกว่าปกติค่ะ"
      fact_ids: [H6]
    - learner_th: "หมอที่ฝากครรภ์บอกไหมคะว่านวดได้"
      patient_th: "ยังไม่เคยถามหมอที่ฝากครรภ์เลยค่ะ ว่านวดกับประคบได้ไหม"
      fact_ids: [H7]
    - learner_th: "เข้าใจความรู้สึกนะคะ ขอบคุณที่เล่าอาการให้ฟังค่ะ"
      patient_th: "ขอบคุณนะคะ ตอนแรกตั้งใจมานวดเพราะปวดหลัง แต่พอได้เล่าให้ฟังก็อยากให้ช่วยดูให้แน่ใจค่ะ"
      fact_ids: [K1]
    - learner_th: "ขออธิบายขั้นตอนต่อไปนะคะ เราจะพักการนวดไว้ก่อน แล้วประสานส่งต่อให้โรงพยาบาลประเมินค่ะ"
      patient_th: "เข้าใจแล้วค่ะ ขอให้ช่วยประสานให้ด้วยนะคะ จะได้เล่าอาการให้ทางโรงพยาบาลฟังต่อค่ะ"
