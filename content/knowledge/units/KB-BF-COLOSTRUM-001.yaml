id: KB-BF-COLOSTRUM-001
version: 1.0.0
title_th: น้ำนมเหลือง คัมภีร์ และบทสนทนาที่ไม่โทษแม่
audience: parent
care_stage: newborn
domain: 8
evidence_status: synthesis
rights_status: own_summary
publish_status: published
review_basis: knowledge_base_2026
reviewed_on: '2026-10-28'
tags: [colostrum, milk, breastfeeding, intergenerational]
claims:
  - id: c1
    type: tradition
    text_th: ปฐมจินดาและฉันทศาสตร์มีคำอธิบายน้ำนมในบริบทการแพทย์ไทยเดิม ใช้เรียนรู้ว่าคนก่อนสังเกตแม่และเด็กอย่างไร ไม่ใช้วิธีดูสี รส หรือการทดสอบแบบโบราณวินิจฉัยคุณภาพน้ำนมในปัจจุบัน
    locators: [{source_id: S44, locator: 'ย่อหน้าแรก: คัมภีร์กับน้ำนม'}, {source_id: S51, locator: '4-stage KB 2026 §4.1, p.13'}]
    hotspots:
      - {id: h1, label_th: คัมภีร์เดิม, text_th: ปฐมจินดาและฉันทศาสตร์มีคำอธิบายน้ำนมในบริบทการแพทย์ไทยเดิม}
      - {id: h2, label_th: ใช้เรียนรู้, text_th: ใช้เรียนรู้ว่าคนก่อนสังเกตแม่และเด็กอย่างไร}
      - {id: h3, label_th: ไม่ใช้ตรวจ, text_th: ไม่ใช้ดูสี รส หรือทดสอบแบบโบราณวินิจฉัยคุณภาพน้ำนมปัจจุบัน}
  - id: c2
    type: guidance
    text_th: น้ำนมเหลืองคือระยะแรกของน้ำนมหลังคลอด อาจมีสีเหลืองและมีองค์ประกอบช่วยปกป้องทารก จึงไม่ควรทิ้งเพียงเพราะสีหรือความข้น การประเมินว่าลูกกินได้ดีควรดูการกินและการเติบโตร่วมกับทีมดูแล ไม่ใช้สีอย่างเดียว
    locators: [{source_id: S47, locator: 'Early initiation: colostrum and protective factors'}, {source_id: S51, locator: '4-stage KB 2026 §4.1–4.2, p.13'}]
    hotspots:
      - {id: h1, label_th: ระยะแรก, text_th: น้ำนมเหลืองคือระยะแรกของน้ำนมหลังคลอด}
      - {id: h2, label_th: ช่วยปกป้อง, text_th: น้ำนมเหลืองมีองค์ประกอบช่วยปกป้องทารก}
      - {id: h3, label_th: ไม่ควรทิ้ง, text_th: ไม่ควรทิ้งเพียงเพราะสีหรือความข้น}
      - {id: h4, label_th: ประเมินร่วมทีม, text_th: ประเมินการกินและการเติบโตร่วมกับทีมดูแล ไม่ใช้สีอย่างเดียว}
  - id: c3
    type: guidance
    text_th: WHO แนะนำการสนับสนุนให้เริ่มนมแม่ภายในชั่วโมงแรก ให้นมแม่อย่างเดียวในหกเดือนแรก แล้วเริ่มอาหารตามวัยตั้งแต่หกเดือนพร้อมให้นมต่อจนถึงสองปีหรือนานกว่า เป็นแนวทางทั่วไปที่ต้องมีการช่วยเหลือครอบครัว ไม่ใช่เกณฑ์ตำหนิแม่ที่กำลังพบปัญหา
    locators: [{source_id: S46, locator: 'Key facts; Breastfeeding support'}, {source_id: S51, locator: '4-stage KB 2026 §4.2, p.13'}]
    hotspots:
      - {id: h1, label_th: ชั่วโมงแรก, text_th: WHO แนะนำการสนับสนุนให้เริ่มนมแม่ภายในชั่วโมงแรก}
      - {id: h2, label_th: หกเดือนแรก, text_th: WHO แนะนำให้นมแม่อย่างเดียวในหกเดือนแรก}
      - {id: h3, label_th: อาหารตามวัย, text_th: เริ่มอาหารตามวัยตั้งแต่หกเดือนพร้อมให้นมต่อถึงสองปีหรือนานกว่า}
      - {id: h4, label_th: ไม่ตำหนิแม่, text_th: เป็นแนวทางทั่วไปที่ต้องช่วยเหลือครอบครัว ไม่ใช่เกณฑ์ตำหนิแม่}
  - id: c4
    type: service
    text_th: เมื่อให้นมยาก คู่สมรสและญาติช่วยรับฟัง แบ่งงาน และพาไปขอความช่วยเหลือจากผู้ให้คำปรึกษานมแม่ได้ การหาวิธีให้อาหารที่เหมาะสมกับแม่และลูกควรทำกับผู้ประกอบวิชาชีพ ไม่สรุปว่าแม่เลี้ยงไม่ดีหรือธาตุไม่ดี
    locators: [{source_id: S47, locator: 'WHO recommendations: practical support'}, {source_id: S51, locator: '4-stage KB 2026 §4.2, p.13'}]
    hotspots:
      - {id: h1, label_th: ช่วยรับฟัง, text_th: เมื่อให้นมยาก คู่สมรสและญาติช่วยรับฟังได้}
      - {id: h2, label_th: แบ่งงาน, text_th: คู่สมรสและญาติช่วยแบ่งงานได้}
      - {id: h3, label_th: พาไปขอช่วย, text_th: คู่สมรสและญาติพาไปหาผู้ให้คำปรึกษานมแม่ได้}
      - {id: h4, label_th: วิธีให้อาหาร, text_th: หาวิธีให้อาหารที่เหมาะกับแม่และลูกควรทำกับผู้ประกอบวิชาชีพ}
      - {id: h5, label_th: ไม่โทษแม่, text_th: ไม่สรุปว่าแม่เลี้ยงไม่ดีหรือธาตุไม่ดี}
  - id: c5
    type: guidance
    text_th: น้ำนมเปลี่ยนจากระยะน้ำนมเหลืองไปสู่ระยะเปลี่ยนผ่านและน้ำนมสุกตามเวลา การที่สีหรือความข้นต่างจากวันก่อนจึงไม่ใช่หลักฐานเดี่ยวว่าคุณภาพลดลง ควรคุยเรื่องการกินและการเติบโตของลูกร่วมกับทีมดูแล
    locators: [{source_id: S51, locator: '4-stage KB 2026 §4.1, p.13'}]
    hotspots:
      - {id: h1, label_th: ระยะเปลี่ยนผ่าน, text_th: น้ำนมเปลี่ยนจากระยะน้ำนมเหลืองไปสู่ระยะเปลี่ยนผ่าน}
      - {id: h2, label_th: น้ำนมสุก, text_th: แล้วเปลี่ยนไปเป็นน้ำนมสุกตามเวลา}
      - {id: h3, label_th: สีต่างได้, text_th: สีหรือความข้นต่างจากวันก่อนไม่ใช่หลักฐานเดี่ยวว่าคุณภาพลดลง}
      - {id: h4, label_th: คุยกับทีม, text_th: ควรคุยเรื่องการกินและการเติบโตของลูกร่วมกับทีมดูแล}
lens:
  wisdom_th: ถามผู้ใหญ่ว่าเคยได้ยินเรื่องน้ำนมอย่างไร แล้วขอบคุณความตั้งใจที่จะดูแลหลานก่อนอธิบายข้อมูลที่ตรวจสอบได้
  safety_th: ความเปลี่ยนแปลงของน้ำนมมีหลายระยะ ไม่ใช้สีเพียงอย่างเดียวสรุปว่าดีหรือเสีย หากทารกกินได้น้อยลงหรือซึม ให้ขอการประเมิน ไม่รอแก้ด้วยความเชื่อ
  rights_th: ให้แม่มีส่วนตัดสินใจและเข้าถึงความช่วยเหลือเรื่องนมแม่ รวมถึงการให้อาหารที่ปลอดภัยตามบริบทของตน โดยไม่ทำให้รู้สึกผิด
