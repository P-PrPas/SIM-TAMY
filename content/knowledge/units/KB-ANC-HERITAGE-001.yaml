id: KB-ANC-HERITAGE-001
version: 1.0.0
title_th: อ่านปฐมจินดาคู่กับความเข้าใจครรภ์ในวันนี้
audience: parent
care_stage: antenatal
domain: 3
evidence_status: synthesis
rights_status: own_summary
publish_status: published
review_basis: knowledge_base_2026
reviewed_on: '2026-10-28'
tags: [prathomchinda, pregnancy, nausea, food]
claims:
  - id: c1
    type: tradition
    text_th: ปฐมจินดาหรือประถมจินดามีเรื่องการปฏิสนธิ ครรภ์ แม่หลังคลอด ทารก และน้ำนม ภาพพรรณนาทารกในคัมภีร์สะท้อนความรู้ในยุคนั้น ควรอ่านเป็นประวัติศาสตร์ความคิด ไม่ใช้แทนพัฒนาการตัวอ่อนหรือการตรวจครรภ์สมัยใหม่
    locators: [{source_id: S43, locator: 'บทนำและบรรณานุกรม สมุดไทยดำเลขที่ 1009'}, {source_id: S51, locator: '4-stage KB 2026 §1.6, p.5'}]
  - id: c2
    type: guidance
    text_th: ใช้ไตรมาสเป็นแผนการเรียนรู้ปัจจุบัน ช่วงแรกทำความเข้าใจการเปลี่ยนแปลงและเริ่มฝากครรภ์ ช่วงกลางติดตามการเติบโตและนัดตรวจ ช่วงท้ายเตรียมคลอดและแผนขอความช่วยเหลือ อาการและการนัดตรวจของแต่ละคนให้ยึดทีมที่ดูแลจริง
    locators: [{source_id: S51, locator: '4-stage KB 2026 §1.6–1.8, pp.5–6'}, {source_id: S03, locator: 'WHO antenatal care overview'}]
  - id: c3
    type: guidance
    text_th: งานวิจัย GDF15 พบความเชื่อมโยงระหว่างฮอร์โมนจากหน่วยรก–ทารก ความไวของมารดา และอาการคลื่นไส้อาเจียน เป็นตัวอย่างว่าคนตั้งครรภ์อาจมีประสบการณ์ต่างกัน ไม่ใช่หลักฐานว่าแพ้ท้องเพราะจำแนกธาตุผิด และไม่ใช่แบบตรวจวินิจฉัยด้วยตนเอง
    locators: [{source_id: S45, locator: 'Abstract; Summary and conclusions, Nature 625:760–767'}, {source_id: S51, locator: '4-stage KB 2026 §1.7, p.5'}]
  - id: c4
    type: safety
    text_th: ความอยากกินดินหรือสิ่งที่ไม่ใช่อาหารควรนำไปคุยกับทีมสุขภาพ ไม่ใช่ชวนทดลองกินตามเรื่องเล่า ยังไม่ยืนยันคำอ้างว่าปฐมจินดาสอนให้กินดินเพราะเป็นธาตุดิน หากไม่พบต้นฉบับและหน้าที่ตรวจสอบได้
    locators: [{source_id: S51, locator: '4-stage KB 2026 §1.7, p.5'}]
lens:
  wisdom_th: ชวนอ่านว่าคนแต่ละยุคอธิบายการเปลี่ยนแปลงของแม่และลูกอย่างไร โดยระบุชื่อคัมภีร์ให้ถูกต้อง
  safety_th: รับฟังอาการโดยไม่โทษธาตุหรือพฤติกรรมของแม่ และใช้การฝากครรภ์กับคำแนะนำจากทีมสุขภาพเป็นฐานดูแล
  rights_th: คู่สมรสช่วยจดอาการ คำถาม และสิ่งที่ใช้อยู่ไปคุยในนัดได้ การเลือกการดูแลยังเป็นการตัดสินใจร่วมกับผู้ตั้งครรภ์และผู้ประกอบวิชาชีพ
