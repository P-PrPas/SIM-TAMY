id: KB-TM-FOOD-001
version: 1.0.0
title_th: สำรับหลังคลอด จากความห่วงใยสู่การอ่านหลักฐาน
audience: parent
care_stage: postpartum
domain: 10
evidence_status: synthesis
rights_status: own_summary
publish_status: published
review_basis: knowledge_base_2026
reviewed_on: '2026-10-28'
tags: [postpartum-food, herbs, lactation, evidence-limit]
claims:
  - id: c1
    type: tradition
    text_th: อาหารอุ่นและของแสลงเป็นส่วนหนึ่งของความทรงจำครอบครัวไทยที่ต่างกันตามพื้นที่ การเตรียมสำรับให้แม่ยังเป็นโอกาสแบ่งงานและช่วยให้ได้พัก แต่ไม่ควรเหมารวมว่าอาหารทุกเมนูเป็นข้อบังคับจากคัมภีร์
    locators: [{source_id: S51, locator: '4-stage KB 2026 §3.1, §3.5, pp.9,11'}, {source_id: S44, locator: 'ย่อหน้าแรก: ประเพณีหลังคลอดและของแสลง'}]
  - id: c2
    type: guidance
    text_th: เวลาอ่านรายการอาหารไทย ให้ถามถึงส่วนผสม ความหลากหลาย ความสะอาด และอาหารที่แพ้ การอธิบายเรื่องพลังงาน โปรตีน หรือสารอาหารต่างจากการพิสูจน์ว่าเมนูหนึ่งรักษาอาการหรือเพิ่มน้ำนมได้ จึงไม่งดอาหารหลายหมวดเพียงเพราะเรียกว่าของแสลง
    locators: [{source_id: S51, locator: '4-stage KB 2026 §3.5, p.11'}]
  - id: c3
    type: scope
    text_th: งานทดลองปลูกไฟธาตุปี 2025 ในแม่หลังคลอด 60 คนรายงานผลปริมาณน้ำนมวันที่ 2–3 ต่างจากกลุ่มเปรียบเทียบ ส่วนงานปี 2020 ใน 49 คนไม่พบความต่างอย่างมีนัยสำคัญของการเพิ่มปริมาณน้ำนมเฉลี่ยระหว่างกลุ่มภายในสามวัน ผลในเงื่อนไขศึกษาไม่ใช่คำรับรองว่าเหมาะกับแม่ทุกคน
    locators: [{source_id: S48, locator: 'Abstract: methods and results, PMID 41043593'}, {source_id: S49, locator: 'Abstract: between-group mean milk volume, p=0.567'}]
  - id: c4
    type: safety
    text_th: อาหารที่มีสมุนไพรเป็นส่วนผสมกับยาสมุนไพรขนาดรักษาไม่ใช่สิ่งเดียวกัน หากมีปัญหาการให้นม ควรขอผู้ให้คำปรึกษาช่วยประเมินก่อนตัดสินใจใช้ผลิตภัณฑ์ และถามผู้ประกอบวิชาชีพเรื่องส่วนประกอบ ยาที่ใช้ร่วม และข้อห้ามเฉพาะราย
    locators: [{source_id: S51, locator: '4-stage KB 2026 §3.6, p.12'}, {source_id: S47, locator: 'WHO recommendations: practical breastfeeding support'}]
  - id: c5
    type: tradition
    text_th: ใช้แกงเลียง หัวปลี หรือขิงเป็นตัวอย่างสำรวจสำรับของบ้านได้ โดยจดชื่อเมนู ส่วนผสม วิธีปรุง และเรื่องเล่าที่ได้ยิน จากนั้นแยกคำถามด้านสารอาหารออกจากคำอ้างเรื่องเพิ่มน้ำนม รายชื่อเหล่านี้เป็นโจทย์เรียนรู้ ไม่ใช่สูตรอาหารรักษาหรือการรับรองผลของแต่ละเมนู
    locators: [{source_id: S51, locator: '4-stage KB 2026 §3.5, p.11: food-catalog design proposal'}]
lens:
  wisdom_th: ลองเริ่มจากเมนูที่คนในบ้านอยากทำให้แม่ แล้วถามว่าห่วงใยเรื่องอะไรและสืบทอดมาจากใคร
  safety_th: งานวิจัยขนาดเล็กและระยะสั้นไม่ยืนยันผลระยะยาวหรือความเหมาะสมของทุกตำรับ จึงไม่มีสูตรยา ขนาดยา หรือรายการอาหารรักษาเฉพาะคนในบทเรียนนี้
  rights_th: แม่มีสิทธิเลือกอาหารที่ตนรับได้ และขอคำปรึกษาด้านโภชนาการ นมแม่ หรือสมุนไพรจากผู้ประกอบวิชาชีพที่เกี่ยวข้องโดยไม่ถูกกดดัน
