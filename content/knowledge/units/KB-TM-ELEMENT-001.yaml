id: KB-TM-ELEMENT-001
version: 1.0.0
title_th: รู้จักธาตุกำเนิด ธาตุปัจจุบัน และอาหารในวิถีไทย
audience: parent
care_stage: preconception
domain: 10
evidence_status: synthesis
rights_status: own_summary
publish_status: published
review_basis: knowledge_base_2026
reviewed_on: '2026-10-28'
tags: [thai-elements, preconception, food, evidence-boundary]
claims:
  - id: c1
    type: tradition
    text_th: ในกรอบแพทย์แผนไทย ธาตุดินอธิบายโครงสร้าง ธาตุน้ำอธิบายของเหลว ธาตุลมอธิบายการเคลื่อนไหว และธาตุไฟอธิบายความร้อนกับการย่อย เป็นภาษาอธิบายร่างกายในตำรา ไม่ใช่การจับคู่กับอวัยวะหรือฮอร์โมนสมัยใหม่โดยตรง
    locators: [{source_id: S41, locator: 'ธาตุเจ้าเรือน หน้า 1–2'}, {source_id: S51, locator: '4-stage KB 2026 §1.1, p.3'}]
    hotspots:
      - {id: h1, label_th: ธาตุดิน, text_th: ธาตุดินอธิบายโครงสร้างของร่างกาย}
      - {id: h2, label_th: ธาตุน้ำ, text_th: ธาตุน้ำอธิบายของเหลวในร่างกาย}
      - {id: h3, label_th: ธาตุลม, text_th: ธาตุลมอธิบายการเคลื่อนไหว}
      - {id: h4, label_th: ธาตุไฟ, text_th: ธาตุไฟอธิบายความร้อนกับการย่อย}
      - {id: h5, label_th: ภาษาตำรา, text_th: เป็นภาษาอธิบายร่างกายในตำรา ไม่ใช่อวัยวะหรือฮอร์โมนสมัยใหม่โดยตรง}
  - id: c2
    type: tradition
    text_th: ธาตุกำเนิดมีวิธีจำแนกต่างสาย ตำราหนึ่งใช้เดือนจันทรคติที่เริ่มปฏิสนธิ โดยเดือน 5–7 เป็นไฟ 8–10 เป็นลม 11–12 และ 1 เป็นน้ำ 2–4 เป็นดิน ส่วนฉันทศาสตร์จำแนกตามวันเกิด จึงอาจได้คำตอบต่างกัน ต้องบอกเสมอว่าใช้ตำราและวิธีใด
    locators: [{source_id: S41, locator: 'ธาตุเจ้าเรือน หน้า 2'}, {source_id: S51, locator: '4-stage KB 2026 §1.2, pp.3–4'}]
    hotspots:
      - {id: h1, label_th: สองวิธี, text_th: ตำราหนึ่งใช้เดือนจันทรคติที่เริ่มปฏิสนธิ ฉันทศาสตร์ใช้วันเกิด}
      - {id: h2, label_th: บอกที่มาเสมอ, text_th: สองวิธีอาจได้คำตอบต่างกัน ต้องบอกเสมอว่าใช้ตำราและวิธีใด}
  - id: c3
    type: scope
    text_th: การนับย้อนหลังสิบเดือนจากวันเกิดเป็นเพียงการประมาณ ไม่ใช่วันปฏิสนธิที่ทราบแน่ชัด และเดือนไทยจันทรคติไม่ตรงกับเดือนปฏิทินทั่วไป บทเรียนจึงใช้ตัวอย่างสมมติเพื่อเปรียบเทียบแนวคิด ไม่คำนวณธาตุส่วนบุคคลหรือทำนายภาวะมีบุตรยาก
    locators: [{source_id: S51, locator: '4-stage KB 2026 §1.2–1.3, pp.3–4'}]
    hotspots:
      - {id: h1, label_th: แค่ประมาณ, text_th: การนับย้อนหลังสิบเดือนจากวันเกิดเป็นเพียงการประมาณ}
      - {id: h2, label_th: เดือนไม่ตรงกัน, text_th: เดือนไทยจันทรคติไม่ตรงกับเดือนปฏิทินทั่วไป}
      - {id: h3, label_th: ไม่ทำนาย, text_th: ใช้ตัวอย่างสมมติ ไม่คำนวณธาตุส่วนบุคคลหรือทำนายภาวะมีบุตรยาก}
  - id: c4
    type: tradition
    text_th: ธาตุปัจจุบันพิจารณาลักษณะและบริบทชีวิต ในกรอบสมุฏฐานมีทั้งธาตุ อายุ ฤดูกาล เวลา ถิ่นที่อยู่ และพฤติกรรม การบรรยายคนผอมสูงหรือว่องไวว่าใกล้ลักษณะลมเป็นตัวอย่างภาษาตำรา ไม่เพียงพอจะตัดสินสุขภาพหรือการเจริญพันธุ์ของคนนั้น
    locators: [{source_id: S42, locator: 'บทนำเรื่องธาตุกำเนิดและปรกติลักษณะ'}, {source_id: S51, locator: '4-stage KB 2026 §1.3, p.4'}]
    hotspots:
      - {id: h1, label_th: ฤดูกาล, text_th: ฤดูกาลเป็นหนึ่งในบริบทที่ตำราใช้พิจารณาธาตุปัจจุบัน}
      - {id: h2, label_th: เวลา, text_th: เวลาเป็นหนึ่งในบริบทที่ตำราใช้พิจารณาธาตุปัจจุบัน}
      - {id: h3, label_th: อายุ, text_th: อายุเป็นหนึ่งในบริบทที่ตำราใช้พิจารณาธาตุปัจจุบัน}
      - {id: h4, label_th: ถิ่นที่อยู่, text_th: ถิ่นที่อยู่เป็นหนึ่งในบริบทที่ตำราใช้พิจารณาธาตุปัจจุบัน}
      - {id: h5, label_th: พฤติกรรม, text_th: พฤติกรรมเป็นหนึ่งในบริบทที่ตำราใช้พิจารณาธาตุปัจจุบัน}
      - {id: h6, label_th: ไม่ใช่ผลตรวจ, text_th: เป็นตัวอย่างภาษาตำรา ไม่พอจะตัดสินสุขภาพหรือการเจริญพันธุ์}
  - id: c5
    type: tradition
    text_th: ตำราอาหารตามธาตุกล่าวถึงรสฝาด หวาน มัน เค็มสำหรับดิน เปรี้ยวและขมสำหรับน้ำ เผ็ดร้อนสำหรับลม และขม เย็น จืดสำหรับไฟ ใช้เรียนรู้หมวดรสและวัฒนธรรมอาหาร ไม่ใช่คำสั่งจัดอาหารรักษาหรือเหตุให้งดสารอาหารสำคัญระหว่างตั้งครรภ์
    locators: [{source_id: S42, locator: 'หมวดอาหารตามธาตุเจ้าเรือน'}, {source_id: S51, locator: '4-stage KB 2026 §1.4, p.4'}]
    hotspots:
      - {id: h1, label_th: รสของดิน, text_th: ตำราจัดรสฝาด หวาน มัน เค็ม ไว้กับธาตุดิน}
      - {id: h2, label_th: รสของน้ำ, text_th: ตำราจัดรสเปรี้ยวและขมไว้กับธาตุน้ำ}
      - {id: h3, label_th: ลมและไฟ, text_th: เผ็ดร้อนสำหรับลม ส่วนไฟคือขม เย็น จืด}
      - {id: h4, label_th: ไม่ใช่สูตรรักษา, text_th: ใช้เรียนรู้หมวดรสและวัฒนธรรมอาหาร ไม่ใช่คำสั่งจัดอาหารรักษา}
      - {id: h5, label_th: ตั้งครรภ์, text_th: ไม่ใช่เหตุให้งดสารอาหารสำคัญระหว่างตั้งครรภ์}
lens:
  wisdom_th: ลองถามคนในบ้านว่าใช้คำว่าธาตุในความหมายใด แล้วแยกธาตุกำเนิดออกจากการสังเกตพฤติกรรมในปัจจุบัน
  safety_th: การกิน การนอน และกิจกรรมเป็นเรื่องที่คุยกันเพื่อวางแผนดูแลได้ แต่ไม่แปลงเป็นผลตรวจโรคหรือความสามารถในการมีบุตร
  rights_th: เตรียมคำถามเรื่องสุขภาพก่อนตั้งครรภ์ไปคุยกับทีมสุขภาพ ส่วนการอ่านตำราเชิงประวัติศาสตร์ไม่ใช่ใบรับรองการประเมินบุคคล
