id: KB-TM-REST-001
version: 1.0.0
title_th: การฟื้นฟูหลังคลอดแบบไทย นวด ประคบ อยู่ไฟ และทับหม้อเกลือ
audience: parent
care_stage: postpartum
domain: 10
evidence_status: synthesis
rights_status: own_summary
publish_status: published
review_basis: knowledge_base_2026
reviewed_on: '2026-10-28'
tags: [thai-tradition, postpartum, massage, compress, herbal-steam, salt-pot, uafai, integration]
claims:
  - id: c1
    type: tradition
    text_th: หลักสูตรการแพทย์แผนไทยที่ตรวจพบมีวิชาผดุงครรภ์ไทย โดยอ้างหลักคิด คัมภีร์ และกิจกรรมทางวัฒนธรรม รวมถึงหลักการดูแลหญิงตั้งครรภ์ ระยะคลอด และหลังคลอด การแยกภาวะผิดปกติ และการส่งต่อ
    locators:
      - {source_id: S15, locator: 'KB 2026 §4.1, p.6'}
      - {source_id: S16, locator: 'KB 2026 §4.1, p.6'}
  - id: c2
    type: tradition
    text_th: การนวดและประคบสมุนไพร การอยู่ไฟ การอบสมุนไพร และการทับหม้อเกลือ เป็นความรู้และวิถีการดูแลหลังคลอดตามบริบทไทย ที่ถ่ายทอดในชุมชนและสถาบันฝึก
    locators:
      - {source_id: S15, locator: 'KB 2026 §4.1, p.6'}
      - {source_id: S16, locator: 'KB 2026 §4.1, p.6'}
  - id: c3
    type: guidance
    text_th: งานทบทวนเชิงสำรวจในวารสาร Journal of Health Science of Thailand ปี 2025 ศึกษาสถานพยาบาลที่เป็นแหล่งฝึก 101 แห่ง และพบการใช้กิจกรรมเหล่านี้ แต่การสำรวจว่าทำกันแพร่หลายไม่ได้ยืนยันว่าทุกกิจกรรมได้ผลหรือปลอดภัย
    locators:
      - {source_id: S22, locator: 'KB 2026 §4.2, p.6'}
  - id: c4
    type: service
    text_th: คู่มือผดุงครรภ์ไทยแบบบูรณาการของกรมการแพทย์แผนไทยฯ ลงวันที่ 26 สิงหาคม 2569 เป็นจุดเริ่มต้นสำคัญสำหรับการออกแบบบริการร่วมกับทีมสุขภาพ แต่ก่อนนำไปเป็นขั้นตอนมาตรฐานของสถานบริการ ต้องอ่านฉบับเต็มและให้ผู้รับผิดชอบวิชาชีพรับรองข้อปฏิบัติจริง
    locators:
      - {source_id: S19, locator: 'KB 2026 §4.3, p.6'}
lens:
  wisdom_th: การนวด ประคบ อยู่ไฟ อบสมุนไพร และทับหม้อเกลือ เป็นส่วนหนึ่งของวิถีการดูแลหลังคลอดแบบไทย ถ่ายทอดในครอบครัวและชุมชน และมีสอนในหลักสูตรการแพทย์แผนไทย
  safety_th: การที่หลายแห่งใช้กิจกรรมเหล่านี้ไม่ได้แปลว่าได้ผลหรือปลอดภัยเสมอไป ต้องดูช่วงเวลา ข้อห้าม และภาวะของแต่ละคนก่อนทุกครั้ง
  rights_th: ถามให้ชัดว่าผู้ให้บริการมีสิทธิให้บริการหรือไม่ และตรวจภาวะทางการแพทย์กับผู้ให้บริการที่มีสิทธิก่อนรับบริการ
contraindications_th:
  - ไม่ใช้เนื้อหานี้เป็นคำแนะนำให้ปฏิบัติเองแก่ผู้หลังคลอดที่มีอาการเสี่ยง ต้องตรวจภาวะทางการแพทย์และผู้ให้บริการที่มีสิทธิก่อนทุกครั้ง
escalation_th: หากมีอาการเสี่ยงหลังคลอด ให้ตรวจภาวะทางการแพทย์กับผู้ให้บริการที่มีสิทธิก่อนรับบริการฟื้นฟูแบบไทย
