id: KB-TM-SAFE-001
version: 1.0.0
title_th: ก่อนรับบริการฟื้นฟูแบบไทย ควรตรวจอะไรบ้าง
audience: parent
care_stage: postpartum
domain: 10
evidence_status: synthesis
rights_status: own_summary
publish_status: published
review_basis: knowledge_base_2026
reviewed_on: '2026-10-28'
tags: [thai-tradition, postpartum, safety-check, contraindication, caesarean, heat, stop-criteria, referral, provider]
claims:
  - id: c1
    type: safety
    text_th: หลักการประเมินกิจกรรมแบบไทยก่อนนำมาเผยแพร่ ต้องตรวจช่วงเวลา ข้อห้าม แผลผ่าคลอด ความร้อน และผู้ให้บริการ
    locators:
      - {source_id: S19, locator: 'KB 2026 §4.1 หลักการประเมินก่อนเผยแพร่, p.6'}
      - {source_id: S22, locator: 'KB 2026 §4.1 หลักการประเมินก่อนเผยแพร่, p.6'}
  - id: c2
    type: safety
    text_th: ต้องประเมินความเสี่ยงจากความร้อน ได้แก่ การไหม้ การขาดน้ำ และความดัน รวมทั้งข้อจำกัดของแต่ละกิจกรรม
    locators:
      - {source_id: S22, locator: 'KB 2026 §4.1 หลักการประเมินก่อนเผยแพร่, p.6'}
  - id: c3
    type: safety
    text_th: ต้องตรวจส่วนประกอบ ปฏิกิริยาระหว่างยา และข้อห้ามเฉพาะของแต่ละตำรับ
    locators:
      - {source_id: S23, locator: 'KB 2026 §4.1 หลักการประเมินก่อนเผยแพร่ และ §4.2, p.6'}
  - id: c4
    type: scope
    text_th: ต้องมีเกณฑ์หยุดบริการ ระบุว่าใครเป็นผู้ส่งต่อ และบันทึกข้อมูล นอกจากนี้ไม่ควรสรุปว่าผู้สืบทอดภูมิปัญญามีใบอนุญาตหรือมีสิทธิทำคลอด
    locators:
      - {source_id: S20, locator: 'KB 2026 §4.1 หลักการประเมินก่อนเผยแพร่, p.6'}
      - {source_id: S21, locator: 'KB 2026 §4.1 หลักการประเมินก่อนเผยแพร่, p.6'}
  - id: c5
    type: safety
    text_th: ห้ามนำเนื้อหาสมุนไพร การประคบร้อน หรือหัตถการไปใช้เป็นคำแนะนำให้ปฏิบัติเองแก่หญิงตั้งครรภ์หรือหลังคลอดที่มีอาการเสี่ยง ต้องตรวจภาวะทางการแพทย์และผู้ให้บริการที่มีสิทธิก่อนทุกครั้ง
    locators:
      - {source_id: S19, locator: 'KB 2026 §4.3, p.6'}
  - id: c6
    type: safety
    text_th: ในฉากจำลองที่ผู้รับบริการอยากได้บริการฟื้นฟูแบบไทยแต่รายงานเลือดออกผิดปกติ ผู้เรียนควรซักถามความเสี่ยง ตัดสินใจหยุดบริการ และส่งต่ออย่างเร่งด่วน
    locators:
      - {source_id: S06, locator: 'KB 2026 §10, p.12'}
      - {source_id: S36, locator: 'KB 2026 §10, p.12'}
lens:
  wisdom_th: ภูมิปัญญาไทยด้านการดูแลหลังคลอดมีหลักคิดและวิธีปฏิบัติของตนเอง และ KB เสนอให้บูรณาการส่วนที่เหมาะสมเข้ากับระบบสุขภาพปัจจุบัน
  safety_th: ก่อนรับบริการต้องตรวจช่วงเวลา ข้อห้าม แผลผ่าคลอด ความร้อน (ไหม้ ขาดน้ำ ความดัน) และผู้ให้บริการ และต้องมีเกณฑ์หยุดบริการ
  rights_th: ถามให้ชัดว่าใครเป็นผู้ให้บริการ มีสิทธิให้บริการหรือไม่ และใครเป็นผู้ส่งต่อเมื่อพบอาการผิดปกติ
contraindications_th:
  - ไม่ใช้เนื้อหานี้เป็นคำแนะนำให้ปฏิบัติเองแก่หญิงตั้งครรภ์หรือหลังคลอดที่มีอาการเสี่ยง ต้องตรวจภาวะทางการแพทย์และผู้ให้บริการที่มีสิทธิก่อนทุกครั้ง
escalation_th: หากพบอาการผิดปกติก่อนหรือระหว่างบริการ ให้หยุดบริการและส่งต่อไปยังผู้ให้บริการสุขภาพที่มีสิทธิ
