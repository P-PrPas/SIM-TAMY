id: KB-TM-HERB-001
version: 1.0.0
title_th: สมุนไพรต้องดูเป็นรายตำรับและตามภาวะของแต่ละคน
audience: parent
care_stage: postpartum
domain: 10
evidence_status: synthesis
rights_status: own_summary
publish_status: published
review_basis: knowledge_base_2026
reviewed_on: '2026-10-28'
tags: [herb, thai-tradition, contraindication, prasai, pregnancy, postpartum-bleeding, natural, safety]
claims:
  - id: c1
    type: safety
    text_th: สมุนไพรต้องประเมินตามตำรับและภาวะของผู้ป่วยแต่ละคน ไม่ควรเหมารวมว่าปลอดภัย
    locators:
      - {source_id: S23, locator: 'KB 2026 §4.2, p.6'}
  - id: c2
    type: safety
    text_th: ตัวอย่าง ฐานข้อมูลของกรมการแพทย์แผนไทยฯ ระบุข้อห้ามของตำรับประสะไพลสำหรับหญิงตั้งครรภ์และผู้ตกเลือดหลังคลอด
    locators:
      - {source_id: S23, locator: 'KB 2026 §4.2, p.6'}
  - id: c3
    type: safety
    text_th: คำว่า ธรรมชาติ ไม่ใช่การรับรองความปลอดภัย
    locators:
      - {source_id: S23, locator: 'KB 2026 §10, p.12'}
  - id: c4
    type: safety
    text_th: ก่อนนำสมุนไพรมาใช้ ต้องตรวจส่วนประกอบ ปฏิกิริยาระหว่างยา และข้อห้ามเฉพาะของแต่ละตำรับ
    locators:
      - {source_id: S23, locator: 'KB 2026 §4.1 หลักการประเมินก่อนเผยแพร่, p.6'}
  - id: c5
    type: scope
    text_th: ห้ามนำเนื้อหาสมุนไพรไปใช้เป็นคำแนะนำให้ปฏิบัติเองแก่หญิงตั้งครรภ์หรือหลังคลอดที่มีอาการเสี่ยง ต้องตรวจภาวะทางการแพทย์และผู้ให้บริการที่มีสิทธิก่อนทุกครั้ง
    locators:
      - {source_id: S19, locator: 'KB 2026 §4.3, p.6'}
lens:
  wisdom_th: สมุนไพรเป็นส่วนหนึ่งของวิถีการดูแลหลังคลอดแบบไทย และแต่ละตำรับมีส่วนประกอบและข้อห้ามเฉพาะของตนเอง
  safety_th: สมุนไพรต้องประเมินเป็นรายตำรับและตามภาวะของแต่ละคน ไม่ควรเหมารวมว่าปลอดภัยเพราะเป็นธรรมชาติ เช่น ประสะไพลมีข้อห้ามในหญิงตั้งครรภ์และผู้ตกเลือดหลังคลอด
  rights_th: ตรวจภาวะทางการแพทย์และผู้ให้บริการที่มีสิทธิก่อนใช้สมุนไพรทุกครั้ง
contraindications_th:
  - ประสะไพล มีข้อห้ามสำหรับหญิงตั้งครรภ์และผู้ตกเลือดหลังคลอด ตามฐานข้อมูลที่ KB อ้างถึง ควรตรวจฉบับต้นทางเสมอ
escalation_th: หากสงสัยว่าสมุนไพรที่ได้รับมาเหมาะกับตนเองหรือไม่ ให้ปรึกษาผู้ให้บริการที่มีสิทธิหรือทีมสุขภาพก่อนใช้
