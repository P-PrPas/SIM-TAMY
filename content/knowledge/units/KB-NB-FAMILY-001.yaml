id: KB-NB-FAMILY-001
version: 1.0.0
title_th: จากอ้อมกอดคนในบ้านสู่แผนดูแลลูก 0–24 เดือน
audience: parent
care_stage: newborn
domain: 7
evidence_status: synthesis
rights_status: own_summary
publish_status: published
review_basis: knowledge_base_2026
reviewed_on: '2026-10-28'
tags: [family-support, responsive-care, safe-sleep, complementary-feeding]
claims:
  - id: c1
    type: tradition
    text_th: คำสอนและประสบการณ์เลี้ยงลูกจากผู้ใหญ่เป็นจุดเริ่มบทสนทนาได้ ครอบครัวอาจเก็บการช่วยกันอุ้ม ปลอบ และแบ่งงานไว้ พร้อมตรวจข้อปฏิบัติแต่ละอย่างกับความปลอดภัยในปัจจุบัน ไม่ต้องทำตามทุกเรื่องหรือปฏิเสธผู้ใหญ่ทั้งหมด
    locators: [{source_id: S51, locator: '4-stage KB 2026 §4.5, p.14'}]
  - id: c2
    type: safety
    text_th: การนอนของทารกควรเป็นท่านอนหงายบนพื้นเรียบและแน่นที่เหมาะสม โดยไม่มีหมอน ตุ๊กตา หรือเครื่องนอนนุ่มในพื้นที่นอน ความห่วงว่าหลานจะไม่สบายตัวจึงควรคุยกันเพื่อหาทางเลือกที่ปลอดภัย
    locators: [{source_id: S50, locator: 'Creating a safe sleep area for babies'}, {source_id: S51, locator: '4-stage KB 2026 §4.3, p.14'}]
  - id: c3
    type: guidance
    text_th: เส้นทาง 0–24 เดือนค่อย ๆ เปลี่ยนจากการให้นมและการตอบสนองสัญญาณลูก ไปสู่อาหารตามวัยตั้งแต่ประมาณหกเดือน การเล่น การเคลื่อนไหว และการสื่อสาร ควรติดตามพัฒนาการและวัคซีนตามนัด ไม่ใช้ลักษณะการเกิดทำนายว่าเด็กจะเป็นคนแบบใด
    locators: [{source_id: S46, locator: 'Key facts; Complementary feeding'}, {source_id: S51, locator: '4-stage KB 2026 §4.4, p.14'}]
  - id: c4
    type: service
    text_th: หากพ่อแม่ ญาติ หรือผู้ดูแลอยู่คนละที่ ลองทำบันทึกที่ทุกคนใช้ร่วมกันว่าใครดูแลช่วงไหน ลูกกินและพักอย่างไร นัดต่อไปเมื่อไร และจะติดต่อใครเมื่อกังวล นี่เป็นแนวทางจัดการของครอบครัว ไม่ใช่หลักฐานว่าครอบครัวรูปแบบใดเลี้ยงลูกได้ดีกว่า
    locators: [{source_id: S51, locator: '4-stage KB 2026 §4.4–4.6, pp.14–15: design proposal'}]
  - id: c5
    type: scope
    text_th: ใช้ช่วงวัยเป็นหัวข้อเรียนร่วมกันได้ เช่น 0–4 เดือนฝึกอ่านสัญญาณหิวและปลอบลูก 5–8 เดือนเรียนรู้อาหารตามวัยที่เริ่มตั้งแต่ประมาณหกเดือน 9–12 เดือนเน้นการสำรวจบ้านอย่างปลอดภัย 13–18 เดือนเน้นภาษาและการตอบสนอง และ 19–24 เดือนเน้นการเล่นกับการสื่อสาร หัวข้อเหล่านี้ไม่ใช่เส้นตายวัดพัฒนาการของเด็กแต่ละคน
    locators: [{source_id: S51, locator: '4-stage KB 2026 §4.4, p.14: curriculum outline'}]
lens:
  wisdom_th: ความช่วยเหลือจากปู่ย่าตายายเป็นทุนของครอบครัวที่นำมาคุยกับวิธีดูแลสมัยใหม่ได้ แม้จะช่วยกันผ่านโทรศัพท์หรือผลัดเวรก็ตาม
  safety_th: แยกสิ่งที่เป็นความคุ้นเคยออกจากข้อปฏิบัติด้านความปลอดภัย และส่งต่อข้อที่ตกลงกันให้ผู้ดูแลทุกคนเข้าใจตรงกัน
  rights_th: รับฟังข้อจำกัดการทำงาน ค่าใช้จ่าย และกำลังของผู้ดูแล โดยร่วมกันหาความช่วยเหลือแทนการตัดสินว่าพ่อแม่ควรทำได้เองทั้งหมด
