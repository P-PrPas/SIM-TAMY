id: KB-RIGHTS-CONSENT-001
version: 1.0.0
title_th: การสื่อสารอย่างเคารพ ความยินยอม และการตัดสินใจร่วม
audience: parent
care_stage: postpartum
domain: 1
evidence_status: secondary
rights_status: own_summary
publish_status: published
review_basis: knowledge_base_2026
reviewed_on: '2026-10-28'
tags: [consent, respectful-care, woman-centred, shared-decision, communication, dignity, privacy]
claims:
  - id: c1
    type: guidance
    text_th: การผดุงครรภ์สมัยใหม่เน้นการดูแลที่เคารพสิทธิและยึดผู้หญิงเป็นศูนย์กลาง (woman-centred care) รักษาความปลอดภัย และเคารพทางเลือก
    locators:
      - {source_id: S01, locator: 'KB 2026 สรุปสำหรับอ่านก่อน, p.2'}
      - {source_id: S04, locator: 'KB 2026 สรุปสำหรับอ่านก่อน, p.2'}
  - id: c2
    type: guidance
    text_th: WHO ปี 2018 เน้นการดูแลที่เคารพและยึดผู้คลอดเป็นศูนย์กลาง สื่อสารให้ชัด และสนับสนุนผู้คลอด
    locators:
      - {source_id: S04, locator: 'KB 2026 §3.2, p.5'}
  - id: c3
    type: guidance
    text_th: เรื่องสิทธิและการสื่อสารครอบคลุมความยินยอม ศักดิ์ศรี ความเป็นส่วนตัว และการตัดสินใจร่วม
    locators:
      - {source_id: S01, locator: 'KB 2026 §2 หมวด 01, p.4'}
      - {source_id: S04, locator: 'KB 2026 §2 หมวด 01, p.4'}
  - id: c4
    type: guidance
    text_th: การเคารพสิทธิหมายถึงให้ข้อมูลประกอบการตัดสินใจ ไม่บังคับ และไม่บิดเบือนข้อมูล
    locators:
      - {source_id: S04, locator: 'KB 2026 §10, p.12'}
  - id: c5
    type: guidance
    text_th: ในฉากที่มีความเชื่อต่างกัน ผู้เรียนฝึกแยกความเชื่อออกจากข้อเท็จจริง และตรวจข้อจำกัดของแต่ละวิธี
    locators:
      - {source_id: S23, locator: 'KB 2026 §10, p.12'}
