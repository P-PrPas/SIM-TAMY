id: KB-IP-HERITAGE-001
version: 1.0.0
title_th: จากหมอตำแยสู่แผนคลอดที่เคารพแม่
audience: parent
care_stage: intrapartum
domain: 4
evidence_status: synthesis
rights_status: own_summary
publish_status: published
review_basis: knowledge_base_2026
reviewed_on: '2026-10-28'
tags: [birth-history, birth-plan, consent, thai-midwifery]
claims:
  - id: c1
    type: tradition
    text_th: การผดุงครรภ์ไทยมีรากจากคัมภีร์และการดูแลในชุมชน ต่อมามีการเผยแพร่วิชาตะวันตกและคัมภีร์ครรภ์ทรักษาของหมอบรัดเล การอ่านประวัติศาสตร์ช่วยเข้าใจความไว้ใจของครอบครัว แต่ไม่ได้ทำให้ผู้เรียนมีสิทธิทำหัตถการช่วยคลอด
    locators: [{source_id: S44, locator: 'แรกรับวิชาผดุงครรภ์แผนตะวันตกในสยาม ย่อหน้า 1–2'}, {source_id: S51, locator: '4-stage KB 2026 §2.1, p.7'}]
  - id: c2
    type: scope
    text_th: เรื่องเล่าวันเกิด ฤกษ์ หรือท่าทารกเป็นหัวข้อสนทนาทางวัฒนธรรม ไม่ใช้กำหนดอาชีพ บุคลิก หรืออนาคตของเด็ก ความแตกต่างของวิธีคลอดเป็นเรื่องให้ถามทีมดูแล ไม่ใช่การจัดคุณค่าของแม่หรือลูก
    locators: [{source_id: S51, locator: '4-stage KB 2026 §2.2–2.4, pp.7–8'}]
  - id: c3
    type: guidance
    text_th: การดูแลระหว่างคลอดที่ยึดผู้คลอดเป็นศูนย์กลางให้ความสำคัญกับศักดิ์ศรี ข้อมูลที่เข้าใจได้ และการมีส่วนร่วมตัดสินใจ ครอบครัวเตรียมคำถามเรื่องประโยชน์ ความเสี่ยง และทางเลือกไว้ได้ โดยไม่รับรองล่วงหน้าว่าทุกทางเลือกเหมาะกับทุกสถานการณ์
    locators: [{source_id: S04, locator: 'Overview: woman-centred care'}, {source_id: S51, locator: '4-stage KB 2026 §2.4, p.8'}]
  - id: c4
    type: guidance
    text_th: ครอบครัวอาจได้ยินเรื่องคลอดทางช่องคลอด การช่วยคลอดด้วยเครื่องมือ หรือผ่าตัดคลอด ให้ถามว่าทางเลือกที่ทีมเสนอมีประโยชน์ ความเสี่ยง และการดูแลแม่กับทารกต่างกันอย่างไร การเลือกขึ้นกับการประเมินและความยินยอม ไม่ใช่การแข่งขันว่าวิธีใดทำให้เป็นแม่ที่ดีกว่า
    locators: [{source_id: S51, locator: '4-stage KB 2026 §2.2, p.7'}, {source_id: S04, locator: 'Overview: woman-centred care'}]
lens:
  wisdom_th: ฟังประสบการณ์หมอตำแยและเรื่องคลอดของผู้ใหญ่เพื่อเข้าใจที่มาของความคาดหวังในบ้าน
  safety_th: ความเชื่อเรื่องเวลาคลอดไม่ควรทำให้ชะลอการประเมินหรือการช่วยเหลือจากสถานพยาบาล
  rights_th: แผนคลอดเป็นรายการความต้องการและคำถามของแม่ที่นำไปคุยกับทีมดูแลได้ ไม่ใช่คำสั่งแทนการประเมินของผู้ประกอบวิชาชีพ
