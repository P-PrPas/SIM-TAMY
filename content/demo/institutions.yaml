# SIM-TAMY 2.0 mock institutions and accounts (S2-01). DEMO DATA ONLY: every organization and person
# here is fictional. There are no passwords or sessions; the web sends the picked account id as
# `X-Demo-Account` and the API trusts it (prototype boundary, ADR-15).
# Roles: org_admin | educator | reviewer | learner. `partner_id` pairs two learners as a couple.
