id: bridge-food
version: '1.0'
status: Draft
mode: solo
title_th: สำรับหลังคลอดที่คุยกันได้
description_th: เมื่อยายกับคนรุ่นใหม่คาดหวังเรื่องอาหารไม่เหมือนกัน ฝึกฟังเหตุผล วางแผนตามความสะดวก และตรวจสอบคำกล่าวอ้างด้านสุขภาพ
# TODO(content): Qualified nutrition and cultural review is pending.
voice_style_th: คุณคือยายสาย ชอบทำอาหารและใช้สำรับเป็นวิธีแสดงความรัก มีความเชื่อส่วนตัวจากบ้านของตน ไม่อ้างว่าเป็นความเชื่อของคนไทยทุกคน พร้อมปรับเมื่อได้ฟังลูกหลาน ไม่เรียกผู้เรียนว่าหมอ
roles:
  mother: คุณเป็นคุณแม่ในเรื่องสมมติ ยายอยากจัดอาหารตามที่บ้านเคยทำ คุณอยากได้รับการดูแลพร้อมบอกสิ่งที่สะดวกและอยากกิน โดยไม่รู้สึกว่าต้องทำตามเพื่อรักษาน้ำใจ
  father: คุณเป็นคุณพ่อในเรื่องสมมติ อยากช่วยเรื่องอาหารและค่าใช้จ่าย คุณจะคุยกับยายพร้อมถามความต้องการของคุณแม่ ไม่เลือกอาหารแทนเธอเพียงลำพัง
sources:
  - id: WHO-SUPPORT
    title_th: องค์การอนามัยโลก — เคารพความต้องการและบริบทครอบครัว
    url: https://www.who.int/news/item/30-03-2022-who-urges-quality-care-for-women-and-newborns-in-critical-first-weeks-after-childbirth
    category: guidance
    summary_th: การดูแลหลังคลอดควรรับฟังผู้รับบริการและสนับสนุนครอบครัว ความเชื่อของยายในเรื่องนี้เป็นเรื่องสมมติของครอบครัวหนึ่ง ไม่ใช่ข้อสรุปของทุกวัฒนธรรมไทย
  - id: UNICEF-FOOD
    title_th: ยูนิเซฟ — โภชนาการของมารดา
    url: https://www.unicef.org/nutrition/maternal
    category: guidance
    summary_th: เน้นอาหารที่มีคุณค่าทางโภชนาการ การพัก และการเข้าถึงคำปรึกษา โดยคำนึงถึงการเข้าถึงอาหารและบริบทสังคม ไม่รับรองว่าอาหารชนิดเดียวเพิ่มน้ำนมได้แน่นอน
steps:
  - id: understand
    chapter_th: สำรับที่มาพร้อมความรัก
    role: mother
    speaker_th: ยายสาย
    prompt_th: ยายอยากทำอาหารแบบที่บ้านเราเคยทำให้แม่หลังคลอด แต่กลัวหนูไม่อยากกิน เราคุยกันก่อนดีไหม
    source_ids: [WHO-SUPPORT]
    choices:
      - id: invite-conversation
        text_th: ดีเลยยาย เราอยากรู้ว่าสำรับนี้สำคัญกับยายยังไง แล้วคุยกันด้วยว่าคุณแม่อยากกินอะไรและบ้านเราสะดวกแค่ไหน
        reply_th: สำหรับยายมันคือการดูแลคนในบ้านนะ ไม่อยากให้ใครต้องฝืนกิน ถ้าบอกกันยายก็ปรับได้
        reply_alternatives_th: [ยายอยากช่วยให้ได้พักมากกว่าอยากให้ทำตามทุกอย่าง เราลองเลือกด้วยกันว่าทำอะไรแล้วทุกคนสบายใจ]
        feedback_th: ถามทั้งความหมายทางครอบครัวและความต้องการของผู้รับการดูแล แทนการสมมติว่าทุกคนต้องการเหมือนกัน
        skills: [communication, support]
      - id: ignore-preference
        text_th: ยายจัดมาเลยก็ได้ คุณแม่ต้องกินตามที่บ้านเห็นว่าดีอยู่แล้ว
        reply_th: ยายอยากฟังเจ้าตัวด้วยนะ จะได้ทำให้กินได้จริง ไม่ใช่ทำมาแล้วต้องเกรงใจกัน
        feedback_th: การช่วยดูแลยังควรเปิดให้คุณแม่บอกความต้องการและข้อจำกัดของตนเอง
  - id: share-work
    chapter_th: จากความตั้งใจสู่หน้าที่ที่ช่วยได้
    role: mother
    speaker_th: ยายสาย
    prompt_th: ถ้าจะช่วยเรื่องอาหาร เราแบ่งกันยังไงดี ยายก็ไม่สะดวกมาทุกวัน แล้วเรื่องงบต้องคุยกันด้วย
    source_ids: [UNICEF-FOOD]
    choices:
      - id: realistic-plan
        text_th: มาช่วยกันเลือกตามสิ่งที่หาได้และความต้องการคุณแม่ แล้วแบ่งคนซื้อ คนทำ และคนเก็บ ไม่ให้ใครต้องรับทั้งหมดคนเดียว
        reply_th: แบบนี้ทำได้จริงนะ ยายจะบอกวันที่สะดวก ส่วนวันอื่นเราค่อยวางแผนกัน ไม่ต้องเกรงใจจนรับงานเกินกำลัง
        reply_alternatives_th: [ขอบคุณที่ถามเรื่องเวลาของยายด้วย เราแบ่งงานกันและเปลี่ยนแผนได้ ถ้าวันไหนไม่สะดวกก็บอกกัน]
        feedback_th: วางแผนตามการเข้าถึงอาหาร เวลา และภาระในบ้าน โดยไม่กำหนดเมนูรักษาหรืออาหารต้องห้ามเอง
        skills: [responsibility, communication, support]
      - id: offload-work
        text_th: ยายจัดการทั้งหมดเลยนะ อย่าเปลี่ยนเมนูด้วย เดี๋ยวไม่ตรงที่เคยทำกันมา
        reply_th: ยายอยากช่วย แต่ทุกวันคงไม่ไหว เราตกลงกันใหม่ให้ทำได้จริงดีกว่า
        feedback_th: การยึดแผนตายตัวและให้คนหนึ่งรับงานทั้งหมดอาจไม่ตอบข้อจำกัดของครอบครัว
  - id: check-claim
    chapter_th: เมื่อมีคำรับรองที่ฟังดูมั่นใจ
    role: mother
    speaker_th: ยายสาย
    prompt_th: มีคนบอกยายว่าอาหารอย่างเดียวก็ทำให้น้ำนมดีแน่นอน ถ้าคุณแม่กังวลเรื่องนี้ เราควรตอบเขายังไง
    critical: true
    source_ids: [UNICEF-FOOD, WHO-SUPPORT]
    choices:
      - id: support-and-ask
        text_th: เราช่วยดูแลเรื่องอาหารและพักได้ แต่ไม่รับรองผลจากอาหารชนิดเดียว ถ้าคุณแม่กังวล เราช่วยติดต่อบุคลากรสุขภาพให้ได้คำปรึกษาที่เหมาะกับเธอดีกว่า
        reply_th: เข้าใจแล้ว ยายจะไม่บอกว่าแค่กินตามนี้ก็ต้องได้ผลแน่นอน เราดูแลกันและช่วยถามเรื่องที่ยังไม่รู้ด้วยกัน
        reply_alternatives_th: [ยายไม่อยากให้คุณแม่รู้สึกผิดถ้าไม่เป็นอย่างที่คนอื่นบอก เราช่วยกันขอคำปรึกษา แล้วแบ่งงานให้เขาได้พักด้วย]
        feedback_th: แยกการสนับสนุนด้านโภชนาการออกจากคำรับรองผลเฉพาะบุคคล และไม่ปล่อยให้ความกังวลถูกกลบด้วยคำกล่าวอ้าง
        skills: [communication, safety, support]
      - id: guarantee-food
        text_th: บอกไปเลยว่ากินตามสำรับนี้ต้องได้ผล ไม่ต้องถามทีมสุขภาพหรอก
        reply_th: ยายเองก็ไม่รู้ว่าจะรับรองแบบนั้นได้ไหม ไม่อยากให้คำพูดเราทำให้เขาไม่ได้ถามเรื่องที่กังวล
        feedback_th: พลาดจุดสำคัญในการตรวจสอบและขอความช่วยเหลือ ไม่ควรรับรองผลจากอาหารชนิดเดียวหรือขัดขวางคำปรึกษา
        safe: false
