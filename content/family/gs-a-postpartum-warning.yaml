        short_th: เริ่มอยู่ไฟตามผู้ใหญ่ก่อน
        icon: pot
        reply_th: ยายแนะนำเรื่องการดูแลแม่ได้ แต่เรื่องอาการของมะลิ ยายไม่ได้เป็นคนประเมินนะ
        feedback_th: ประเพณีดูแลแม่ไม่ใช่การประเมินอาการเสี่ยง และไม่ควรใช้ความร้อนหรือสมุนไพรเองเมื่อมีสัญญาณอันตราย ต้องให้ผู้ให้บริการที่มีสิทธิตรวจก่อน
        safe: false
        flags: [tradition-first]
  - id: consequence
