        feedback_th: เล่าข้อสังเกตเป็นข้อเท็จจริงและร่วมกันรับคำแนะนำ ซึ่งเอื้อให้บุคลากรประเมินได้ ผลที่ตามมาขึ้นกับการประเมินของบุคลากร
