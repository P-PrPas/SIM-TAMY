        short_th: ค่อยดูกันตอนนั้นแล้วกัน
        icon: pause
        reply_th: ก็ได้ แต่เราไม่อยากให้ถึงตอนนั้นแล้วต่างคนต่างลังเลนะ
        feedback_th: ข้อตกลงที่ไม่ชัดอาจทำให้ลังเลอีกในครั้งหน้า ลองระบุสิ่งที่จะทำก่อนใช้สมุนไพรหรืออยู่ไฟ
