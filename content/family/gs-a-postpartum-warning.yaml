  - id: elder-suggestion
    chapter_th: ผู้ใหญ่หวังดี
    role: mother
    speaker_th: ยายสาย
    prompt_th: ยายสายบอกว่าแม่หลังคลอดทุกบ้านก็เป็นแบบนี้ ให้พักและเริ่มอยู่ไฟพรุ่งนี้ ส่วนเรื่องอื่นรอดูถึงเช้าก็น่าจะพอ
    prompt_if:
      fact:m-bleed: ยายได้ยินว่าเลือดที่ออกมากกว่าเดิม แต่ยายคิดว่าแม่หลังคลอดก็เป็นแบบนี้ ให้พักและเริ่มอยู่ไฟพรุ่งนี้ แล้วรอดูถึงเช้าก่อนดีไหม
      fact:f-breath: ยายได้ยินว่ามะลิหายใจลำบาก แต่ยายยังคิดว่าให้พักและเริ่มอยู่ไฟพรุ่งนี้ แล้วรอดูถึงเช้าก่อนดีไหม
    source_ids: [S22, S19]
    card:
      tradition_th: การอยู่ไฟ การอบสมุนไพร และการทับหม้อเกลือ เป็นการดูแลแม่หลังคลอดตามประเพณีไทยที่ผู้ใหญ่เล่าสืบต่อกันมา
      learning_point_th: การสำรวจในสถานพยาบาล 101 แห่งรายงานว่ามีการใช้กิจกรรมเหล่านี้ แต่ไม่ได้ยืนยันประสิทธิผลหรือความปลอดภัยของทุกกิจกรรม ประเพณีดูแลแม่ไม่ใช่การประเมินอาการเสี่ยงของแม่
      evidence_status: traditional_practice
      precautions_th:
        - ก่อนทำต้องตรวจช่วงเวลา ข้อห้าม แผลผ่าคลอด ความร้อน (ความเสี่ยงไหม้ ขาดน้ำ ความดัน) และผู้ให้บริการ
        - ไม่ใช้เนื้อหาสมุนไพร การประคบร้อน หรือหัตถการเป็นคำแนะนำปฏิบัติเองเมื่อมีอาการเสี่ยง
      when_to_consult_th: เมื่อเลือดออกมากผิดปกติ เจ็บหน้าอก หรือหายใจลำบาก ให้ขอความช่วยเหลือจากบุคลากรสุขภาพทันที ไม่ต้องรอให้ทุกคนเห็นด้วย
      lens:
        wisdom_th: การอยู่ไฟ อบสมุนไพร และทับหม้อเกลือ เป็นกิจกรรมดูแลหลังคลอดตามบริบทไทย พบรายงานการใช้ในสถานพยาบาลที่เป็นแหล่งฝึก 101 แห่ง
        safety_th: ผลสำรวจไม่ยืนยันประสิทธิผลหรือความปลอดภัยของทุกกิจกรรม ต้องตรวจช่วงเวลา ข้อห้าม แผลผ่าคลอด ความร้อน และผู้ให้บริการก่อน และไม่ใช้เป็นคำแนะนำปฏิบัติเองเมื่อมีอาการเสี่ยง
        rights_th: ต้องให้ผู้ให้บริการที่มีสิทธิตรวจภาวะทางการแพทย์ก่อนทุกครั้ง ผู้สืบทอดภูมิปัญญาไม่ได้มีใบอนุญาตหรือสิทธิทำคลอดโดยอัตโนมัติ
      source_ids: [S22, S19, S20]
    choices:
      - id: listen-then-ask
        text_th: ขอบคุณที่เป็นห่วงนะยาย เรื่องอยู่ไฟเรายังคุยกันต่อได้ แต่คืนนี้ขอคุยกับนนท์เรื่องที่เรารู้สึกในตัวเองก่อน ยายช่วยฟังด้วยนะ
        short_th: ขอบคุณยาย ขอคุยกับนนท์ก่อน
        icon: talk
        reply_th: ได้ ยายไม่ได้อยากบังคับ ยายแค่ห่วง ถ้าสองคนเห็นอะไรที่กังวล ก็คุยกันให้ชัดก่อนนะ
        feedback_th: รับฟังความห่วงใยและความหมายของประเพณี โดยยังไม่ใช้ประเพณีแทนการพิจารณาสิ่งที่สังเกตเห็นในตัวเอง
        skills: [communication, support]
        dimension: communication
        flags: [heard-elder]
      - id: defer-to-elder
        text_th: ถ้ายายว่ารอได้ เราก็รอตามยายก็ได้ ไม่อยากให้ยายเสียใจ
        short_th: รอตามที่ยายว่ารอได้
        icon: pause
        reply_th: ยายก็บอกได้แค่ที่ยายเคยเห็นนะ ยายไม่ได้เห็นหนูใกล้ ๆ เหมือนนนท์
        feedback_th: การเกรงใจผู้ใหญ่เป็นเรื่องเข้าใจได้ แต่ผู้ที่เห็นอาการตรงหน้ามีข้อมูลที่ผู้ใหญ่ทางโทรศัพท์อาจไม่มี
        flags: [deferred-elder]
      - id: argue
        text_th: ประเพณีแบบนั้นล้าสมัยแล้ว ยายไม่ต้องมายุ่งเรื่องของเรา
        short_th: ประเพณีแบบนั้นล้าสมัยแล้ว
        icon: talk
        reply_th: ยายไม่ได้อยากทะเลาะนะ ยายห่วงเฉย ๆ ถ้าอย่างนั้นยายขอวางสายก่อน
        feedback_th: การปฏิเสธทันทีอาจปิดบทสนทนา ลองแยกสิ่งที่เคารพในความห่วงใยออกจากสิ่งที่ต้องตัดสินใจจากข้อมูลตรงหน้า
        flags: [argued]
  - id: joint-help-decision
    chapter_th: จุดตัดสินใจร่วมกัน
    role: mother
    speaker_th: ยายสาย
    joint: true
