      tradition-first: ผ่านไปสักพัก ยังไม่มีบุคลากรสุขภาพได้รับรู้สิ่งที่เห็น ขอความช่วยเหลือตอนนี้เลย เราจะเล่าให้เขาฟังอย่างไรดี
