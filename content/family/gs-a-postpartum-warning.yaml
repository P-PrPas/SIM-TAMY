    role: mother
    speaker_th: นนท์
    prompt_th: เมื่อทุกอย่างผ่านไปแล้ว ครั้งหน้าถ้ามีใครเสนอสมุนไพรหรืออยู่ไฟให้แม่หลังคลอด เราตกลงกันไว้ว่าอย่างไรดี
