id: gs-a-postpartum-warning
version: '1.0'
status: Draft
mode: coop
stage: 3
objective_ids: [OBJ-3-01, OBJ-3-03]
knowledge_unit_ids: [KB-PP-WARN-001, KB-TM-REST-001, KB-TM-SAFE-001, KB-TM-HERB-001, KB-RIGHTS-SCOPE-001]
# Golden Scenario GS-A (Blueprint section 06). Authored only from docs/knowledge base/
# Thai_Midwifery_Knowledge_Base_2026.pdf: section 4 (Thai midwifery safety), section 10 scenario 1
# (postpartum woman wants Thai recovery service but reports abnormal bleeding), KB-PP-001.
# Provenance is knowledge_base_2026; this is not expert-reviewed content and not a clinical tool.
# TODO(content): symptom wording below is a synthetic scenario built from the KB-PP-001 warning
# signs (heavy bleeding, chest pain, difficulty breathing); extend only with KB support.
title_th: 'อยากอยู่ไฟ แต่มีสัญญาณอันตรายหลังคลอด'
description_th: มะลิเพิ่งกลับบ้านหลังคลอด ยายสายอยากให้เริ่มอยู่ไฟ แต่มะลิกับนนท์ต่างมีสิ่งที่สังเกตเห็นซึ่งอีกฝ่ายยังไม่รู้ ถามหาข้อมูลของตนเอง แบ่งปันให้กัน ฟังประเพณีอย่างเคารพ แล้วตัดสินใจร่วมกันว่าจะขอความช่วยเหลือจากบุคลากรสุขภาพเมื่อไร
boundary_th: นี่คือบทฝึกสมมติของครอบครัวในเรื่องเล่า ไม่ใช่การประเมินสุขภาพจริง หากมีอาการเลือดออกมากผิดปกติ เจ็บหน้าอก หรือหายใจลำบาก ให้ขอความช่วยเหลือจากบุคลากรสุขภาพทันที
roles:
  mother: คุณคือมะลิ กลับบ้านหลังคลอดได้สามวัน ยายสายอยากให้เริ่มอยู่ไฟพรุ่งนี้ คุณเหนื่อยและไม่อยากให้ใครกังวล แต่ตั้งแต่เมื่อวานคุณรู้สึกว่าร่างกายผิดปกติ ลองถามตัวเองถึงสิ่งที่สังเกตเห็น แล้วเลือกเองว่าจะบอกนนท์ข้อไหน
  father: คุณคือนนท์ ช่วยดูแลมะลิและลูกตลอดวัน คุณเห็นบางอย่างเกี่ยวกับมะลิที่เธออาจไม่ได้บอก คุณไม่อยากทำให้ยายหรือมะลิเสียใจ ลองทบทวนสิ่งที่คุณเห็น แล้วเลือกเองว่าจะบอกมะลิข้อไหน
facts:
  - id: m-bleed
    role: mother
    text_th: ผ้าอนามัยที่ใช้ชุ่มเร็วกว่าที่คาดไว้ และเลือดที่ออกดูมากผิดปกติเมื่อเทียบกับวันแรกที่กลับบ้าน
    skills: [shared_decision]
    leak_terms_th: [ผ้าอนามัยที่ใช้ชุ่ม, เลือดที่ออกดูมากผิดปกติ]
  - id: m-chest
    role: mother
    text_th: รู้สึกเจ็บแน่นที่หน้าอกเป็นช่วง ๆ ซึ่งไม่เคยเป็นแบบนี้มาก่อน
    skills: [shared_decision]
    leak_terms_th: [เจ็บแน่นที่หน้าอก]
  - id: f-breath
    role: father
    text_th: เห็นมะลิหายใจลำบากและต้องหยุดพักระหว่างเดินไปห้องน้ำ
    skills: [shared_decision]
    leak_terms_th: [หายใจลำบาก]
  - id: f-pads
    role: father
    text_th: เห็นผ้าอนามัยที่ทิ้งไว้ชุ่มเลือดและต้องเปลี่ยนบ่อยกว่าเมื่อวาน
    skills: [shared_decision]
    leak_terms_th: [ชุ่มเลือด]
sources:
  - id: S36
    title_th: WHO — สัญญาณอันตรายหลังคลอด (Postpartum warning signs, 2025)
    url: https://www.who.int/campaigns/world-health-day/2025/key-messages
    category: guidance
    summary_th: ฐานความรู้ของคลังข้อมูลระบุสัญญาณอันตรายทั่วไปของแม่และทารกหลังคลอด ตัวอย่างเป้าหมายการเรียนรู้คือผู้ปกครองบอกได้ว่าเลือดออกมากผิดปกติ เจ็บหน้าอก หรือหายใจลำบากต้องขอความช่วยเหลือทันที ขอบเขตคือการรู้ทันและการส่งต่อ ไม่ใช่การรักษาเอง
  - id: S06
    title_th: WHO–FIGO–ICM — แนวทางภาวะตกเลือดหลังคลอด (2025)
    url: https://www.who.int/publications/i/item/9789240115637
    category: guidance
    summary_th: แนวทางสำหรับบุคลากรเรื่องการป้องกัน วินิจฉัย และจัดการภาวะตกเลือดหลังคลอด คลังข้อมูลใช้เป็นฐานของจุดประเมินการตระหนักสัญญาณอันตรายและการส่งต่อเร่งด่วน เนื้อหาคลินิกเฉพาะวิชาชีพไม่ใช่คู่มือทำเอง
  - id: S35
    title_th: WHO — การดูแลทารกแรกเกิด (Care of the newborn)
    url: https://www.who.int/tools/your-life-your-health/life-phase/newborns-and-children-under-5-years/caring-for-newborns
    category: guidance
    summary_th: ฐานความรู้การดูแลทารก คลังข้อมูลใช้เป็นหลักการว่าไม่ควรชะลอการประเมินโดยบุคลากรสุขภาพ
  - id: S22
    title_th: Review of Thai Traditional Principles of Postpartum Care (2025), Journal of Health Science of Thailand
    url: https://thaidj.org/index.php/JHS/article/download/13170/12856/41206
    category: culture
    summary_th: งานทบทวนเชิงสำรวจศึกษาผู้ให้บริการจากสถานพยาบาล 101 แห่ง รายงานการใช้กิจกรรมเช่น นวดประคบสมุนไพร อบสมุนไพร และทับหม้อเกลือ การสำรวจความแพร่หลายไม่ได้ยืนยันประสิทธิผลหรือความปลอดภัยของทุกกิจกรรม
  - id: S23
    title_th: กรมการแพทย์แผนไทยฯ — คลังข้อมูลยาสมุนไพร ข้อห้ามของตำรับประสะไพล
    url: https://ttdkl.dtam.moph.go.th/Module10_Webboard/Webboard_View_Reply.aspx?QuestionID=106
    category: limited_evidence
    summary_th: ฐานข้อมูลระบุข้อห้ามของประสะไพลสำหรับหญิงตั้งครรภ์และผู้ตกเลือดหลังคลอด เป็นตัวอย่างว่าสมุนไพรต้องประเมินตามตำรับและภาวะของผู้ป่วย ไม่ควรเหมารวมว่าปลอดภัยเพราะเป็นธรรมชาติ
  - id: S19
    title_th: กรมการแพทย์แผนไทยฯ — คู่มือจัดบริการผดุงครรภ์ไทยแบบบูรณาการ (2569)
    url: https://www.dtam.moph.go.th/news-release/49308/
    category: guidance
    summary_th: คู่มือบริการและบูรณาการเป็นจุดเริ่มต้นสำหรับออกแบบบริการร่วมกับทีมสุขภาพ ก่อนนำไปเป็นขั้นตอนของสถานบริการต้องเปิดอ่านฉบับเต็มและให้ผู้รับผิดชอบวิชาชีพรับรองข้อปฏิบัติจริง
  - id: S20
    title_th: พ.ร.บ.วิชาชีพการแพทย์แผนไทย พ.ศ. 2556
    url: https://lawplayer.com/th/act/ocs-%E0%B8%A70078-1B-0001
    category: guidance
    summary_th: ถ้อยคำกฎหมายเรื่องขอบเขตวิชาชีพการแพทย์แผนไทย คลังข้อมูลระบุว่าควรตรวจสอบประกาศต้นฉบับก่อนใช้ทางกฎหมาย และไม่สรุปว่าผู้สืบทอดภูมิปัญญามีใบอนุญาตหรือมีสิทธิทำคลอด
  - id: S04
    title_th: WHO — คำแนะนำการดูแลระยะคลอด (Intrapartum care, 2018)
    url: https://www.who.int/publications/i/item/9789241550215
    category: guidance
    summary_th: การดูแลที่ให้เกียรติและยึดผู้รับบริการเป็นศูนย์กลาง สื่อสารชัดเจน คลังข้อมูลใช้เป็นหลักว่าไม่บังคับและไม่บิดเบือนข้อมูลเมื่อให้ผู้รับบริการตัดสินใจ
steps:
  - id: discover-mother
    chapter_th: คืนที่สามหลังกลับบ้าน
    role: mother
    speaker_th: มะลิ
    kind: discover
    character_th: มะลิ (ตัวคุณเอง ลองไล่ถามสิ่งที่รู้สึกอยู่)
    prompt_th: ยายสายโทรมาชวนให้เริ่มอยู่ไฟพรุ่งนี้ แต่ตั้งแต่เมื่อวานคุณรู้สึกว่ามีอะไรไม่ปกติ พิมพ์ถามตัวเองถึงสิ่งที่สังเกตเห็นเกี่ยวกับร่างกาย เมื่อรู้สึกว่าพอแล้วจึงกดไปต่อ
    abstain_th: ตอนนี้ยังไม่มีข้อมูลอ้างอิงที่ยืนยันเรื่องนี้ได้ ลองถามเรื่องที่สังเกตเห็นในตัวเองก่อน
    min_reveals: 1
    source_ids: [S36]
    intents:
      - id: ASK_BLEEDING
        label_th: ถามตัวเองว่าเลือดที่ออกช่วงนี้เป็นอย่างไร
        examples_th: [เลือดที่ออกเป็นยังไงบ้าง, ผ้าอนามัยชุ่มเร็วไหม, เลือดออกมากไหม]
        reveals: [m-bleed]
        unit_ids: [KB-PP-WARN-001]
        dimension: discovery
        reply_th: เลือดที่ออกดูมากผิดปกติ ผ้าอนามัยที่ใช้ชุ่มเร็วกว่าที่คาดไว้เมื่อเทียบกับวันแรกที่กลับบ้าน
        high_risk: true
      - id: ASK_CHEST
        label_th: ถามตัวเองว่าหน้าอกหรือการหายใจเป็นอย่างไร
        examples_th: [เจ็บหน้าอกไหม, หน้าอกเป็นอะไรไหม, รู้สึกแน่นหน้าอกหรือเปล่า]
        reveals: [m-chest]
        unit_ids: [KB-PP-WARN-001]
        dimension: discovery
        reply_th: รู้สึกเจ็บแน่นที่หน้าอกเป็นช่วง ๆ ซึ่งไม่เคยเป็นแบบนี้มาก่อน
      - id: ASK_PLAN
        label_th: ถามว่ายายอยากให้ทำอะไรในช่วงอยู่ไฟ
        examples_th: [ยายอยากให้ทำอะไร, แผนอยู่ไฟคืออะไร, ยายจะให้อยู่ไฟยังไง]
        reveals: []
        unit_ids: [KB-TM-REST-001]
        dimension: evidence_scope
        reply_th: ยายอยากให้เริ่มอยู่ไฟพรุ่งนี้และให้พักอยู่บ้านก่อน
    choices:
      - id: continue
        text_th: ฉันถามตัวเองพอแล้ว ไปต่อ
        short_th: ถามตัวเองพอแล้ว ไปต่อ
        icon: arrow
        reply_th: ไปต่อกันเลย
        feedback_th: ถามสิ่งที่สังเกตเห็นของตนเองให้ครบก่อนตัดสินใจ ช่วยให้มีข้อมูลของตนเองครบเมื่อต้องคุยกับคู่
  - id: discover-father
    chapter_th: คืนที่สามหลังกลับบ้าน
    role: father
    speaker_th: นนท์
    kind: discover
    character_th: นนท์ (ตัวคุณเอง ลองทบทวนสิ่งที่เห็นมะลิเป็น)
    prompt_th: ระหว่างที่มะลิพัก คุณนึกย้อนถึงสิ่งที่เห็นเกี่ยวกับมะลิ พิมพ์ถามตัวเองถึงสิ่งที่เห็น เมื่อพร้อมแล้วจึงกดไปต่อ
    abstain_th: ตอนนี้ยังไม่มีข้อมูลอ้างอิงที่ยืนยันเรื่องนี้ได้ ลองถามเรื่องที่เห็นมะลิก่อน
    min_reveals: 1
    source_ids: [S36]
    intents:
      - id: ASK_BREATHING
        label_th: ถามตัวเองว่าเห็นมะลิหายใจเป็นอย่างไร
        examples_th: [มะลิหายใจเป็นยังไง, เห็นเขาหอบไหม, หายใจลำบากหรือเปล่า]
        reveals: [f-breath]
        unit_ids: [KB-PP-WARN-001]
        dimension: discovery
        reply_th: เห็นมะลิหายใจลำบากและต้องหยุดพักระหว่างเดินไปห้องน้ำ
      - id: ASK_PADS
        label_th: ถามตัวเองว่าเห็นผ้าอนามัยที่ทิ้งเป็นอย่างไร
        examples_th: [ผ้าอนามัยที่ทิ้งเป็นยังไง, เห็นเลือดมากไหม, ต้องเปลี่ยนบ่อยไหม]
        reveals: [f-pads]
        unit_ids: [KB-PP-WARN-001]
        dimension: discovery
        reply_th: เห็นผ้าอนามัยที่ทิ้งไว้ชุ่มเลือดและต้องเปลี่ยนบ่อยกว่าเมื่อวาน
        high_risk: true
      - id: ASK_WHO_ASSESSES
        label_th: ถามว่าใครเป็นผู้ประเมินอาการเหล่านี้ได้
        examples_th: [ใครประเมินอาการได้, ต้องให้ใครดู, ควรถามใคร]
        reveals: []
        unit_ids: [KB-RIGHTS-SCOPE-001]
        dimension: evidence_scope
        reply_th: การประเมินอาการเป็นหน้าที่ของบุคลากรสุขภาพที่มีสิทธิ ไม่ใช่ของผู้ใหญ่ในบ้านหรือของเราเอง
    choices:
      - id: continue
        text_th: ฉันทบทวนสิ่งที่เห็นพอแล้ว ไปต่อ
        short_th: ทบทวนสิ่งที่เห็นพอแล้ว ไปต่อ
        icon: arrow
        reply_th: ไปต่อกันเลย
        feedback_th: ทบทวนสิ่งที่เห็นจริงของตนเองก่อนคุยกัน ช่วยให้บอกเป็นข้อเท็จจริงได้ครบ
  - id: share-with-partner
    chapter_th: เล่าให้กันฟัง
    role: mother
    speaker_th: นนท์
    prompt_th: นนท์ถามว่าวันนี้เธอรู้สึกอย่างไรบ้าง เปิดบันทึกส่วนตัวของเธอแล้วเลือกแบ่งปันข้อที่อยากให้นนท์รู้ได้ จะพิมพ์เล่าหรือกดเลือกด้านล่างก็ได้
    source_ids: [S36]
    choices:
      - id: say-what-you-see
        text_th: เราสังเกตเห็นบางอย่างในตัวเองที่ยังไม่ได้บอกนนท์ จะเล่าเฉพาะสิ่งที่รู้สึกจริง ๆ ไม่ได้เดาว่าเป็นอะไร
        short_th: เล่าเฉพาะสิ่งที่รู้สึกจริง ๆ
        icon: talk
        reply_th: ขอบคุณที่บอกนะ เราอยากฟังทีละข้อ ไม่ต้องกลัวว่าเราจะกังวลเกินไป
        feedback_th: เปิดเรื่องด้วยสิ่งที่สังเกตเห็นและแยกจากการคาดเดา ทำให้อีกคนมีข้อมูลร่วมตัดสินใจ
        skills: [communication, support]
        dimension: communication
        flags: [opened-up]
      - id: say-fine
        text_th: ไม่มีอะไรหรอก เราแค่เหนื่อย
        short_th: ไม่มีอะไรหรอก เราแค่เหนื่อย
        icon: pause
        reply_th: อ๋อ ถ้าอย่างนั้นก็ไม่เป็นไร แต่ถ้าเธอนึกอะไรออก บอกเราได้ทุกเมื่อนะ
        feedback_th: การเก็บสิ่งที่สังเกตไว้คนเดียวอาจทำให้อีกคนไม่มีข้อมูลเมื่อถึงเวลาตัดสินใจ ลองบอกสิ่งที่เห็นแม้ยังไม่แน่ใจความหมาย
        flags: [kept-quiet]
  - id: ask-grandmother
    chapter_th: ฟังผู้ใหญ่อย่างเคารพ
    role: father
    speaker_th: ยายสาย
    kind: discover
    character_th: ยายสาย
    prompt_th: ยายสายอยู่ในสาย นนท์อยากเข้าใจเรื่องอยู่ไฟและสมุนไพรที่ยายพูดถึง พิมพ์ถามยายอย่างเคารพ เมื่อพอแล้วจึงกดไปต่อ
    abstain_th: ยายเองก็ไม่แน่ใจเรื่องนี้ ลองถามผู้ให้บริการที่เกี่ยวข้องดีกว่า
    min_reveals: 0
    source_ids: [S22, S23]
