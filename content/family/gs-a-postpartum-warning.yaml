        short_th: ติดต่อบุคลากรสุขภาพตอนนี้
        icon: phone
        reply_th: ถ้าสองคนเห็นตรงกันแบบนี้ ยายไม่ขวางนะ ให้ถามคนที่ดูแลเรื่องนี้โดยตรง ยายอยากให้มะลิปลอดภัย
        feedback_th: ตัดสินใจร่วมกันขอความช่วยเหลือจากบุคลากรสุขภาพเมื่อพบสัญญาณอันตรายหลังคลอด โดยไม่รอให้ทุกคนเห็นด้วยหรือรอให้ถึงเช้า บทฝึกนี้ไม่ได้ประเมินว่าใครเป็นอะไร
        skills: [communication, responsibility, safety, support, shared_decision]
        dimension: decision
        flags: [help-sought]
      - id: wait-until-morning
        text_th: รอดูอาการถึงเช้าก่อน ถ้าเช้านี้ยังกังวลค่อยติดต่อ
        short_th: รอดูอาการถึงเช้าก่อน
        icon: pause
        reply_th: เมื่อสองคนเลือกรอ ยายก็ไม่ได้ค้าน แต่สิ่งที่ทั้งสองเห็นก็ยังไม่มีบุคลากรสุขภาพคนไหนได้ประเมิน
        feedback_th: การรอโดยไม่มีผู้ประเมินทำให้สัญญาณอันตรายที่เห็นยังไม่ได้รับการตรวจสอบ เลือดออกมากผิดปกติ เจ็บหน้าอก และหายใจลำบากเป็นเหตุให้ขอความช่วยเหลือทันที
        safe: false
        flags: [waited]
