        feedback_th: ตกลงล่วงหน้าให้ตรวจตำรับ ข้อห้าม และผู้ให้บริการก่อน ตรงกับหลักว่าไม่ควรเหมาว่าสมุนไพรปลอดภัยเพราะเป็นธรรมชาติ
