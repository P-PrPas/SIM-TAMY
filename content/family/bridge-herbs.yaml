id: bridge-herbs
version: '1.2'
status: Draft
mode: solo
title_th: สมุนไพรช่วงให้นม ถามก่อนด้วยความใส่ใจ
description_th: เมื่อยายได้ผลิตภัณฑ์สมุนไพรมาให้ ฝึกถามส่วนประกอบ แยกหลักฐานของสารเดี่ยวกับผลิตภัณฑ์ผสม และขอคำปรึกษาโดยเคารพความหวังดี
# TODO(content): Qualified lactation, pharmacy and cultural review is pending.
voice_style_th: คุณคือยายสาย ได้ผลิตภัณฑ์สมุนไพรจากคนรู้จักและอยากช่วยลูกหลาน ยายไม่ทราบส่วนประกอบครบและยอมรับได้ว่าไม่รู้ อย่าตีตราความรู้ดั้งเดิมหรือรับรองผลิตภัณฑ์ ไม่เรียกผู้เรียนว่าหมอ
roles:
  mother: คุณเป็นคุณแม่ที่ให้นมในเรื่องสมมติ ยายได้ผลิตภัณฑ์สมุนไพรมาให้ คุณยังไม่ทราบส่วนประกอบและต้องการขอข้อมูลโดยไม่รู้สึกว่าปฏิเสธความรักของยาย
  father: คุณเป็นคุณพ่อในเรื่องสมมติ อยากช่วยคนรักที่ให้นมตรวจสอบข้อมูลผลิตภัณฑ์จากยาย คุณไม่รับรองหรือเลือกให้ใช้แทนคุณแม่ และพร้อมช่วยติดต่อผู้ให้คำปรึกษา
sources:
  - id: LACTMED-SUPPLEMENTS
    title_th: NIH LactMed — ข้อมูลผลิตภัณฑ์เสริมอาหารระหว่างให้นม
    url: https://www.ncbi.nlm.nih.gov/sites/books/NBK547438/pdf/Bookshelf_NBK547438.pdf
    category: limited_evidence
    summary_th: ข้อมูลความปลอดภัยระหว่างให้นมของผลิตภัณฑ์หลายชนิดมีจำกัด สูตรและปริมาณส่วนประกอบอาจแตกต่างกัน ผลของส่วนประกอบหนึ่งไม่แทนผลของผลิตภัณฑ์ผสม
  - id: NHS-CONSENT
    title_th: NHS — ตัดสินใจโดยเข้าใจข้อมูลและไม่ถูกครอบครัวกดดัน
    url: https://www.nhs.uk/tests-and-treatments/consent-to-treatment/
    category: guidance
    summary_th: หัวข้อ Defining consent อธิบายว่าการยินยอมควรเป็นการตัดสินใจโดยสมัครใจ หลังเข้าใจประโยชน์ ความเสี่ยง และทางเลือก โดยไม่ถูกเพื่อนหรือครอบครัวกดดัน
  - id: NHS-HERBS
    title_th: NHS — สมุนไพรช่วงให้นมและการปรึกษาแพทย์หรือเภสัชกร
    url: https://www.nhs.uk/baby/breastfeeding-and-bottle-feeding/breastfeeding-and-lifestyle/medicines/
    category: guidance
    summary_th: หัวข้อ Is there anything I cannot take while I'm breastfeeding? ระบุว่าข้อมูลสมุนไพรยังไม่เพียงพอที่จะรับประกันความปลอดภัยระหว่างให้นม และชี้ช่องทางปรึกษาบุคลากรสุขภาพ ข้อจำกัดของข้อมูลนี้ไม่ได้หมายความว่าสมุนไพรทุกชนิดเป็นอันตราย
  - id: NHS-QUESTIONS
    title_th: NHS — เตรียมคำถามและชวนคนในครอบครัวไปปรึกษาด้วยกัน
    url: https://www.nhs.uk/nhs-services/gps/what-to-ask-your-doctor/
    category: guidance
    summary_th: หัวข้อ Treatment และ Top tips แนะนำให้ถามเรื่องประโยชน์ ความเสี่ยง และทางเลือก จดคำถามกับรายการยาและอาหารเสริมไว้ล่วงหน้า และชวนคนที่ไว้ใจไปช่วยฟังหรือจดคำตอบ
steps:
  - id: receive
    chapter_th: รับความหวังดีโดยไม่รีบรับรอง
    role: mother
    speaker_th: ยายสาย
    prompt_th: คนรู้จักฝากสมุนไพรมาให้ บอกว่าดีกับแม่ให้นม ยายยังไม่ได้ถามส่วนประกอบครบ หนูอยากดูก่อนไหม
    source_ids: [LACTMED-SUPPLEMENTS, NHS-CONSENT]
    choices:
      - id: thank-and-check
        text_th: ขอบคุณที่นึกถึงนะยาย เราขอดูฉลากกับข้อมูลก่อน ยังไม่อยากตัดสินใจจากคำบอกต่ออย่างเดียว
        reply_th: ได้เลย ยายเอาที่เขาให้มาทั้งหมดมาให้ดู เรื่องไหนยายไม่รู้ก็จะไม่เดานะ เราช่วยกันถามได้
        reply_alternatives_th: [ยายเป็นห่วงเลยรับมา แต่ไม่ได้แปลว่าหนูต้องใช้ทันที ขอดูข้อมูลให้เข้าใจก่อนก็ได้]
        feedback_th: รับความหวังดีพร้อมตั้งขอบเขตว่าการรับของไม่ใช่การยินยอมใช้ผลิตภัณฑ์
        skills: [communication, support]
      - id: accept-by-trust
        text_th: ถ้าคนรู้จักยายใช้แล้วบอกว่าดี เราก็ใช้ตามได้เลย ไม่ต้องดูอะไรแล้ว
        reply_th: ยายก็ยังไม่รู้ครบเหมือนกันนะ ไม่อยากให้หนูทำเพราะเกรงใจ ถ้ามีข้อสงสัยเราถามก่อนก็ได้
        feedback_th: ประสบการณ์บอกต่อไม่แทนข้อมูลผลิตภัณฑ์และความเหมาะสมกับผู้รับการดูแล
  - id: identify
    chapter_th: หลักฐานของอะไร ใช้กับสิ่งไหน
    role: mother
    speaker_th: ยายสาย
    prompt_th: เขาบอกว่ามีส่วนผสมที่เคยมีงานวิจัย แต่ขวดนี้ผสมหลายอย่าง ยายไม่แน่ใจว่าใช้ข้อมูลเดียวกันได้ไหม
    source_ids: [LACTMED-SUPPLEMENTS]
    choices:
      - id: distinguish-product
        text_th: ข้อมูลของส่วนผสมหนึ่งอาจใช้ยืนยันทั้งสูตรไม่ได้ เราจดชื่อ ส่วนประกอบ และข้อมูลบนฉลากไปถามเภสัชกรหรือทีมสุขภาพกันก่อนดีกว่า
        reply_th: งั้นเราเก็บข้อมูลของขวดนี้ให้ครบ ไม่เอาชื่อสมุนไพรตัวเดียวมาแทนคำตอบทุกอย่างนะ
        reply_alternatives_th: [ยายเข้าใจแล้วว่ามีงานวิจัยไม่ได้แปลว่าทุกสูตรเหมือนกัน เราเอาข้อมูลของผลิตภัณฑ์จริงไปถามก่อน]
        feedback_th: แยกระดับหลักฐานของส่วนประกอบออกจากสูตรผสม และขอการพิจารณาตามบริบทแทนการรับรองทั่วไป
        skills: [communication, responsibility]
      - id: generalize-study
        text_th: ถ้ามีอย่างหนึ่งเคยวิจัย ทั้งขวดก็คงเหมือนกัน ใช้หลักฐานนั้นรับรองไปเลย
        reply_th: ยายก็ยังตอบเรื่องส่วนผสมอื่นไม่ได้ ถ้าเราถามคนที่ดูข้อมูลผลิตภัณฑ์เป็นก่อน น่าจะคุยกันเข้าใจขึ้นนะ
        feedback_th: ไม่ควรขยายผลของสารเดี่ยวไปครอบคลุมทุกสูตรหรือทุกคนเมื่อข้อมูลยังไม่เพียงพอ
  - id: decide
    chapter_th: ขอคำปรึกษาโดยไม่ปล่อยให้ใครต้องเถียงคนเดียว
    role: mother
    speaker_th: ยายสาย
    prompt_th: ถ้าตอนนี้ยังตรวจข้อมูลไม่ครบ ยายจะบอกคนที่ฝากมายังไงให้เขารู้ว่าเราไม่ได้ไม่เห็นน้ำใจ
    critical: true
    source_ids: [NHS-HERBS, NHS-QUESTIONS, NHS-CONSENT]
    choices:
      - id: pause-and-support
        text_th: บอกว่าขอบคุณมาก แต่เรายังไม่เริ่มใช้จนได้คำปรึกษาจากบุคลากรที่เกี่ยวข้อง เราจะช่วยอธิบายด้วยกัน ไม่ปล่อยให้คุณแม่ต้องปฏิเสธอยู่คนเดียว
        reply_th: ดีเลย ยายจะช่วยพูดด้วย ความหวังดีไม่ควรทำให้ใครต้องฝืนใช้ทั้งที่ยังไม่เข้าใจ
        reply_alternatives_th: [ยายเห็นด้วย เรารับน้ำใจได้โดยยังไม่ต้องใช้ทันที ถามให้เข้าใจก่อนแล้วค่อยคุยกันต่อ]
        feedback_th: พักการตัดสินใจเมื่อข้อมูลไม่ครบ ขอคำปรึกษาและช่วยกันสื่อสารโดยไม่ให้ AI กำหนดความปลอดภัยหรือขนาดใช้
        skills: [communication, responsibility, safety, support]
      - id: use-to-please
        text_th: ใช้ไปก่อนเพื่อรักษาน้ำใจเถอะ ไม่ต้องถามเพิ่มหรือบอกทีมสุขภาพหรอก
        reply_th: ยายไม่อยากให้น้ำใจกลายเป็นแรงกดดันนะ เราขอบคุณเขาและขอเวลาถามให้เข้าใจก่อนได้
        feedback_th: พลาดจุดสำคัญในการขอคำปรึกษาและการตัดสินใจโดยไม่ถูกกดดัน การรักษาน้ำใจไม่ใช่หลักฐานความปลอดภัย
        safe: false
