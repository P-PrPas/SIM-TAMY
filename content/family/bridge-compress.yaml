id: bridge-compress
version: '1.2'
status: Draft
mode: solo
title_th: ประคบสมุนไพร ถามให้เข้าใจก่อนตัดสินใจ
description_th: ฝึกฟังประสบการณ์ของยายและถามถึงสิ่งที่ยังไม่รู้ โดยไม่เหมารวมว่าธรรมชาติปลอดภัยเสมอหรือว่าประเพณีไม่มีคุณค่า
# TODO(content): Qualified clinical and cultural review is pending.
voice_style_th: คุณคือยายสาย มีความทรงจำดีเกี่ยวกับการประคบสมุนไพรและอยากให้ลูกหลานได้รับการดูแล ไม่ดื้อรั้นหรืออ้างว่ารู้ดีกว่าทุกคน ยอมรับสิ่งที่ยังไม่ทราบ ไม่เรียกผู้เรียนว่าหมอ
roles:
  mother: คุณเป็นคุณแม่ในเรื่องสมมติ ยายเสนอให้ประคบสมุนไพร คุณอยากรู้ข้อมูลก่อนตัดสินใจและอยากให้ยายเข้าใจว่าการถามไม่ใช่การปฏิเสธความห่วงใย
  father: คุณเป็นคุณพ่อในเรื่องสมมติ ยายเสนอการประคบสมุนไพรให้คนรัก คุณอยากช่วยรวบรวมคำถามและให้คุณแม่มีส่วนตัดสินใจ โดยไม่ยืนยันความปลอดภัยแทนผู้ประกอบวิชาชีพ
sources:
  - id: DTAM-CULTURE
    title_th: กรมการแพทย์แผนไทยฯ — บริบทการประคบสมุนไพรหลังคลอด
    url: https://www.dtam.moph.go.th/wp-content/uploads/2023/11/DL0003-15062558-ICD-10-TM.pdf#page=77
    category: culture
    summary_th: หน้าเอกสาร 69 (หน้า PDF 77) รหัส 900-77-14 บันทึกชื่อการประคบสมุนไพรหลังคลอด ใช้อ้างอิงชื่อหัตถการ ไม่ได้ใช้รับรองผลิตภัณฑ์ ประสิทธิผล หรือวิธีสนทนากับคนในครอบครัว
  - id: NHS-FAMILY
    title_th: NHS — คุยกับญาติให้ชัดว่าต้องการความช่วยเหลือแบบไหน
    url: https://www.nhs.uk/baby/support-and-services/relationships-after-having-a-baby/
    category: guidance
    summary_th: หัวข้อ Relationships with family and friends แนะนำให้คุยกับญาติให้ชัดว่าต้องการความช่วยเหลือแบบไหน เพราะทุกคนกำลังปรับตัวกับบทบาทใหม่ในครอบครัว
  - id: DTAM-TRIAL
    title_th: ฐานวิจัยกรมการแพทย์แผนไทยฯ — การศึกษาขิงและการประคบในมารดาหลังคลอด
    url: https://rdtam.dtam.moph.go.th/th/data_collections/3351
    category: limited_evidence
    summary_th: บทคัดย่อรายงานปริมาณน้ำนมระหว่างกลุ่มไม่ต่างอย่างมีนัยสำคัญทางสถิติ ผลจากการศึกษาหนึ่งไม่ยืนยันผลหรือความปลอดภัยของทุกวิธีและทุกคน
  - id: NHS-QUESTIONS
    title_th: NHS — เตรียมคำถามและชวนคนในครอบครัวไปปรึกษาด้วยกัน
    url: https://www.nhs.uk/nhs-services/gps/what-to-ask-your-doctor/
    category: guidance
    summary_th: หัวข้อ Treatment และ Top tips แนะนำให้ถามเรื่องประโยชน์ ความเสี่ยง และทางเลือก จดคำถามกับรายการยาและอาหารเสริมไว้ล่วงหน้า และชวนคนที่ไว้ใจไปช่วยฟังหรือจดคำตอบ
  - id: NHS-CONSENT
    title_th: NHS — ตัดสินใจโดยเข้าใจข้อมูลและไม่ถูกครอบครัวกดดัน
    url: https://www.nhs.uk/tests-and-treatments/consent-to-treatment/
    category: guidance
    summary_th: หัวข้อ Defining consent อธิบายว่าการยินยอมควรเป็นการตัดสินใจโดยสมัครใจ หลังเข้าใจประโยชน์ ความเสี่ยง และทางเลือก โดยไม่ถูกเพื่อนหรือครอบครัวกดดัน
steps:
  - id: listen
    chapter_th: เริ่มจากความห่วงใย
    role: mother
    speaker_th: ยายสาย
    prompt_th: ยายจำได้ว่าตอนมีคนประคบให้ ยายรู้สึกว่ามีคนดูแล เลยอยากหาลูกประคบมาให้ หนูคิดยังไง
    source_ids: [DTAM-CULTURE, NHS-FAMILY]
    card:
      tradition_th: การประคบสมุนไพรหลังคลอด วิธีดูแลร่างกายที่ผู้ใหญ่หลายบ้านเคยใช้
      learning_point_th: เอกสารกรมการแพทย์แผนไทยฯ บันทึกชื่อหัตถการนี้ และบทคัดย่อวิจัยที่นำมาอ้างอิงรายงานว่าปริมาณน้ำนมระหว่างกลุ่มไม่ต่างอย่างมีนัยสำคัญทางสถิติ ผลจากการศึกษาเดียวไม่ยืนยันหรือปฏิเสธประโยชน์และความปลอดภัยของทุกวิธีและทุกคน
      evidence_status: insufficient_evidence
      precautions_th:
        - ไม่ควรเชื่อว่าวิธีนี้ช่วยเพิ่มน้ำนมได้แน่นอนจากข้อมูลที่มีอยู่
        - ส่วนประกอบ ความร้อน และผู้ให้บริการแตกต่างกัน ควรสอบถามรายละเอียดก่อนตัดสินใจ
      when_to_consult_th: ก่อนเริ่มใช้ ควรนำคำถามที่จดไว้ไปปรึกษาผู้ประกอบวิชาชีพที่เกี่ยวข้อง และติดต่อบุคลากรสุขภาพเมื่อมีอาการผิดปกติหรือไม่แน่ใจ
      source_ids: [DTAM-CULTURE, DTAM-TRIAL]
    choices:
      - id: listen-first
        text_th: เราเข้าใจว่ายายอยากให้ได้พักและมีคนดูแล ขอบคุณนะ ขอคุยรายละเอียดกันก่อนจะตัดสินใจได้ไหม
        reply_th: ได้สิ ยายอยากให้หนูสบายใจมากกว่าอยากให้ทำตาม ถ้ามีอะไรที่ยังไม่รู้ เราค่อยหาคำตอบกัน
        reply_alternatives_th: [ยายยินดีเล่านะ ที่อยากทำก็เพราะเป็นห่วง ไม่จำเป็นต้องรีบตกลง เราฟังกันก่อนก็ได้]
        feedback_th: รับความห่วงใยโดยไม่รีบรับหรือปฏิเสธหัตถการ เปิดทางให้ถามข้อมูลต่อ
        skills: [communication, support]
      - id: ridicule
        text_th: ยายเชื่อเรื่องแบบนี้อีกแล้วเหรอ ไม่เห็นน่าคุยเลย
        reply_th: ยายก็อาจไม่รู้ครบทุกเรื่อง แต่ถ้าหนูมีคำถาม เราคุยกันดี ๆ ได้นะ
        feedback_th: คำดูแคลนอาจทำให้คนในบ้านไม่กล้าคุยข้อมูลที่จำเป็น ลองแยกข้อสงสัยออกจากการตัดสินตัวบุคคล
  - id: ask-details
    chapter_th: ถามถึงวิธีและหลักฐาน
    role: mother
    speaker_th: ยายสาย
    prompt_th: คนขายบอกว่าประคบแล้วน้ำนมจะดี ยายก็ไม่รู้ว่าเขาอ้างอิงอะไร หนูอยากถามเรื่องไหนบ้าง
    source_ids: [DTAM-TRIAL, NHS-QUESTIONS]
    choices:
      - id: examine-claim
        text_th: อยากรู้ส่วนประกอบ วิธีที่เขาหมายถึง และหลักฐานของคำกล่าวนั้นก่อน ผลจากวิธีหนึ่งอาจใช้แทนทุกผลิตภัณฑ์ไม่ได้
        reply_th: ยายจะเก็บชื่อกับข้อมูลที่เขาให้มา เราไม่ต้องถือว่าคำโฆษณาเป็นคำตอบสุดท้ายเนอะ
        reply_alternatives_th: [ดีเลย ยายก็ไม่อยากบอกต่อเกินกว่าที่รู้ จดคำถามไว้ให้คนที่ดูแลเรื่องนี้ช่วยอธิบายกัน]
        feedback_th: ตรวจสอบคำกล่าวอ้างโดยไม่เปลี่ยนผลวิจัยที่ไม่ชัดเจนให้เป็นคำรับรองประสิทธิผล
        skills: [communication, responsibility]
      - id: trust-advertisement
        text_th: ถ้าคนขายบอกว่าช่วยได้ก็น่าจะจริง เราไม่ต้องดูข้อมูลเพิ่มหรอก
        reply_th: ยายอยากช่วย แต่ก็ไม่ได้รู้ว่าคนขายยืนยันจากอะไร เราลองถามให้ชัดก่อนได้ไหม
        feedback_th: คำโฆษณาและการไม่พบปัญหาในคนหนึ่งไม่เพียงพอยืนยันผลของทุกวิธี
  - id: consult
    chapter_th: ตัดสินใจร่วมกับผู้รับการดูแล
    role: mother
    speaker_th: ยายสาย
    prompt_th: ถ้ายังตอบเรื่องส่วนประกอบกับวิธีใช้ไม่ได้ครบ เราจะทำยังไงให้คุณแม่ไม่ต้องเกรงใจยาย
    critical: true
    source_ids: [DTAM-TRIAL, NHS-CONSENT, NHS-QUESTIONS]
    choices:
      - id: pause-consult
        text_th: เรายังไม่เริ่มจากข้อมูลที่ไม่ครบ ช่วยกันนำรายละเอียดไปถามผู้ประกอบวิชาชีพ และฟังว่าคุณแม่ต้องการหรือกังวลอะไรด้วย
        reply_th: ตกลง ยายจะไม่ถือว่าการถามก่อนคือไม่เชื่อใจ ยายช่วยเรื่องอื่นให้ได้พักไปก่อนก็ได้
        reply_alternatives_th: [แบบนี้ยายสบายใจนะ เราหาคนตอบข้อสงสัยก่อน แล้วให้คุณแม่ตัดสินใจโดยไม่ต้องเกรงใจใคร]
        feedback_th: หยุดตรวจสอบก่อนลงมือและเคารพความยินยอม เรื่องนี้ไม่ให้สูตร อุณหภูมิ ตำแหน่ง หรือเวลาประคบ
        skills: [safety, responsibility, support]
      - id: natural-equals-safe
        text_th: สมุนไพรก็เป็นของธรรมชาติ ลองทำเองไปก่อน ไม่ต้องรอถามหรือขอความเห็นคุณแม่แล้ว
        reply_th: ยายก็ยังไม่รู้รายละเอียดนะ ไม่อยากให้ใครต้องฝืนเพราะคิดว่ายายคงรู้ เราถามก่อนดีกว่า
        feedback_th: พลาดจุดสำคัญในการตรวจสอบ ความเป็นธรรมชาติไม่ใช่หลักฐานยืนยันความเหมาะสมเฉพาะบุคคล
        safe: false
