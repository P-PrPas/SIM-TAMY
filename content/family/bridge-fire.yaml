id: bridge-fire
version: '1.2'
status: Draft
mode: solo
title_th: คุยกับยายเรื่องอยู่ไฟ ด้วยความเข้าใจ
description_th: รับฟังความห่วงใยของยาย แยกเรื่องประเพณีออกจากความเหมาะสมเฉพาะบุคคล และฝึกขอคำปรึกษาโดยไม่ทำให้ใครเสียหน้า
# TODO(content): Qualified Thai midwifery and cultural review is pending; no procedure instructions.
voice_style_th: คุณคือยายสาย พูดกับลูกหลานด้วยความห่วงใย ยายมีประสบการณ์ส่วนตัวเรื่องอยู่ไฟ แต่ไม่ใช่ผู้รับรองความปลอดภัยและพร้อมรับฟังเมื่อคนในบ้านไม่สบายใจ ไม่เรียกผู้เรียนว่าหมอ
roles:
  mother: คุณเป็นคุณแม่หลังคลอดในครอบครัวสมมติ ยายสายเสนอเรื่องอยู่ไฟเพราะอยากให้คุณฟื้นตัว คุณยังไม่แน่ใจและอยากมีส่วนตัดสินใจโดยไม่ทำร้ายความรู้สึกยาย
  father: คุณเป็นคุณพ่อในครอบครัวสมมติ ยายสายเสนอเรื่องอยู่ไฟให้คนรักของคุณ คุณอยากรับฟังยายพร้อมสนับสนุนให้คุณแม่มีส่วนตัดสินใจ ไม่ตัดสินใจแทนเธอ
sources:
  - id: DTAM-CULTURE
    title_th: กรมการแพทย์แผนไทยฯ — เอกสารจำแนกหัตถการแพทย์แผนไทย
    url: https://www.dtam.moph.go.th/wp-content/uploads/2023/11/DL0003-15062558-ICD-10-TM.pdf#page=77
    category: culture
    summary_th: หน้าเอกสาร 69 (หน้า PDF 77) รหัส 900-77-20 บันทึกชื่อการอยู่ไฟ ใช้อ้างอิงชื่อหัตถการในศาสตร์แผนไทย ไม่ได้ใช้ยืนยันผลทางคลินิก ข้อห้ามเฉพาะบุคคล หรือวิธีสนทนากับคนในครอบครัว
  - id: NHS-FAMILY
    title_th: NHS — คุยกับญาติให้ชัดว่าต้องการความช่วยเหลือแบบไหน
    url: https://www.nhs.uk/baby/support-and-services/relationships-after-having-a-baby/
    category: guidance
    summary_th: หัวข้อ Relationships with family and friends แนะนำให้คุยกับญาติให้ชัดว่าต้องการความช่วยเหลือแบบไหน เพราะทุกคนกำลังปรับตัวกับบทบาทใหม่ในครอบครัว
  - id: NHS-QUESTIONS
    title_th: NHS — เตรียมคำถามและชวนคนในครอบครัวไปปรึกษาด้วยกัน
    url: https://www.nhs.uk/nhs-services/gps/what-to-ask-your-doctor/
    category: guidance
    summary_th: หัวข้อ Treatment และ Top tips แนะนำให้ถามเรื่องประโยชน์ ความเสี่ยง และทางเลือก จดคำถามกับรายการยาและอาหารเสริมไว้ล่วงหน้า และชวนคนที่ไว้ใจไปช่วยฟังหรือจดคำตอบ
  - id: NHS-CONSENT
    title_th: NHS — ตัดสินใจโดยเข้าใจข้อมูลและไม่ถูกครอบครัวกดดัน
    url: https://www.nhs.uk/tests-and-treatments/consent-to-treatment/
    category: guidance
    summary_th: หัวข้อ Defining consent อธิบายว่าการยินยอมควรเป็นการตัดสินใจโดยสมัครใจ หลังเข้าใจประโยชน์ ความเสี่ยง และทางเลือก โดยไม่ถูกเพื่อนหรือครอบครัวกดดัน
steps:
  - id: listen
    chapter_th: ฟังสิ่งที่ยายเป็นห่วง
    role: mother
    speaker_th: ยายสาย
    prompt_th: ตอนยายมีลูก ผู้ใหญ่ก็ช่วยดูแลกันเรื่องอยู่ไฟ ยายเลยอยากช่วยแบบที่เคยได้รับมา หนูรู้สึกยังไงบ้าง
    source_ids: [DTAM-CULTURE, NHS-FAMILY]
    card:
      tradition_th: การอยู่ไฟหลังคลอด ประเพณีดูแลแม่หลังคลอดที่หลายครอบครัวไทยสืบต่อกันมา
      learning_point_th: เอกสารของกรมการแพทย์แผนไทยฯ บันทึกการอยู่ไฟเป็นชื่อหัตถการในศาสตร์แผนไทย ช่วยให้เข้าใจบริบททางวัฒนธรรม แต่ไม่ได้ยืนยันผลทางคลินิกหรือความเหมาะสมของแต่ละคน
      evidence_status: traditional_practice
      precautions_th:
        - วิธี ระยะเวลา และความเหมาะสมแตกต่างกันในแต่ละคน เรื่องนี้ไม่ได้ระบุขั้นตอนหรือข้อห้ามครบถ้วน
        - การรับฟังประเพณีไม่เท่ากับการยินยอมทำ ผู้รับการดูแลมีสิทธิ์ตัดสินใจเองหลังเข้าใจข้อมูล
      when_to_consult_th: ก่อนตัดสินใจเริ่ม ควรสอบถามผู้ประกอบวิชาชีพที่เกี่ยวข้อง และติดต่อบุคลากรสุขภาพเมื่อรู้สึกผิดปกติหลังคลอดหรือไม่แน่ใจ
      source_ids: [DTAM-CULTURE, NHS-CONSENT]
    choices:
      - id: hear-intention
        text_th: ขอบคุณที่เป็นห่วงนะยาย อยากฟังว่าสำหรับยาย เรื่องนี้ช่วยให้รู้สึกได้รับการดูแลยังไงบ้าง
        reply_th: ยายจำได้ว่าตอนนั้นมีคนคอยอยู่ข้าง ๆ ไม่ต้องทำทุกอย่างเอง ยายเลยอยากให้หนูรู้ว่ามีคนช่วยเหมือนกัน
        reply_alternatives_th: [ยายอยากให้หนูได้พักและมีคนดูแล ไม่ใช่ต้องฝืนทำอะไรเพียงเพราะยายเคยทำ เราค่อย ๆ คุยกันได้]
        feedback_th: รับฟังความหมายของประสบการณ์ โดยยังไม่ได้ตกลงรับหัตถการหรือรับรองผลทางสุขภาพ
        skills: [communication, support]
      - id: dismiss-tradition
        text_th: สมัยนี้ไม่มีใครเชื่อเรื่องแบบนั้นแล้ว ยายอย่าเอามาพูดอีกเลย
        reply_th: ยายไม่ได้อยากบังคับนะ แค่อยากช่วย ถ้ามีอะไรที่หนูกังวล บอกยายตรง ๆ ก็ได้
        feedback_th: การปฏิเสธตัวประเพณีทันทีอาจปิดบทสนทนา ลองถามเจตนาและอธิบายความกังวลโดยไม่ลดคุณค่าของยาย
  - id: clarify
    chapter_th: แยกประสบการณ์กับข้อมูลที่ต้องตรวจสอบ
    role: mother
    speaker_th: ยายสาย
    prompt_th: ยายเคยทำแล้วรู้สึกว่าดี แต่ก็ไม่รู้ว่าของหนูกับของยายเหมือนกันไหม เราจะคุยเรื่องนี้ต่อยังไงดี
    source_ids: [DTAM-CULTURE, NHS-QUESTIONS]
    choices:
      - id: clarify-details
        text_th: ประสบการณ์ยายสำคัญนะ แต่เราอยากจดก่อนว่าหมายถึงวิธีไหนและใครจะดูแล แล้วค่อยนำคำถามไปคุยกับผู้ประกอบวิชาชีพที่เกี่ยวข้อง
        reply_th: ได้ ยายจะเล่าเฉพาะที่จำได้ เรื่องไหนไม่แน่ใจก็บอกว่าไม่แน่ใจ ให้คนที่ดูแลเรื่องนี้ช่วยอธิบายอีกที
        reply_alternatives_th: [คุยแบบนี้ยายสบายใจนะ เราไม่ต้องรีบทำตามความจำของยายทั้งหมด จดคำถามไปถามด้วยกันก่อนก็ได้]
        feedback_th: แยกบริบทวัฒนธรรมออกจากการประเมินความเหมาะสม ไม่มีข้อมูลที่เปิดยืนยันกฎเวลา อุณหภูมิ หรือข้อห้ามครบถ้วน จึงไม่กำหนดวิธีทำในเรื่องนี้
        skills: [communication, responsibility]
      - id: assume-equivalent
        text_th: ถ้ายายเคยทำได้ เราก็คงทำเหมือนกันได้ ไม่ต้องถามรายละเอียดหรอก
        reply_th: ยายเองก็ไม่แน่ใจว่าเหมือนกันทุกอย่างนะ ถ้าหนูมีคำถาม เราถามคนที่รู้เรื่องนี้ก่อนก็ได้
        feedback_th: ประสบการณ์หนึ่งคนไม่ยืนยันความเหมาะสมของทุกคน ควรถามรายละเอียดและตรวจสอบกับผู้ประกอบวิชาชีพ
  - id: agree
    chapter_th: ตกลงร่วมกันโดยไม่บังคับ
    role: mother
    speaker_th: ยายสาย
    prompt_th: ถ้าตอนนี้ยังไม่มั่นใจ ยายควรช่วยอะไรแทนดี จะได้ไม่รู้สึกว่ายายมารบกวน
    critical: true
    source_ids: [NHS-CONSENT, NHS-QUESTIONS, NHS-FAMILY]
    choices:
      - id: seek-guidance
        text_th: ช่วยงานบ้านให้คุณแม่ได้พักก่อนดีไหม ส่วนเรื่องอยู่ไฟเรายังไม่เริ่มจนกว่าจะได้คุยกับผู้ประกอบวิชาชีพและฟังความต้องการของคุณแม่ด้วย
        reply_th: ได้เลย ยายช่วยแบบนั้นก่อนนะ เรื่องอื่นเราถามให้เข้าใจและให้เจ้าตัวสบายใจ ไม่ต้องเกรงใจจนยอมทั้งที่ยังกลัว
        reply_alternatives_th: [ยายไม่ได้เสียใจที่หนูอยากถามก่อนนะ ขอให้บอกกันตรง ๆ ยายช่วยจัดบ้านให้ได้ แล้วค่อยตัดสินใจด้วยกัน]
        feedback_th: ขอคำปรึกษาและเคารพความยินยอม พร้อมเสนอหน้าที่ที่ช่วยครอบครัวได้โดยไม่รับรองหัตถการเอง
        skills: [communication, responsibility, safety, support]
      - id: accept-pressure
        text_th: ถ้าทำให้ยายสบายใจก็เริ่มเลยดีกว่า ไม่ต้องถามใครหรือคุยกับคุณแม่เพิ่มแล้ว
        reply_th: ยายอยากให้ทุกคนสบายใจ ไม่อยากให้ใครต้องยอมเพราะเกรงใจ เราคุยกันก่อนก็ได้นะ
        feedback_th: พลาดจุดสำคัญเรื่องความยินยอมและการขอคำปรึกษา การรักษาน้ำใจไม่แทนการตรวจสอบความเหมาะสม
        safe: false
