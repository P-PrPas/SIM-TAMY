id: first-night
version: '1.1'
status: Draft
title_th: คืนแรกที่บ้าน เราเป็นทีมเดียวกัน
description_th: ผลัดกันรับบทมะลิและนนท์ ฟังสิ่งที่อีกคนยังไม่ได้พูด แบ่งหน้าที่ และวางแผนขอความช่วยเหลือร่วมกัน
# TODO(content): Obtain clinical and family-education expert review before approval.
roles:
  mother: คุณคือมะลิ เพิ่งกลับบ้านพร้อมลูก คุณเหนื่อยและอยากพัก แต่กลัวนนท์จะคิดว่าคุณดูแลลูกไม่ไหว คุณอยากให้เขาถามก่อนว่าต้องการอะไร มากกว่ารอให้คุณสั่งทุกเรื่อง
  father: คุณคือนนท์ อยากช่วยมะลิแต่ไม่รู้จะเริ่มตรงไหน คุณจัดของและทำงานบ้านได้ พรุ่งนี้มีงานเช้า จึงอยากตกลงหน้าที่และคนสำรองให้ชัด แทนการเดาใจกัน
sources:
  - id: WHO-SUPPORT
    title_th: องค์การอนามัยโลก — การดูแลแม่ เด็ก และครอบครัวหลังคลอด
    url: https://www.who.int/news/item/30-03-2022-who-urges-quality-care-for-women-and-newborns-in-critical-first-weeks-after-childbirth
    category: guidance
    summary_th: สนับสนุนการมีส่วนร่วมของคู่ครอง การดูแลทั้งร่างกายและความรู้สึก และการขอความช่วยเหลือจากบุคลากรสุขภาพ
  - id: UNICEF-NIGHT
    title_th: ยูนิเซฟ — การนอนของทารกและการขอคนช่วยดูแล
    url: https://www.unicef.org/parenting/child-care/baby-sleep
    category: guidance
    summary_th: การนอนของทารกแต่ละคนต่างกัน ผู้ดูแลที่เหนื่อยหรือรับมือไม่ไหวควรขอความช่วยเหลือจากคนที่ไว้ใจ
  - id: WHO-SHARED-CARE
    title_th: องค์การอนามัยโลก — การมีส่วนร่วมในงานบ้านและการดูแลครอบครัว
    url: https://www.who.int/news/item/26-09-2019-engaging-men-addressing-harmful-masculinities-to-improve-sexual-and-reproductive-health-and-rights
    category: guidance
    summary_th: หัวข้อ Harmful masculinities and their consequences กล่าวถึงภาระที่ตกกับผู้หญิงจากการมีส่วนร่วมในงานบ้านและการดูแลลูกที่จำกัดของผู้ชาย ใช้รองรับหลักการแบ่งภาระ ส่วนหน้าที่และถ้อยคำในบทเป็นตัวอย่างที่เราออกแบบ ไม่ใช่สูตรแบ่งงานจาก WHO
steps:
  - id: say-how-you-feel
    chapter_th: กลับถึงบ้าน
    role: mother
    speaker_th: นนท์
    prompt_th: ลูกเพิ่งหลับเอง เธอเงียบไปเลย เราทำอะไรไม่ถูก มีอะไรอยากให้เราช่วยตอนนี้ไหม
    source_ids: [WHO-SUPPORT]
    choices:
      - id: ask-rest
        text_th: เราดีใจที่ได้กลับบ้านนะ แต่ตอนนี้ล้ามาก ช่วยดูของที่ต้องใช้กับลูกให้หน่อยได้ไหม เราอยากพักสักช่วง
        reply_th: ได้เลย ขอบคุณที่บอกนะ เดี๋ยวเราจัดของให้ เธออยากให้เราอยู่ใกล้ ๆ หรือให้เงียบหน่อยก็บอกได้
        feedback_th: บอกความรู้สึกและขอความช่วยเหลือที่ทำได้ชัดเจน เปิดพื้นที่ให้อีกคนเข้ามาช่วย
        skills: [communication, support]
      - id: hide-tiredness
        text_th: ไม่เป็นไร เราทำเองได้ เธอไปทำอย่างอื่นเถอะ
        reply_th: อ๋อ ได้ ถ้าอย่างนั้นเราไปเก็บกระเป๋าก่อนนะ แต่ถ้าอยากให้ช่วยเรียกเราได้เลย
        feedback_th: อีกคนอาจไม่รู้ว่าคุณต้องการพัก ลองบอกความต้องการหนึ่งอย่างแทนการเก็บไว้คนเดียว
  - id: offer-specific-help
    chapter_th: ลูกตื่นกลางคืน
    role: father
    speaker_th: มะลิ
    prompt_th: ลูกตื่นอีกแล้ว เรารู้ว่าเธอก็เหนื่อย แต่ไม่อยากเป็นคนคิดทุกอย่างอยู่คนเดียวคืนนี้
    source_ids: [WHO-SUPPORT, WHO-SHARED-CARE, UNICEF-NIGHT]
    choices:
      - id: share-load
        text_th: เราช่วยจัดของกับงานบ้านให้ แล้วผลัดกันอยู่เป็นเพื่อนลูกตามที่ตกลงกัน เธออยากให้เริ่มจากอะไรก่อน
        reply_th: ช่วยจัดของก่อนนะ แค่เธอถามแล้วรับไปทำ เราก็รู้สึกว่าไม่ได้อยู่คนเดียวแล้ว
        feedback_th: เสนอหน้าที่ที่เป็นรูปธรรมพร้อมถามความต้องการ ไม่ผลักภาระวางแผนทั้งหมดให้อีกคน
        skills: [communication, responsibility, support]
        flags: [shared-plan]
      - id: wait-for-orders
        text_th: อยากให้ทำอะไรก็บอกมาแล้วกัน เราไม่รู้จริง ๆ
        reply_th: เราก็ยังคิดไม่ออกเหมือนกัน อยากให้ช่วยคิดด้วย มากกว่ารอให้เราบอกทุกอย่าง
        feedback_th: การรอคำสั่งอย่างเดียวอาจยังทิ้งภาระวางแผนไว้กับอีกคน ลองเสนอสิ่งที่ตนรับผิดชอบได้
        flags: [unshared-plan]
  - id: make-a-backup
    chapter_th: วางแผนสำรอง
    role: mother
    speaker_th: นนท์
    prompt_th: พรุ่งนี้เรามีงานเช้า ถ้าคืนนี้เราสองคนเหนื่อยจนไม่ไหว จะติดต่อใครให้ช่วยดี
    prompt_if:
      unshared-plan: เมื่อกี้เรายังไม่ได้ตกลงว่าใครช่วยอะไร คืนนี้ถ้าเหนื่อยจนคิดไม่ออก อยากให้เรารับเรื่องติดต่อคนช่วยไว้ก่อนไหม
    source_ids: [UNICEF-NIGHT]
    choices:
      - id: trusted-backup
        text_th: ลองถามพี่สาวเราก่อนว่าเขาสะดวกช่วยช่วงไหน แล้วตกลงกันอีกทีนะ ไม่อยากให้ใครต้องฝืนจนไม่ไหว
        reply_th: ดีเลย เราจะช่วยติดต่อและบอกเวลาที่อยากได้คนช่วย ไม่ปล่อยให้เธอจัดการคนเดียว
        feedback_th: วางแผนสำรองร่วมกันและตรวจสอบความพร้อมของผู้ช่วย แทนการสมมติว่าจะมีคนว่างเสมอ
        skills: [responsibility, support]
        flags: [backup-ready]
      - id: push-through
        text_th: ไม่ต้องขอใครหรอก เราคงต้องทนให้ไหวเอง
        reply_th: เราเข้าใจว่าไม่อยากรบกวนใคร แต่เราก็อยากมีทางสำรองไว้คุยกันนะ
        feedback_th: การขอความช่วยเหลือเป็นส่วนหนึ่งของการดูแลครอบครัว ลองเลือกคนที่ไว้ใจและสอบถามความสะดวก
  - id: agree-help-seeking
    chapter_th: ข้อตกลงของครอบครัว
    role: father
    speaker_th: มะลิ
    prompt_th: ถ้าเรากังวลว่าอาการของตัวเองหรือลูกผิดปกติ แต่คนในบ้านบอกให้รอดูก่อน เธอจะช่วยเรายังไง
    prompt_if:
      backup-ready: เรามีแผนขอคนช่วยแล้ว แต่ถ้าคนในบ้านบอกให้รอดูทั้งที่เรายังกังวลเรื่องอาการของตัวเองหรือลูก เธอจะช่วยเราขอคำปรึกษายังไง
    critical: true
    source_ids: [WHO-SUPPORT]
    choices:
      - id: contact-professional
        text_th: เราจะฟังเธอและช่วยติดต่อบุคลากรสุขภาพ ไม่ใช้ความมั่นใจของเราแทนการประเมิน แล้วช่วยจัดการเรื่องเดินทางถ้าต้องไป
        reply_th: ขอบคุณนะ แบบนี้เรากล้าบอกมากขึ้นว่าไม่แน่ใจเรื่องไหน ไม่ต้องกลัวว่าจะถูกมองว่ากังวลเกินไป
        feedback_th: รับฟังความกังวลและร่วมขอความช่วยเหลือที่เหมาะสม ไม่ใช้การจำลองนี้ตัดสินอาการจริง
        skills: [communication, responsibility, safety, support]
      - id: dismiss-concern
        text_th: อย่าคิดมากเลย คนในบ้านผ่านมาก่อน ถ้าเขาบอกให้รอก็คงไม่ต้องถามใคร
        reply_th: เราเข้าใจว่าเขาหวังดี แต่เรายังไม่สบายใจ อยากให้ช่วยฟังและหาคนที่ตอบเรื่องนี้ได้จริง ๆ
        feedback_th: ข้ามจุดสำคัญในการขอความช่วยเหลือ ความคุ้นเคยของครอบครัวไม่แทนการประเมินจากบุคลากรสุขภาพ
        safe: false
