id: parenthood
version: '1.2'
status: Draft
mode: solo
title_th: 100 วันแรก เรียนรู้ไปกับครอบครัว
description_th: สามบทต่อเนื่องตั้งแต่เตรียมคลอดจนถึงการรับมือคำแนะนำในบ้าน การตัดสินใจของคุณจะถูกนำกลับมาพูดคุยในบทถัดไป
# TODO(content): Obtain qualified family-education and clinical review before approval.
roles:
  mother: คุณรับบทคุณแม่ในครอบครัวสมมติที่กำลังเตรียมต้อนรับลูก คุณอยากให้ทุกคนช่วยกันคิดและเคารพการตัดสินใจของคุณ เรื่องราวข้ามช่วงเวลาได้ ไม่ใช่ตารางติดตามสุขภาพรายวัน
  father: คุณรับบทคุณพ่อในครอบครัวสมมติที่กำลังเตรียมต้อนรับลูก คุณอยากช่วยคนรักและลูก แต่ยังต้องเรียนรู้การรับฟังและแบ่งหน้าที่ เรื่องราวข้ามช่วงเวลาได้ ไม่ใช่ตารางติดตามสุขภาพรายวัน
sources:
  - id: NHS-PARTNER
    title_th: NHS — บอกความต้องการและแบ่งงานดูแลลูกกับคู่ครอง
    url: https://www.nhs.uk/baby/support-and-services/relationships-after-having-a-baby/
    category: guidance
    summary_th: หัวข้อ Take time to listen to your partner แนะนำให้บอกความรู้สึกและความต้องการตรง ๆ แทนการคาดว่าอีกคนจะรู้เอง พร้อมแบ่งงานบ้านและงานดูแลลูก
  - id: NHS-REST
    title_th: NHS — แบ่งเวลาดูแลและขอคนที่ไว้ใจช่วยให้ได้พัก
    url: https://www.nhs.uk/baby/support-and-services/sleep-and-tiredness-after-having-a-baby/
    category: guidance
    summary_th: หัวข้อ Share the nights if you can และ Ask friends and relatives for extra support แนะนำให้คู่ครองช่วยแบ่งงานดูแลลูก และขอญาติหรือเพื่อนที่ไว้ใจมาช่วยเพื่อให้ได้พัก ส่วน Where to get further help กล่าวถึงการขอคำปรึกษาเมื่อเหนื่อยจนรับมือไม่ไหว
  - id: NHS-QUESTIONS
    title_th: NHS — เตรียมคำถามและชวนคนในครอบครัวไปปรึกษาด้วยกัน
    url: https://www.nhs.uk/nhs-services/gps/what-to-ask-your-doctor/
    category: guidance
    summary_th: หัวข้อ Treatment และ Top tips แนะนำให้ถามเรื่องประโยชน์ ความเสี่ยง และทางเลือก จดคำถามกับรายการยาและอาหารเสริมไว้ล่วงหน้า และชวนคนที่ไว้ใจไปช่วยฟังหรือจดคำตอบ
  - id: NHS-FAMILY
    title_th: NHS — คุยกับญาติให้ชัดว่าต้องการความช่วยเหลือแบบไหน
    url: https://www.nhs.uk/baby/support-and-services/relationships-after-having-a-baby/
    category: guidance
    summary_th: หัวข้อ Relationships with family and friends แนะนำให้คุยกับญาติให้ชัดว่าต้องการความช่วยเหลือแบบไหน เพราะทุกคนกำลังปรับตัวกับบทบาทใหม่ในครอบครัว
  - id: NHS-CONSENT
    title_th: NHS — ตัดสินใจโดยเข้าใจข้อมูลและไม่ถูกครอบครัวกดดัน
    url: https://www.nhs.uk/tests-and-treatments/consent-to-treatment/
    category: guidance
    summary_th: หัวข้อ Defining consent อธิบายว่าการยินยอมควรเป็นการตัดสินใจโดยสมัครใจ หลังเข้าใจประโยชน์ ความเสี่ยง และทางเลือก โดยไม่ถูกเพื่อนหรือครอบครัวกดดัน
steps:
  - id: before-plan
    chapter_th: บทที่ 1 — ก่อนลูกลืมตาดูโลก
    role: mother
    speaker_th: คนรักของคุณ
    prompt_th: ของใช้เกือบครบแล้ว แต่เรายังไม่ได้คุยกันเลยว่าหลังกลับบ้านใครจะช่วยอะไร เราอยากรู้ว่าเธอคาดหวังอะไรจากเราบ้าง
    source_ids: [NHS-PARTNER]
    choices:
      - id: plan-together
        text_th: เรามาเขียนสิ่งที่ต้องทำแล้วแบ่งกันตามกำลังดีไหม ไม่ต้องเป๊ะตั้งแต่แรก แต่ขอให้มีเวลาคุยปรับกันด้วย
        reply_th: ดีเลย เราขอรับเรื่องอาหารกับงานบ้านก่อน แล้วเราค่อยดูด้วยกันว่ายังมีอะไรที่เธอแบกอยู่คนเดียว
        feedback_th: เริ่มแผนแบ่งหน้าที่โดยเผื่อการปรับ ไม่สมมติว่าอีกคนรู้ความต้องการอยู่แล้ว
        skills: [communication, responsibility]
        flags: [has-plan]
      - id: postpone-plan
        text_th: เอาไว้ถึงตอนนั้นค่อยว่ากันเถอะ เดี๋ยวเราก็น่าจะรู้เองว่าต้องทำอะไร
        reply_th: ได้ แต่เรายังไม่ค่อยมั่นใจนะ ถ้าตอนนั้นต่างคนต่างเหนื่อย เราอาจคิดไม่ตรงกัน
        feedback_th: การเลื่อนคุยทำให้ความคาดหวังยังไม่ชัด บทถัดไปจะเปิดโอกาสให้กลับมาวางแผนอีกครั้ง
        flags: [no-plan]
  - id: before-support
    chapter_th: บทที่ 1 — ก่อนลูกลืมตาดูโลก
    role: mother
    speaker_th: คนรักของคุณ
    prompt_th: แล้วถ้าเราสองคนเหนื่อยหรือกังวลจนไม่รู้จะทำยังไง เรามีใครที่ขอให้ช่วยได้บ้าง
    source_ids: [NHS-REST, NHS-QUESTIONS]
    choices:
      - id: name-support
        text_th: เราลองถามคนที่ไว้ใจว่าสะดวกช่วยอะไรได้บ้าง และเก็บช่องทางติดต่อทีมสุขภาพไว้ด้วยนะ
        reply_th: เราจะช่วยติดต่อเองด้วย ไม่ใช่แค่บอกให้เธอหาคนช่วย ถ้ากังวลเรื่องสุขภาพเราก็จะถามคนที่มีหน้าที่ดูแล
        feedback_th: แยกผู้ช่วยในชีวิตประจำวันออกจากผู้ให้คำปรึกษาด้านสุขภาพและรับผิดชอบการประสานงานร่วมกัน
        skills: [responsibility, support, safety]
        flags: [support-network]
      - id: keep-private
        text_th: เราไม่อยากรบกวนใคร ลองจัดการกันเองก่อนทุกเรื่องเถอะ
        reply_th: เข้าใจว่าอยากดูแลกันเอง แต่เราอยากมีทางสำรอง เผื่อมีวันที่เราไม่ไหวทั้งคู่
        feedback_th: ลองตกลงว่าจะติดต่อใครและเมื่อใด การมีแผนสำรองไม่ใช่ความล้มเหลวของครอบครัว
        flags: [no-support]
  - id: first-night-plan
    chapter_th: บทที่ 2 — คืนแรกที่กลับบ้าน
    role: mother
    speaker_th: คนรักของคุณ
    prompt_th: กลับถึงบ้านแล้ว เราเริ่มจากหน้าที่ที่คุยกันไว้ก่อนนะ แต่คืนนี้มีอะไรอยากปรับจากแผนไหม
    prompt_if:
      no-plan: ลูกเพิ่งหลับ เราต่างคนต่างเดินหาของจนวุ่นไปหมด จำได้ไหมว่าก่อนคลอดเรายังไม่ได้แบ่งหน้าที่กัน คืนนี้อยากให้เราเริ่มช่วยตรงไหน
    source_ids: [NHS-PARTNER, NHS-REST]
    choices:
      - id: adjust-plan
        text_th: ตอนนี้เราต้องการพักกับคนช่วยคิด ช่วยรับเรื่องจัดของและอาหารไปก่อน แล้วเรามาทบทวนกันพรุ่งนี้ได้ไหม
        reply_th: ได้ เรารับสองเรื่องนี้เอง คืนนี้ถ้ามีอะไรไม่ตรงแผนบอกกันนะ เราไม่ต้องทำได้สมบูรณ์ตั้งแต่วันแรก
        feedback_th: ใช้ความต้องการปัจจุบันปรับหน้าที่ให้ชัดเจน ทั้งครอบครัวที่มีแผนและยังไม่มีแผนเริ่มใหม่ได้
        skills: [communication, responsibility, support]
        flags: [plan-repaired]
      - id: blame-partner
        text_th: เรื่องแค่นี้ทำไมต้องให้เราบอกทุกอย่างอีก เธอน่าจะรู้เองสิ
        reply_th: เราอยากช่วยนะ แต่พอได้ยินแบบนี้ก็ไม่แน่ใจว่าจะเริ่มยังไง ลองบอกสิ่งที่อยากให้เรารับผิดชอบสักเรื่องได้ไหม
        feedback_th: ประโยคนี้บอกความคับข้องใจ แต่ยังไม่บอกสิ่งที่ต้องการ ลองเปลี่ยนเป็นคำขอที่อีกคนลงมือทำได้
  - id: first-night-backup
    chapter_th: บทที่ 2 — คืนแรกที่กลับบ้าน
    role: mother
    speaker_th: คนรักของคุณ
    prompt_th: คืนนี้เราเริ่มล้ากันแล้ว คนที่เราคุยไว้ว่าจะช่วยสะดวกช่วงไหนนะ อยากให้เราลองติดต่อไหม
    prompt_if:
      no-support: เมื่อก่อนคลอดเราเลือกจะจัดการกันเอง แต่คืนนี้เราทั้งคู่เริ่มล้าแล้ว ลองคิดหาคนสำรองด้วยกันตอนนี้ได้ไหม
    source_ids: [NHS-REST]
    choices:
      - id: request-relief
        text_th: ลองถามเขาก่อนว่าสะดวกไหม เรามาตกลงสิ่งที่จะขอให้ช่วยให้ชัด แล้วไม่ต้องฝืนว่าเราต้องไหวตลอดก็ได้
        reply_th: เราจะโทรไปถามก่อน ถ้าไม่สะดวกก็หาทางสำรองด้วยกัน ขอบคุณที่บอกว่าเริ่มไม่ไหวนะ
        feedback_th: ยอมรับข้อจำกัดของผู้ดูแลและผู้ช่วย พร้อมวางแผนที่ปรับได้ตามความเป็นจริง
        skills: [communication, support, responsibility]
      - id: conceal-strain
        text_th: อย่าเพิ่งบอกใครเลย เดี๋ยวคนอื่นคิดว่าเราดูแลลูกไม่เป็น
        reply_th: เราไม่ได้คิดว่าเธอดูแลไม่เป็นนะ เราแค่ไม่อยากให้เราสองคนต้องแบกทุกอย่างโดยไม่มีคนช่วย
        feedback_th: ความกลัวถูกตัดสินอาจทำให้ขอความช่วยเหลือยาก ลองพูดถึงสิ่งที่ต้องการโดยไม่ตีค่าตัวเอง
  - id: family-listening
    chapter_th: บทที่ 3 — เมื่อทุกคนหวังดี
    role: mother
    speaker_th: คุณยาย
    prompt_th: ยายเห็นพวกหนูเหนื่อยเลยอยากช่วย สมัยยายมีวิธีดูแลหลังคลอดที่ทำต่อกันมา อยากให้ลองฟังกันก่อนนะ
    prompt_if:
      plan-repaired: คืนแรกหนูเริ่มแบ่งหน้าที่กันใหม่แล้ว ยายอยากช่วยต่อโดยไม่ไปจัดการแทนทั้งหมด พวกหนูอยากให้ยายช่วยตรงไหน
      no-plan: ยายเห็นว่ายังตกลงหน้าที่กันไม่ลงตัว เลยอยากเข้ามาจัดให้ทั้งหมด สมัยยายทำแบบนี้กัน พวกหนูอยากให้ยายช่วยตรงไหน
    source_ids: [NHS-FAMILY]
    choices:
      - id: respectful-boundary
        text_th: ขอบคุณที่เป็นห่วงนะ เราอยากฟังว่ายายตั้งใจช่วยเรื่องอะไร แล้วมาคุยกันว่าอะไรเหมาะกับความต้องการของบ้านเราตอนนี้
        reply_th: ยายอยากให้แม่ได้พักมากกว่าอะไร ถ้าอยากให้ยายช่วยทำอาหารหรือจัดบ้านก่อนก็บอกได้ ยายจะได้ช่วยตรงจุด
        feedback_th: รับฟังเจตนาที่ห่วงใยและชวนตกลงบทบาท ไม่จำเป็นต้องยอมรับคำแนะนำทุกอย่างเพื่อแสดงความเคารพ
        skills: [communication, responsibility, support]
      - id: reject-person
        text_th: เรื่องสมัยก่อนใช้ไม่ได้แล้ว ยายไม่ต้องเข้ามายุ่งหรอก
        reply_th: ยายก็แค่อยากช่วยนะ ถ้าไม่อยากทำแบบยาย เราคุยกันดี ๆ ก็ได้ว่ายายจะช่วยอย่างอื่นยังไง
        feedback_th: การปฏิเสธตัวบุคคลอาจปิดบทสนทนา ลองแยกความตั้งใจดีออกจากข้อมูลที่ยังต้องตรวจสอบ
  - id: family-check
    chapter_th: บทที่ 3 — เมื่อทุกคนหวังดี
    role: mother
    speaker_th: คนรักของคุณ
    prompt_th: มีคำแนะนำหลายทางจนเราเริ่มไม่แน่ใจ ถ้าเกี่ยวกับสุขภาพแม่หรือลูก เราจะตกลงกันยังไงโดยไม่ให้ใครรู้สึกถูกทิ้ง
    critical: true
    source_ids: [NHS-QUESTIONS, NHS-CONSENT]
    choices:
      - id: verify-together
        text_th: เราฟังความเห็นทุกคน แต่เรื่องที่ไม่แน่ใจจะช่วยกันถามบุคลากรสุขภาพก่อน ไม่ให้อีกคนต้องตัดสินใจหรืออธิบายกับบ้านอยู่คนเดียว
        reply_th: ตกลง เราจะช่วยรวบรวมคำถามแล้วคุยกับที่บ้านด้วยกัน ให้ทุกคนรู้ว่าเรารับฟัง แต่ยังต้องตรวจสอบให้เหมาะกับสถานการณ์
        feedback_th: ตั้งข้อตกลงตรวจสอบข้อมูลและขอความช่วยเหลือร่วมกัน ความทรงจำจากบทก่อนใช้ฝึกการสื่อสาร ไม่ทำนายผลสุขภาพจริง
        skills: [communication, safety, support]
      - id: follow-loudest
        text_th: ใครมั่นใจที่สุดก็ทำตามคนนั้นเถอะ จะได้ไม่ต้องเถียงกัน ไม่ต้องถามเพิ่มแล้ว
        reply_th: เราก็อยากให้บ้านสบายใจ แต่ความมั่นใจอย่างเดียวอาจยังตอบคำถามไม่ได้ เราอยากช่วยกันถามคนที่ดูแลเรื่องนี้ก่อน
        feedback_th: พลาดจุดสำคัญในการตรวจสอบและขอความช่วยเหลือ ความมั่นใจหรือการหลีกเลี่ยงความขัดแย้งไม่แทนคำปรึกษาที่เหมาะสม
        safe: false
