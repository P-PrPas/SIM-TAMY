# Authored from the four-stage KB (2026-10-28), pp.3–6, and the public sources below.
# Cultural/evidence-literacy exercise; no personal element calculation or clinical safety rule.
id: thai-elements-family
version: '1.0'
status: Draft
mode: solo
stage: 1
objective_ids: [OBJ-1-03, OBJ-1-04]
knowledge_unit_ids: [KB-TM-ELEMENT-001, KB-ANC-HERITAGE-001]
title_th: ธาตุของเรา เรื่องเล่าของบ้าน และแผนต้อนรับลูก
description_th: ก่อนมีลูก พลอยกับต้นได้ยินคำอธิบายธาตุคนละแบบจากผู้ใหญ่ ลองถามที่มาของตำรา คุยเรื่องอาหารและพฤติกรรม แล้วคิดว่าจะนำความรู้นี้ไปใช้เตรียมครอบครัวอย่างไรโดยไม่ตัดสินสุขภาพจากวันเกิด
boundary_th: บทนี้ใช้ครอบครัวสมมติเพื่อฝึกอ่านข้อมูล ไม่ประเมินธาตุ สุขภาพ การตั้งครรภ์ หรือภาวะมีบุตรยากของผู้ใช้จริง หากมีคำถามเฉพาะตัวให้คุยกับผู้ประกอบวิชาชีพ
roles:
  mother: คุณคือพลอย กำลังวางแผนมีลูกกับต้น คุณชอบสำรับไทยที่แม่ทำให้ และอยากเข้าใจคำว่าธาตุโดยไม่ต้องเปลี่ยนอาหารทั้งหมดตามคำบอกเล่า
  father: คุณคือต้น กำลังเตรียมครอบครัวกับพลอย คุณอยากช่วยจดคำถามและแบ่งเวลาพัก ไม่อยากให้คนรักกังวลจากการทำนายสุขภาพ
sources:
  - id: S41
    title_th: กรมการแพทย์แผนไทยฯ — องค์ความรู้ธาตุเจ้าเรือน หน้า 1–2
    url: https://www.dtam.moph.go.th/wp-content/uploads/e-book/2025/book-dtam-011.pdf
    category: culture
    summary_th: อธิบายธาตุและการจำแนกตามคัมภีร์ ใช้เรียนรู้ระบบคิด ไม่ใช่ผลตรวจสุขภาพของผู้เล่น
  - id: S42
    title_th: มหาวิทยาลัยมหิดล — อาหารตามธาตุเจ้าเรือน
    url: https://www.gj.mahidol.ac.th/main/tard/
    category: culture
    summary_th: ธาตุกำเนิด ปรกติลักษณะ และหมวดรสอาหารตามกรอบแพทย์แผนไทย
  - id: S43
    title_th: หอสมุดแห่งชาติ — คัมภีร์ประถมจินดา
    url: https://manuscript.nlt.go.th/องค์ความรู้/เกร็ดความรู้จากเอกสารโบราณ/รายละเอียดเกร็ดความรู้จากเอกสารโบราณ/ArticleId/606/-5-8
    category: culture
    summary_th: ประวัติศาสตร์เนื้อหาแม่และเด็กในคัมภีร์ ไม่ใช่หลักฐานตัวอ่อนวิทยาสมัยใหม่
  - id: S45
    title_th: Fejzo และคณะ — GDF15 กับคลื่นไส้อาเจียนระหว่างตั้งครรภ์
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10808057/
    category: guidance
    summary_th: งานวิจัยกลไกฮอร์โมนและความไวของมารดา ไม่ใช่แบบทดสอบวินิจฉัยในแอป
steps:
  - id: ask-the-teacher
    chapter_th: ถามให้รู้ว่าตำราไหน
    kind: discover
    role: mother
    speaker_th: ครูผู้สอน
    character_th: ครูผู้สอน
    prompt_th: แม่พลอยเปิดตำราที่ดูเดือนปฏิสนธิ ส่วนพ่อต้นใช้วันเกิด ทั้งสองได้ชื่อธาตุไม่ตรงกัน ครูชวนถามก่อนว่ากำลังใช้วิธีใด และอยากนำไปตอบคำถามเรื่องอะไร
    source_ids: [S41, S42, S43, S45]
    abstain_th: เรายังไม่มีหลักฐานสำหรับข้อสรุปนั้น ลองถามเรื่องความต่างของตำรา ธาตุปัจจุบัน หรือการอ่านคัมภีร์คู่กับความรู้ครรภ์ปัจจุบันก่อนนะ
    intents:
      - id: ASK_ELEMENT_METHODS
        label_th: ทำไมวิธีดูธาตุถึงต่างกัน
        examples_th: [ธาตุตามวันเกิดกับเดือนปฏิสนธิต่างกันอย่างไร, ทำไมตำราบอกธาตุไม่ตรงกัน]
        unit_ids: [KB-TM-ELEMENT-001]
        dimension: evidence_scope
        reply_th: ตำราจำแนกคนละวิธีได้ จึงควรบอกที่มาและใช้เป็นการเรียนรู้วัฒนธรรม ไม่สรุปสุขภาพจากคำตอบชื่อธาตุ
      - id: ASK_PRESENT_CONTEXT
        label_th: ธาตุปัจจุบันเกี่ยวกับพฤติกรรมอย่างไร
        examples_th: [ธาตุปัจจุบันดูจากอะไร, อายุฤดูกาลกับพฤติกรรมเกี่ยวกันอย่างไร]
        unit_ids: [KB-TM-ELEMENT-001]
        reply_th: กรอบสมุฏฐานชวนมองช่วงวัย เวลา ฤดูกาล และวิถีชีวิต แต่รูปร่างหรือพฤติกรรมข้อเดียวไม่ใช่ผลตรวจสุขภาพของใคร
      - id: ASK_PREGNANCY_TEXTS
        label_th: ปฐมจินดาเชื่อมกับความรู้ครรภ์อย่างไร
        examples_th: [ปฐมจินดาเล่าเรื่องอะไร, แพ้ท้องเกี่ยวกับธาตุอย่างไร]
        unit_ids: [KB-ANC-HERITAGE-001]
        reply_th: คัมภีร์เล่าเรื่องแม่และเด็กในกรอบของยุคนั้น ส่วนความรู้ปัจจุบันมีทั้งการติดตามครรภ์และงานวิจัยฮอร์โมน จึงไม่ควรโทษว่าคนแพ้ท้องจำแนกธาตุผิด
    choices:
      - {id: continue, text_th: ไปคุยกับคนในบ้าน, reply_th: ลองใช้สิ่งที่ถามมาในบทสนทนากัน, feedback_th: การถามที่มาช่วยแยกคำอธิบายต่างระบบก่อนนำไปใช้, short_th: ไปคุยกับคนในบ้าน, icon: talk}
  - id: explain-the-difference
    chapter_th: ต่างตำรา ต่างคำถาม
    role: mother
    speaker_th: ต้น
    prompt_th: เราได้ชื่อธาตุต่างกันเลย จะเล่าให้ผู้ใหญ่ฟังยังไงให้ยังคุยกันได้ และไม่เอามาทำนายว่าใครจะมีลูกยาก
    source_ids: [S41, S42]
    choices:
      - {id: compare-sources, text_th: แต่ละตำราใช้ข้อมูลต่างกัน เราลองจดที่มาไว้ ส่วนสุขภาพก่อนมีลูกคุยกับทีมสุขภาพกัน, reply_th: แบบนี้เราเก็บเรื่องของบ้านไว้ได้และรู้ว่าเรื่องไหนต้องถามต่อ, feedback_th: แยกการเรียนรู้เชิงวัฒนธรรมจากการประเมินสุขภาพ โดยไม่ลดคุณค่าของผู้ใหญ่, skills: [communication, support], dimension: evidence_scope, short_th: จดที่มาของแต่ละตำรา, icon: book}
      - {id: change-subject, text_th: เรายังอธิบายไม่ถูก ขอเปลี่ยนเรื่องก่อน, reply_th: ได้ ไว้พร้อมแล้วเราค่อยกลับมาคุยกัน, feedback_th: การพักบทสนทนาเป็นไปได้ แต่ยังมีโอกาสกลับมาเทียบวิธีและถามที่มาให้เข้าใจร่วมกัน, short_th: ขอเปลี่ยนเรื่องก่อน, icon: pause}
  - id: plan-the-table
    chapter_th: สำรับไทยกับชีวิตจริง
    role: mother
    speaker_th: แม่ของพลอย
    prompt_th: แม่อยากทำอาหารตามรสในตำราให้ลูกสองคน เราจะเริ่มจากเมนูที่ทุกคนกินได้แล้วช่วยกันดูส่วนผสมและแบ่งงานดีไหม
    source_ids: [S42, S43, S45]
    choices:
      - {id: plan-together, text_th: ชวนแม่เล่าที่มาของเมนู จดเรื่องอาหาร การพัก และคำถามเรื่องครรภ์ไปคุยกับทีมดูแล, reply_th: งั้นแม่ช่วยเรื่องสำรับ ต้นช่วยจดคำถาม เราค่อยปรับให้เหมาะกับชีวิตของลูกนะ, feedback_th: นำภูมิปัญญามาเป็นบทสนทนาและแผนช่วยเหลือ ไม่ใช้เมนูเปลี่ยนธาตุหรือรับรองผลการตั้งครรภ์, skills: [responsibility, support, communication], dimension: communication, short_th: ชวนแม่เล่าที่มาของเมนู, icon: pot}
      - {id: keep-a-menu-list, text_th: ขอจดรายชื่อเมนูไว้ก่อน ยังไม่คุยเรื่องการแบ่งงาน, reply_th: ได้เลย ไว้ค่อยนัดคุยกันอีกที, feedback_th: มีจุดเริ่มเก็บข้อมูลอาหารแล้ว แต่การแบ่งหน้าที่และการฟังความต้องการของคนรักยังต้องคุยต่อ, short_th: ขอจดรายชื่อเมนูไว้ก่อน, icon: menu}
