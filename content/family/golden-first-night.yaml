id: golden-first-night
version: '1.0'
status: Draft
mode: coop
title_th: 'คืนแรกหลังกลับบ้าน: ทุกคนหวังดี แต่ข้อมูลไม่ครบ'
description_th: มะลิและนนท์เห็นสัญญาณเกี่ยวกับลูกคนละส่วน ผู้ใหญ่ในบ้านหวังดีและเสนอให้รอดูถึงเช้า ผลัดกันเล่าสิ่งที่เห็น ฟังประเพณีอย่างเคารพ แล้วตัดสินใจร่วมกันว่าจะขอความช่วยเหลือจากบุคลากรสุขภาพเมื่อไร
# TODO(content): Qualified clinical, Thai midwifery and cultural review is pending. Draft written from
# public guidance only (docs/research/golden-first-night.md); no treatment advice, no diagnosis.
roles:
  mother: คุณคือมะลิ กลับบ้านพร้อมลูกได้ไม่ถึงวัน คุณเหนื่อยและกลัวถูกมองว่ากังวลเกินเหตุ ในบันทึกส่วนตัวของคุณมีสิ่งที่คุณสังเกตเห็นเกี่ยวกับลูก คุณเลือกเองว่าจะแบ่งปันข้อไหนให้นนท์รู้ และเมื่อไร ยายสายเป็นห่วงและกำลังจะโทรมา
  father: คุณคือนนท์ ช่วยดูแลลูกและเปลี่ยนผ้าอ้อมตลอดวัน ในบันทึกส่วนตัวของคุณมีสิ่งที่คุณสังเกตเห็นซึ่งมะลิอาจยังไม่รู้ คุณไม่อยากทำให้บรรยากาศตึงเครียด จึงลังเลว่าจะพูดดีหรือไม่ คุณเลือกเองว่าจะแบ่งปันข้อไหนและเมื่อไร
facts:
  - id: m-feed
    role: mother
    text_th: ลูกดูดนมได้น้อยลงใน 2 มื้อล่าสุด และต้องปลุกนานกว่าเดิมกว่าจะยอมดูด
    skills: [shared_decision]
  - id: m-sleepy
    role: mother
    text_th: ช่วงหลังลูกหลับนานและตื่นยากกว่าเมื่อเช้า
    skills: [shared_decision]
  - id: f-nappy
    role: father
    text_th: ตั้งแต่เย็นผ้าอ้อมที่เปลี่ยนให้ลูกแทบไม่เปียกเลย
    skills: [shared_decision]
  - id: f-yellow
    role: father
    text_th: ตอนเปิดไฟสว่าง ตาขาวและผิวหน้าลูกดูเหลืองขึ้นกว่าตอนกลับบ้าน
    skills: [shared_decision]
sources:
  - id: WHO-POSTNATAL
    title_th: WHO — แนวทางดูแลแม่และทารกหลังคลอดปี 2022 (ข่าวสรุป)
    url: https://www.who.int/news/item/30-03-2022-who-urges-quality-care-for-women-and-newborns-in-critical-first-weeks-after-childbirth
    category: guidance
    summary_th: ข่าวของ WHO ระบุว่าแนวทางมีขั้นตอนระบุและตอบสนองสัญญาณอันตรายที่ต้องได้รับการดูแลทางการแพทย์เร่งด่วนทั้งในแม่และทารก แนะนำการตรวจหลังคลอดเพิ่มเติมอย่างน้อยสามครั้งในหกสัปดาห์แรก และการคัดกรองภาวะซึมเศร้าและวิตกกังวลหลังคลอด หน้านี้เป็นข่าวสรุปและไม่ได้ลงรายละเอียดรายการสัญญาณอันตราย
  - id: NHS-BABY-HELP
    title_th: NHS — เมื่อไรควรขอความช่วยเหลือทางการแพทย์เร่งด่วนให้ทารกและเด็กเล็ก
    url: https://www.nhs.uk/baby/health/when-to-get-urgent-medical-help-for-babies-and-children-under-5/
    category: guidance
    summary_th: หัวข้อ Immediate action required, Urgent advice และ Trust your instincts ยกตัวอย่างสัญญาณที่ควรขอความช่วยเหลือเร่งด่วน เช่น ปลุกยากหรือไม่ตอบสนอง และไม่ปัสสาวะนาน 12 ชั่วโมง และแนะนำให้ขอคำปรึกษาเมื่อกังวลหรือไม่แน่ใจ รายการนี้เป็นข้อมูลของ NHS สำหรับเด็กเล็ก ไม่ใช่เกณฑ์ที่จำลองนี้ใช้ประเมินทารกจริง
  - id: NHS-JAUNDICE
    title_th: NHS — ตัวเหลืองในทารกแรกเกิด
    url: https://www.nhs.uk/conditions/jaundice-newborn/
    category: guidance
    summary_th: อธิบายวิธีสังเกตสีเหลืองที่ตาขาวและผิว (เห็นยากขึ้นในผิวสีเข้ม) แนะนำให้ขอนัดแพทย์หรือผดุงครรภ์ด่วนหรือโทรปรึกษาหากสงสัยตัวเหลืองหลังอายุ 24 ชั่วโมง และให้ขอความช่วยเหลือฉุกเฉินหากทารกซึมกว่าปกติ ไม่ดูดนม หรือผ้าอ้อมเปียกน้อยหรือไม่เปียก
  - id: DTAM-CULTURE
    title_th: กรมการแพทย์แผนไทยฯ — เอกสารจำแนกหัตถการแพทย์แผนไทย
    url: https://www.dtam.moph.go.th/wp-content/uploads/2023/11/DL0003-15062558-ICD-10-TM.pdf#page=77
    category: culture
    summary_th: หน้าเอกสาร 69 (หน้า PDF 77) รหัส 900-77-20 บันทึกชื่อการอยู่ไฟ ใช้อ้างอิงชื่อหัตถการในศาสตร์แผนไทย ไม่ได้ใช้ยืนยันผลทางคลินิก ข้อห้ามเฉพาะบุคคล หรือวิธีสนทนากับคนในครอบครัว
  - id: NHS-PARTNER
    title_th: NHS — บอกความต้องการและแบ่งงานดูแลลูกกับคู่ครอง
    url: https://www.nhs.uk/baby/support-and-services/relationships-after-having-a-baby/
    category: guidance
    summary_th: หัวข้อ Take time to listen to your partner แนะนำให้บอกความรู้สึกและความต้องการตรง ๆ แทนการคาดว่าอีกคนจะรู้เอง พร้อมแบ่งงานบ้านและงานดูแลลูก
  - id: NHS-CONSENT
    title_th: NHS — ตัดสินใจโดยเข้าใจข้อมูลและไม่ถูกครอบครัวกดดัน
    url: https://www.nhs.uk/tests-and-treatments/consent-to-treatment/
    category: guidance
    summary_th: หัวข้อ Defining consent อธิบายว่าการยินยอมควรเป็นการตัดสินใจโดยสมัครใจ หลังเข้าใจประโยชน์ ความเสี่ยง และทางเลือก โดยไม่ถูกเพื่อนหรือครอบครัวกดดัน
  - id: NHS-QUESTIONS
    title_th: NHS — เตรียมคำถามและชวนคนในครอบครัวไปปรึกษาด้วยกัน
    url: https://www.nhs.uk/nhs-services/gps/what-to-ask-your-doctor/
    category: guidance
    summary_th: หัวข้อ Treatment และ Top tips แนะนำให้ถามเรื่องประโยชน์ ความเสี่ยง และทางเลือก จดคำถามกับรายการยาและอาหารเสริมไว้ล่วงหน้า และชวนคนที่ไว้ใจไปช่วยฟังหรือจดคำตอบ
steps:
  - id: open-up
    chapter_th: คืนแรกที่บ้าน
    role: mother
    speaker_th: นนท์
    prompt_th: เธอเงียบไปพักใหญ่แล้ว มีอะไรที่เห็นหรือรู้สึกเกี่ยวกับลูกที่อยากบอกเราไหม เปิดบันทึกส่วนตัวของเธอแล้วเลือกแบ่งปันข้อที่อยากให้เรารู้ได้นะ
    source_ids: [NHS-PARTNER]
    choices:
      - id: say-what-you-see
        text_th: เราสังเกตเห็นบางอย่างเกี่ยวกับลูกที่ยังไม่ได้บอกนนท์ จะเล่าเฉพาะสิ่งที่เห็นจริง ๆ ไม่ได้เดาว่าเป็นอะไร
        reply_th: ขอบคุณที่บอกนะ เราอยากฟังสิ่งที่เธอเห็นทีละข้อ ไม่ต้องกลัวว่าเราจะมองว่าเธอกังวลเกินไป
        feedback_th: เปิดเรื่องด้วยสิ่งที่สังเกตเห็นและแยกจากการคาดเดา ทำให้อีกคนมีข้อมูลร่วมตัดสินใจ
        skills: [communication, support]
        flags: [opened-up]
      - id: say-fine
        text_th: ไม่มีอะไรหรอก เราแค่เหนื่อย ลูกคงปกติดี
        reply_th: อ๋อ ถ้าอย่างนั้นก็ไม่เป็นไร แต่ถ้าเธอนึกอะไรออก บอกเราได้ทุกเมื่อนะ
        feedback_th: การเก็บสิ่งที่สังเกตไว้คนเดียวอาจทำให้อีกคนไม่มีข้อมูลเมื่อถึงเวลาตัดสินใจ ลองบอกสิ่งที่เห็นแม้ยังไม่แน่ใจความหมาย
        flags: [kept-quiet]
  - id: share-observation
    chapter_th: คืนแรกที่บ้าน
    role: father
    speaker_th: มะลิ
    prompt_th: นนท์เองก็ดูกังวลเรื่องลูกเหมือนกัน ลองบอกเฉพาะสิ่งที่เห็น ไม่ต้องสรุปว่าเกิดอะไรขึ้น เปิดบันทึกส่วนตัวของนนท์แล้วแบ่งปันข้อที่อยากให้เรารู้ได้
    source_ids: [NHS-PARTNER, WHO-POSTNATAL]
    choices:
      - id: share-and-listen
        text_th: เรามีเรื่องที่เห็นเกี่ยวกับลูกอยากเล่าให้เธอฟัง และอยากฟังสิ่งที่เธอเห็นด้วย เราจะไม่เดาว่าเป็นอะไรนะ
        reply_th: เราดีใจที่นนท์พูดก่อน เราสองคนเห็นไม่เหมือนกัน เอามาวางรวมกันแล้วค่อยตัดสินใจนะ
        feedback_th: แบ่งปันสิ่งที่สังเกตและเปิดรับสิ่งที่อีกคนเห็น ซึ่งทำให้ภาพรวมของทั้งสองคนครบขึ้น
        skills: [communication, responsibility, support]
        flags: [both-listening]
      - id: downplay
        text_th: เห็นแค่นิดหน่อย เดี๋ยวก็คงดีเอง ไม่ต้องคิดมาก
        reply_th: ถ้านนท์ว่าอย่างนั้นก็ได้ แต่ถ้าเห็นอะไรเพิ่ม บอกเราด้วยนะ
        feedback_th: การลดความสำคัญของสิ่งที่เห็นโดยไม่ได้บอกรายละเอียดอาจทำให้ข้อมูลสำคัญไม่ถูกนำมาพิจารณา
        flags: [downplayed]
  - id: elder-suggestion
    chapter_th: ผู้ใหญ่หวังดี
    role: mother
    speaker_th: ยายสาย
    prompt_th: ยายโทรมาดูอาการหลานกับแม่ ยายว่าเด็กแรกเกิดก็หลับลึกแบบนี้แหละ แม่ควรพักและอยู่ไฟตามที่ผู้ใหญ่เคยทำ ส่วนลูกรอดูถึงเช้าก็น่าจะพอ
    prompt_if:
      fact:m-feed: ยายได้ยินว่าลูกดูดนมน้อยลง แต่ยายคิดว่าเด็กใหม่ ๆ ก็เป็นแบบนี้ ให้แม่พักตามประเพณีและรอดูถึงเช้าก่อนดีไหม
      fact:f-nappy: ยายได้ยินเรื่องผ้าอ้อมที่แทบไม่เปียก แต่ยายยังคิดว่าไม่ต้องรีบร้อน ให้แม่พักตามประเพณีและรอดูถึงเช้าก่อน
    source_ids: [DTAM-CULTURE, NHS-CONSENT]
    card:
      tradition_th: การอยู่ไฟหลังคลอด ประเพณีดูแลแม่หลังคลอดที่ผู้ใหญ่หลายบ้านเล่าสืบต่อกันมา
      learning_point_th: เอกสารของกรมการแพทย์แผนไทยฯ บันทึกการอยู่ไฟเป็นชื่อหัตถการในศาสตร์แผนไทย ช่วยให้เข้าใจบริบทวัฒนธรรม แต่ไม่ได้บอกว่าเหมาะกับทุกคน และไม่ใช่เครื่องมือประเมินอาการของทารก
      evidence_status: traditional_practice
      precautions_th:
        - ความเหมาะสมแตกต่างกันในแต่ละคน ควรปรึกษาผู้ประกอบวิชาชีพที่เกี่ยวข้องก่อนตัดสินใจ
        - ไม่ควรใช้ประเพณีที่ดูแลแม่แทนการขอความช่วยเหลือเมื่อกังวลสัญญาณผิดปกติของลูก
      when_to_consult_th: เมื่อสังเกตเห็นสิ่งผิดปกติในลูก หรือเมื่อไม่แน่ใจ ให้ติดต่อบุคลากรสุขภาพได้ทันที ไม่ต้องรอให้ทุกคนในบ้านเห็นด้วย
      source_ids: [DTAM-CULTURE, NHS-BABY-HELP]
    choices:
      - id: listen-then-ask
        text_th: ขอบคุณที่เป็นห่วงนะยาย เรื่องอยู่ไฟเรายังคุยกันต่อได้ แต่คืนนี้ขอคุยกับนนท์เรื่องที่เห็นในตัวลูกก่อน ยายช่วยฟังด้วยนะ
        reply_th: ได้ ยายไม่ได้อยากบังคับ ยายแค่ห่วง ถ้าสองคนเห็นอะไรที่กังวล ก็คุยกันให้ชัดก่อนนะ
        feedback_th: รับฟังความห่วงใยและความหมายของประเพณี โดยยังไม่ใช้ประเพณีแทนการพิจารณาสิ่งที่เห็นในลูก
        skills: [communication, support]
        flags: [heard-elder]
      - id: defer-to-elder
        text_th: ถ้ายายว่ารอได้ เราก็รอตามยายก็ได้ ไม่อยากให้ยายเสียใจ
        reply_th: ยายก็บอกได้แค่ที่ยายเคยเห็นนะ ยายไม่ได้เห็นลูกใกล้ ๆ เหมือนพวกหนู
        feedback_th: การเกรงใจผู้ใหญ่เป็นเรื่องเข้าใจได้ แต่ผู้ที่เห็นลูกอยู่ตรงหน้ามีข้อมูลที่ผู้ใหญ่ทางโทรศัพท์อาจไม่มี
        flags: [deferred-elder]
      - id: argue
        text_th: ประเพณีแบบนั้นล้าสมัยแล้ว ยายไม่ต้องมายุ่งเรื่องลูกของเรา
        reply_th: ยายไม่ได้อยากทะเลาะนะ ยายห่วงเฉย ๆ ถ้าอย่างนั้นยายขอวางสายก่อน
        feedback_th: การปฏิเสธทันทีอาจปิดบทสนทนา ลองแยกสิ่งที่เคารพในความห่วงใยออกจากสิ่งที่ต้องตัดสินใจจากข้อมูลตรงหน้า
        flags: [argued]
  - id: joint-help-decision
    chapter_th: จุดตัดสินใจร่วมกัน
    role: mother
    speaker_th: ยายสาย
    joint: true
    critical: true
    prompt_th: ยายยังรออยู่ในสายและบอกว่าให้รอดูถึงเช้า แต่ทั้งสองคนยังกังวลเรื่องลูก ข้อมูลที่แบ่งปันกันไว้ในไทม์ไลน์ด้านบนคือสิ่งที่คุณทั้งสองมีตอนตัดสินใจ แต่ละคนเลือกเองก่อน ถ้าเลือกไม่ตรงกันจะเห็นตัวเลือกของกันและเลือกใหม่ได้
    source_ids: [NHS-BABY-HELP, NHS-JAUNDICE, WHO-POSTNATAL]
    choices:
      - id: contact-health-service
        text_th: ติดต่อบุคลากรสุขภาพหรือสถานพยาบาลตอนนี้ แจ้งสิ่งที่เราสองคนเห็นให้ครบ แล้วทำตามคำแนะนำของเขา ไม่รอให้ถึงเช้า
        reply_th: ถ้าสองคนเห็นตรงกันแบบนี้ ยายไม่ขวางนะ ให้ถามคนที่ดูแลเรื่องนี้โดยตรง ยายอยากให้ลูกปลอดภัย
        feedback_th: ตัดสินใจร่วมกันขอความช่วยเหลือจากบุคลากรสุขภาพเมื่อกังวลสัญญาณในทารก โดยไม่รอให้ทุกคนเห็นด้วยหรือรอให้ถึงเช้า จำลองนี้ไม่ได้ประเมินว่าลูกเป็นอะไร
        skills: [communication, responsibility, safety, support, shared_decision]
        flags: [help-sought]
      - id: wait-until-morning
        text_th: รอดูอาการลูกถึงเช้าก่อน ถ้าเช้านี้ยังกังวลค่อยติดต่อ
        reply_th: เมื่อสองคนเลือกรอ ยายก็ไม่ได้ค้าน แต่สิ่งที่ทั้งสองเห็นในตัวลูกก็ยังไม่มีบุคลากรสุขภาพคนไหนได้ประเมิน
        feedback_th: การรอโดยไม่มีผู้ประเมินทำให้สัญญาณที่เห็นยังไม่ได้รับการตรวจสอบ ความกังวลของผู้ดูแลเป็นเหตุผลเพียงพอที่จะขอคำปรึกษา
        safe: false
        flags: [waited]
      - id: tradition-first
        text_th: ให้แม่พักและทำตามที่ผู้ใหญ่แนะนำก่อน แล้วค่อยดูว่าลูกเป็นอย่างไร
        reply_th: ยายแนะนำเรื่องการดูแลแม่ได้ แต่เรื่องที่เห็นในตัวลูก ยายไม่ได้เป็นคนประเมินนะ
        feedback_th: ประเพณีดูแลแม่ไม่ใช่การประเมินอาการของทารก ไม่ควรใช้แทนการขอความช่วยเหลือเมื่อกังวลสัญญาณในลูก
        safe: false
        flags: [tradition-first]
  - id: consequence
    chapter_th: หลังตัดสินใจ
    role: father
    speaker_th: มะลิ
    prompt_th: คุณสองคนติดต่อบุคลากรสุขภาพแล้ว เขาขอให้เล่าสิ่งที่เห็นทีละอย่าง และจะบอกขั้นตอนถัดไป มะลิถามว่าเราจะเล่าให้เขาฟังอย่างไรดี
    prompt_if:
      waited: ผ่านไปสักพัก ทั้งสองคนยังกังวลเรื่องลูก และยังไม่มีบุคลากรสุขภาพได้รับรู้สิ่งที่เห็นเลย มะลิถามว่าตอนนี้เราจะทำอย่างไรต่อ
      tradition-first: ผ่านไปสักพัก มะลิได้พักตามที่ผู้ใหญ่แนะนำ แต่สิ่งที่เห็นในตัวลูกยังไม่มีบุคลากรสุขภาพคนไหนได้รับรู้ มะลิถามว่าตอนนี้เราจะทำอย่างไรต่อ
    source_ids: [NHS-BABY-HELP, NHS-QUESTIONS]
    choices:
      - id: report-observations
        text_th: เราช่วยกันเล่าเฉพาะสิ่งที่เห็นให้บุคลากรสุขภาพฟังตามลำดับ ไม่เดาว่าเป็นอะไร แล้วทำตามที่เขาแนะนำ
        reply_th: ขอบคุณที่ช่วยกันนะ เราจะเล่าให้ครบและจดสิ่งที่เขาบอกไว้ จะได้ไม่ต้องจำคนเดียว
        feedback_th: เล่าข้อสังเกตเป็นข้อเท็จจริงและร่วมกันรับคำแนะนำ ซึ่งเป็นพฤติกรรมที่เอื้อให้บุคลากรประเมินได้ ผลที่ตามมาจริงขึ้นกับการประเมินของบุคลากร
        skills: [communication, responsibility, safety]
      - id: leave-it-to-other
        text_th: ให้อีกคนเป็นคนเล่าเองแล้วกัน เราไม่แน่ใจว่าจะพูดอะไร
        reply_th: เราก็ไม่แน่ใจเหมือนกัน แต่ถ้าเล่าเฉพาะสิ่งที่เห็นร่วมกันก็น่าจะไม่ยากเกินไป
        feedback_th: ข้อมูลที่แต่ละคนเห็นอาจต่างกัน การให้คนเดียวเล่าอาจทำให้ข้อมูลของอีกคนตกหล่น ลองแบ่งกันเล่าสิ่งที่ตนเห็น
  - id: family-agreement
    chapter_th: ข้อตกลงของครอบครัว
    role: mother
    speaker_th: นนท์
    prompt_th: ครั้งหน้าถ้าผู้ใหญ่บอกให้รอแต่เรายังไม่สบายใจเรื่องลูก เราตกลงกันไว้ว่าอย่างไรดี
    prompt_if:
      kept-quiet: เมื่อกี้เราต่างคนต่างเก็บสิ่งที่เห็นไว้นานไปหน่อย ครั้งหน้าถ้าผู้ใหญ่บอกให้รอแต่เรายังไม่สบายใจเรื่องลูก เราตกลงกันไว้ว่าอย่างไรดี
    source_ids: [NHS-PARTNER, WHO-POSTNATAL]
    choices:
      - id: agree-share-and-ask
        text_th: ตกลงกันว่าจะบอกสิ่งที่เห็นให้กันทันที และถ้ากังวลเรื่องลูกเราขอคำปรึกษาจากบุคลากรสุขภาพได้เลย โดยไม่ต้องรอให้ทุกคนเห็นด้วย
        reply_th: ตกลง จะได้ไม่มีใครต้องแบกความกังวลคนเดียว และไม่ต้องรอให้ใครอนุญาตก่อน
        feedback_th: วางข้อตกลงล่วงหน้าเรื่องการแบ่งปันข้อมูลและการขอคำปรึกษา ช่วยลดการลังเลเมื่อเกิดสถานการณ์คล้ายกัน
        skills: [communication, responsibility, safety, support, shared_decision]
      - id: agree-vaguely
        text_th: ค่อยดูกันตอนนั้นแล้วกัน
        reply_th: ก็ได้ แต่เราไม่อยากให้ถึงตอนนั้นแล้วต่างคนต่างลังเลนะ
        feedback_th: ข้อตกลงที่ไม่ชัดอาจทำให้ลังเลอีกในครั้งหน้า ลองระบุสิ่งที่จะทำเมื่อกังวลเรื่องลูก
