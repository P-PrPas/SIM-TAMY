# Four-stage KB (2026-10-28), pp.13–15: cultural dialogue and support, not an acute-risk case.
# Both decision paths keep feeding/clinical care unchanged; assess communication, not competence.
id: thai-milk-family
version: '1.0'
status: Draft
mode: coop
stage: 4
objective_ids: [OBJ-4-03, OBJ-4-04]
knowledge_unit_ids: [KB-BF-COLOSTRUM-001, KB-NB-FAMILY-001]
title_th: น้ำนมเหลืองของแม่ กับความห่วงใยของยาย
description_th: พลอยเริ่มให้นม ต้นอยากช่วยแต่ยายซึ่งอยู่ต่างจังหวัดได้ยินเรื่องน้ำนมคนละแบบจากคนก่อน ฝึกถามผู้ให้คำปรึกษา เล่าข้อมูลอย่างเคารพ และตกลงวิธีส่งต่อข้อมูลเมื่อหลายคนช่วยกันดูแลลูก
boundary_th: บทนี้ใช้ครอบครัวสมมติ ไม่ประเมินคุณภาพน้ำนม การกิน หรือการเติบโตของเด็กจริง หากลูกกินได้น้อยลง ซึม หรือมีข้อกังวลให้ขอการประเมินจากทีมสุขภาพ
roles:
  mother: คุณคือพลอย อยากให้ครอบครัวรับฟังและช่วยแบ่งงาน คุณอยากถามเรื่องน้ำนมช่วงแรกโดยไม่ถูกตัดสินว่าเลี้ยงลูกดีหรือไม่ดี
  father: คุณคือต้น อยากช่วยพลอยและคุยกับยายผ่านวิดีโอคอลให้เข้าใจตรงกัน คุณช่วยจดสิ่งที่ตกลงและหาช่องทางขอความช่วยเหลือได้
sources:
  - id: S44
    title_th: กรมศิลปากร — คัมภีร์และความรู้การผดุงครรภ์ในอดีต
    url: https://www.finearts.go.th/architecture/view/22430-แรกรับวิชาผดุงครรภ์แผนตะวันตกในสยาม
    category: culture
    summary_th: ย่อหน้าแรกกล่าวถึงน้ำนมในฉันทศาสตร์ ใช้เป็นประวัติศาสตร์ ไม่ใช้ตรวจน้ำนมจริง
  - id: S46
    title_th: WHO — อาหารทารกและเด็กเล็ก
    url: https://www.who.int/news-room/fact-sheets/detail/infant-and-young-child-feeding
    category: guidance
    summary_th: นมแม่ อาหารตามวัย และความสำคัญของการสนับสนุนครอบครัว
  - id: S47
    title_th: WHO — น้ำนมเหลืองและการช่วยเหลือให้เริ่มให้นม
    url: https://www.who.int/tools/elena/interventions/early-breastfeeding
    category: guidance
    summary_th: น้ำนมระยะแรกมีองค์ประกอบช่วยปกป้องทารก และแม่ควรเข้าถึงความช่วยเหลือเมื่อให้นมยาก
steps:
  - id: ask-about-first-milk
    chapter_th: ถามก่อนตีความสี
    kind: discover
    role: mother
    speaker_th: ผู้ให้คำปรึกษานมแม่
    character_th: ผู้ให้คำปรึกษานมแม่
    prompt_th: ยายถามผ่านวิดีโอคอลว่าน้ำนมช่วงแรกไม่เหมือนที่เคยจำได้ เป็นน้ำนมไม่ดีหรือเปล่า พลอยจึงอยากถามให้เข้าใจก่อนเล่าให้ทุกคนฟัง
    source_ids: [S44, S46, S47]
    abstain_th: เรื่องเฉพาะตัวต้องให้ทีมดูแลประเมินร่วมกัน ลองถามความรู้ทั่วไปเรื่องน้ำนมเหลือง ความเชื่อในตำรา หรือวิธีขอความช่วยเหลือก่อนได้นะ
    intents:
      - id: ASK_COLOSTRUM
        label_th: น้ำนมเหลืองมีความหมายอย่างไร
        examples_th: [น้ำนมเหลืองคืออะไร, น้ำนมสีเหลืองควรทิ้งไหม]
        unit_ids: [KB-BF-COLOSTRUM-001]
        reply_th: น้ำนมเหลืองเป็นน้ำนมระยะแรกและมีองค์ประกอบช่วยปกป้องทารก ไม่ควรทิ้งเพราะสีหรือความข้นอย่างเดียว ถ้ากังวลว่าลูกกินได้ดีไหมให้ทีมดูแลช่วยประเมิน
      - id: ASK_MILK_HISTORY
        label_th: ตำราเดิมพูดถึงน้ำนมอย่างไร
        examples_th: [คัมภีร์พูดถึงน้ำนมอย่างไร, ความเชื่อเรื่องน้ำนมมาจากไหน]
        unit_ids: [KB-BF-COLOSTRUM-001]
        dimension: evidence_scope
        reply_th: ตำราเดิมมีคำอธิบายน้ำนมในบริบทของยุคนั้น เราใช้เข้าใจที่มาของความเชื่อ แต่ไม่ใช้สีหรือการทดสอบโบราณตัดสินคุณภาพน้ำนมจริง
      - id: ASK_FEEDING_SUPPORT
        label_th: ถ้าให้นมยาก ครอบครัวช่วยอะไรได้
        examples_th: [ให้นมยากขอความช่วยเหลือที่ไหน, คนในบ้านช่วยแม่ให้นมอย่างไร]
        unit_ids: [KB-BF-COLOSTRUM-001]
        reply_th: ช่วยรับฟังและแบ่งงาน แล้วขอผู้ให้คำปรึกษานมแม่ประเมินปัญหากับแม่และลูก ไม่ต้องกล่าวโทษแม่หรือสรุปจากสีของน้ำนม
    choices:
      - {id: continue, text_th: ชวนต้นกับยายคุยต่อ, reply_th: ลองเลือกสิ่งที่อยากให้คนในบ้านเข้าใจตรงกัน, feedback_th: ใช้ข้อมูลที่ตรวจสอบได้เป็นฐานบทสนทนาโดยไม่ประเมินทารกจริง}
  - id: explain-with-respect
    chapter_th: คนละยุคแต่ห่วงหลานเหมือนกัน
    role: father
    speaker_th: ยาย
    prompt_th: ยายเป็นห่วงหลาน เลยอยากรู้ว่าความรู้เรื่องน้ำนมที่เคยได้ยินใช้กับวันนี้ได้แค่ไหน จะช่วยให้พลอยสบายใจโดยไม่ทำให้ยายรู้สึกถูกตำหนิได้ยังไง
    source_ids: [S44, S47]
    choices:
      - {id: thank-and-explain, text_th: ขอบคุณยายที่ห่วง น้ำนมช่วงแรกมีประโยชน์ เราไม่ตัดสินจากสีอย่างเดียว ถ้ากังวลเราชวนทีมดูแลช่วยกันดูนะ, reply_th: ยายเข้าใจแล้ว ถ้าอย่างนั้นยายช่วยฟังคำแนะนำด้วยได้ไหม, feedback_th: รับฟังความห่วงใยพร้อมอธิบายความรู้ปัจจุบันและช่องทางขอความช่วยเหลือ, skills: [communication, support], dimension: communication}
      - {id: ask-for-more-time, text_th: ขอเวลาทบทวนข้อมูลแล้วเรากลับมาคุยกันนะ ตอนนี้ยังทำตามแผนที่คุยกับทีมดูแลอยู่, reply_th: ได้เลย ยายรอฟังอยู่, feedback_th: ยังรักษาแผนดูแลและบทสนทนาไว้ แต่มีโอกาสอธิบายเหตุผลและชวนยายมีส่วนร่วมให้ชัดขึ้น}
  - id: agree-family-support
    chapter_th: อยู่คนละที่ก็ช่วยกันได้
    role: mother
    joint: true
    speaker_th: พลอยและต้น
    prompt_th: ยายช่วยผ่านโทรศัพท์ได้ ส่วนพลอยกับต้นต้องแบ่งงานในบ้าน ทั้งคู่เลือกเองว่าจะจัดการข้อมูลและขอความช่วยเหลือร่วมกันอย่างไร
    source_ids: [S46, S47]
    choices:
      - {id: shared-care-plan, text_th: จดผู้ช่วยแต่ละช่วง นัดติดตาม และคำถามที่ยังค้างไว้ร่วมกัน ให้ยายช่วยฟังโดยไม่กดดันแม่, reply_th: เราตกลงหน้าที่กันได้ และรู้ว่าจะขอใครช่วยเมื่อมีเรื่องที่ยังไม่เข้าใจ, feedback_th: เปลี่ยนความห่วงใยเป็นความช่วยเหลือที่ทำได้จริงโดยให้แม่มีเสียง, skills: [responsibility, support, shared_decision], dimension: decision}
      - {id: discuss-roles-later, text_th: ทำตามนัดและแผนดูแลเดิมก่อน แล้วนัดคุยเรื่องแบ่งงานกันอีกที, reply_th: ได้ แต่ตอนนี้เรายังต้องคุยว่าใครช่วยอะไรได้บ้าง, feedback_th: แผนดูแลเดิมยังอยู่ แต่รายละเอียดผู้ช่วยและการส่งต่อข้อมูลยังไม่ชัด}
  - id: pass-the-notes-on
    chapter_th: จากวันนี้ถึงวันที่มีคนช่วยเลี้ยง
    role: father
    speaker_th: ต้น
    prompt_th: เมื่อวันหนึ่งมีญาติหรือผู้ดูแลมาช่วย เราจะส่งต่อสิ่งที่ตกลงและเรื่องที่ต้องถามทีมสุขภาพยังไง โดยไม่ต้องให้ทุกคนจำจากคำบอกเล่า
    source_ids: [S46, S47]
    choices:
      - {id: share-written-plan, text_th: ใช้บันทึกร่วมเรื่องการกิน การพัก นัดติดตาม และคนที่ติดต่อได้ แล้วค่อยปรับตามช่วงวัยกับทีมดูแล, reply_th: แบบนี้คนที่มาช่วยอ่านต่อได้ และเราถามเพิ่มได้เมื่อข้อมูลยังไม่ชัด, feedback_th: ทำให้การดูแลต่อเนื่องระหว่างผู้ดูแล โดยไม่ตัดสินครอบครัวที่มีข้อจำกัดต่างกัน, skills: [communication, responsibility], dimension: evidence_scope}
      - {id: keep-personal-notes, text_th: ฉันจะจดไว้ในสมุดส่วนตัวก่อน ไว้ค่อยนัดให้คนอื่นมาอ่าน, reply_th: ได้ แต่เราอาจต้องจัดเวลาเล่าให้ผู้ช่วยคนต่อไปฟังด้วย, feedback_th: มีการจดแล้ว แต่ข้อมูลยังไม่พร้อมส่งต่อให้ผู้ดูแลคนอื่นใช้ร่วมกัน}
