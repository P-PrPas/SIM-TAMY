# Four-stage KB (2026-10-28), pp.7–8: history, rights and family discussion, not a delivery procedure.
id: thai-birth-conversation
version: '1.0'
status: Draft
mode: solo
stage: 2
objective_ids: [OBJ-2-02, OBJ-2-03]
knowledge_unit_ids: [KB-IP-HERITAGE-001, KB-RIGHTS-CONSENT-001]
title_th: เรื่องคลอดของยาย กับแผนคลอดของเรา
description_th: ยายเล่าเรื่องหมอตำแยและความหมายของวันเกิด ระหว่างที่พลอยกับต้นเตรียมรายการคำถามไปคุยเรื่องคลอด ฝึกฟังเรื่องเก่าอย่างเคารพ พร้อมให้แม่มีเสียงในแผนดูแลและไม่ทำนายอนาคตลูกจากลักษณะการเกิด
boundary_th: นี่เป็นบทสนทนาสมมติเพื่อฝึกเตรียมคำถาม ไม่ประเมินวิธีคลอด ฤกษ์คลอด หรือสุขภาพจริง และไม่สอนทำคลอด หากมีอาการหรือข้อกังวลจริงให้ติดต่อทีมที่ดูแล
roles:
  mother: คุณคือพลอย อยากฟังประสบการณ์ของยายและอยากให้แผนคลอดสะท้อนความต้องการของคุณ โดยคุยกับทีมดูแลก่อนตัดสินใจ
  father: คุณคือต้น อยากช่วยจดคำถามและรับฟังพลอย ไม่อยากเลือกแทนเธอหรือสรุปอนาคตลูกจากวันเกิด
sources:
  - id: S44
    title_th: กรมศิลปากร — แรกรับวิชาผดุงครรภ์แผนตะวันตกในสยาม
    url: https://www.finearts.go.th/architecture/view/22430-แรกรับวิชาผดุงครรภ์แผนตะวันตกในสยาม
    category: culture
    summary_th: ประวัติการเปลี่ยนผ่านจากความรู้ในคัมภีร์สู่การผดุงครรภ์แผนตะวันตก ไม่ใช่คู่มือให้ผู้เรียนทำคลอด
  - id: S04
    title_th: WHO — การดูแลระหว่างคลอดที่ยึดผู้คลอดเป็นศูนย์กลาง
    url: https://www.who.int/publications/i/item/9789241550215
    category: guidance
    summary_th: ภาพรวมการดูแลที่คำนึงถึงสิทธิ ศักดิ์ศรี และประสบการณ์ของผู้คลอด
steps:
  - id: hear-the-history
    chapter_th: ฟังที่มาของความไว้ใจ
    role: mother
    speaker_th: ยาย
    prompt_th: สมัยยาย คนในบ้านไว้ใจหมอตำแยที่ดูแลกันมานาน วันนี้ยายอยากรู้ว่าหนูมีอะไรอยากถามทีมดูแลบ้าง
    source_ids: [S44, S04]
    card:
      tradition_th: เรื่องหมอตำแยและคัมภีร์ครรภ์ทรักษาแสดงให้เห็นว่าความรู้และความไว้ใจเรื่องคลอดเปลี่ยนไปตามยุค
      learning_point_th: เข้าใจประวัติศาสตร์ได้โดยไม่ใช้แทนการประเมินปัจจุบัน และไม่ใช้รูปแบบการเกิดตัดสินคุณค่าหรืออนาคตเด็ก
      evidence_status: traditional_practice
      lens:
        wisdom_th: ความทรงจำของยายช่วยให้เข้าใจว่าอะไรทำให้ครอบครัวรู้สึกไว้ใจ
        safety_th: บทเรียนไม่สอนหัตถการคลอด และความเชื่อเรื่องเวลาไม่ควรชะลอการประเมินเมื่อจำเป็น
        rights_th: ผู้คลอดมีส่วนร่วมตัดสินใจกับทีมดูแล โดยครอบครัวช่วยรับฟังและเตรียมคำถาม
      source_ids: [S44, S04]
    choices:
      - {id: listen-and-ask, text_th: ขอบคุณยายที่เล่า หนูอยากจดว่าตอนนั้นยายได้รับความช่วยเหลือแบบไหน แล้วเอาความต้องการของหนูไปคุยกับทีมดูแล, reply_th: ยายดีใจที่หนูฟัง แล้ววันนี้หนูอยากได้คนช่วยเรื่องอะไรบ้าง, feedback_th: ใช้ประวัติของครอบครัวเปิดบทสนทนา โดยยังแยกจากการตัดสินใจดูแลในปัจจุบัน, skills: [communication, support], dimension: communication, short_th: ขอบคุณยาย แล้วจดไปคุยกับทีม, icon: notebook}
      - {id: discuss-later, text_th: ขอจดเรื่องที่ยายเล่าไว้ก่อน แล้วค่อยกลับมาคุยรายละเอียด, reply_th: ได้ ไว้พร้อมแล้วถามยายได้, feedback_th: รักษาบทสนทนาไว้ได้ แต่ยังไม่ได้ค้นว่าผู้คลอดต้องการความช่วยเหลือแบบใด, short_th: จดเรื่องยายไว้ก่อน ค่อยคุยต่อ, icon: pause}
  - id: leave-the-future-open
    chapter_th: วันเกิดเป็นเรื่องเล่า ไม่ใช่อนาคตที่ถูกกำหนด
    role: mother
    speaker_th: ต้น
    prompt_th: ญาติชวนคุยว่าถ้าเกิดวันหรือท่าแบบหนึ่ง ลูกอาจเป็นคนแบบนั้น เราอยากเก็บความหมายดี ๆ ของเรื่องเล่าโดยไม่ติดป้ายให้ลูก จะพูดยังไงดี
    source_ids: [S44, S04]
    choices:
      - {id: separate-story-and-plan, text_th: เก็บเป็นเรื่องเล่าของบ้านได้ แต่อนาคตลูกไม่ถูกกำหนดด้วยวันหรือท่าเกิด แผนดูแลให้ยึดความต้องการของแม่และการประเมินของทีมสุขภาพ, reply_th: งั้นเราจดคำอวยพรไว้ให้ลูก แล้วคุยเรื่องแผนดูแลกันแยกนะ, feedback_th: เคารพคุณค่าทางวัฒนธรรมโดยไม่ใช้เป็นคำทำนายหรือเหตุเลือกการดูแล, skills: [communication, responsibility], dimension: evidence_scope, short_th: เรื่องเล่าไม่กำหนดอนาคตลูก, icon: heart}
      - {id: save-the-story, text_th: เก็บเรื่องที่ญาติเล่าไว้ก่อน ยังไม่สรุปอะไรเกี่ยวกับลูก, reply_th: ได้ เราไม่ต้องติดป้ายให้ลูกตอนนี้, feedback_th: ยังไม่ด่วนตัดสินเด็ก แต่สามารถอธิบายความต่างระหว่างเรื่องเล่ากับหลักฐานได้ชัดขึ้น, short_th: เก็บไว้ ยังไม่สรุปเรื่องลูก, icon: book}
  - id: take-questions-to-the-team
    chapter_th: แผนคลอดที่แม่มีเสียง
    role: mother
    speaker_th: ต้น
    prompt_th: ก่อนนัดครั้งหน้า เราจะเตรียมคำถามเรื่องทางเลือกคลอด การมีคนช่วย และสิ่งที่เธอกังวลยังไงกันดี
    source_ids: [S04]
    choices:
      - {id: ask-benefits-options, text_th: จดสิ่งที่ฉันต้องการ แล้วถามประโยชน์ ความเสี่ยง ทางเลือก และข้อจำกัดกับทีมดูแล โดยให้ฉันร่วมตัดสินใจ, reply_th: ฉันช่วยจดและช่วยฟัง เธอเป็นคนบอกสิ่งที่ต้องการได้เต็มที่นะ, feedback_th: เปลี่ยนความคาดหวังของครอบครัวเป็นคำถามที่เข้าใจได้และเคารพผู้คลอด, skills: [responsibility, support, communication], dimension: decision, short_th: จดความต้องการ ถามทางเลือก, icon: talk}
      - {id: list-practical-items, text_th: เริ่มจากรายการของใช้และเอกสารก่อน ส่วนคำถามค่อยนัดคุยอีกครั้ง, reply_th: ได้ แต่เราควรเผื่อเวลาฟังเรื่องที่เธอกังวลด้วยนะ, feedback_th: เตรียมของได้ส่วนหนึ่ง แต่คำถามและการรับฟังผู้คลอดยังต้องเติมให้ครบ, short_th: ของใช้ก่อน ค่อยนัดคุยคำถาม, icon: menu}
