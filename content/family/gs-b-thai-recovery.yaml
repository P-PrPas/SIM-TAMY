id: gs-b-thai-recovery
version: '1.1'
status: Draft
mode: coop
stage: 3
objective_ids: [OBJ-3-02, OBJ-3-03, OBJ-3-04]
knowledge_unit_ids: [KB-TM-REST-001, KB-TM-SAFE-001, KB-TM-HERB-001, KB-RIGHTS-SCOPE-001, KB-RIGHTS-CONSENT-001, KB-PP-WARN-001, KB-TM-FOOD-001]
# Version 1.1 adds optional food/evidence questions from the four-stage KB, §3.5–3.6, pp.11–12.
# Golden Scenario GS-B (Blueprint section 06): the positive Thai-service route. No emergency here.
# Authored only from docs/knowledge base/Thai_Midwifery_Knowledge_Base_2026.pdf section 4
# (assessment principles before using Thai recovery activities, integration with the health team)
# and section 10 (scenarios on herbs and scope, rights and information). Provenance is
# knowledge_base_2026; not expert-reviewed, no dosing and no self-performed procedures.
title_th: 'ไปใช้บริการฟื้นฟูแบบไทยหลังคลอด ควรถามอะไรก่อน'
description_th: มะลิและนนท์อยากใช้บริการฟื้นฟูหลังคลอดแบบไทยที่ศูนย์ใกล้บ้าน ยายสายก็ดีใจและอยากให้ใช้ ถามผู้ให้บริการด้วยคำถามที่เหมาะสม แบ่งปันสิ่งที่ได้รู้ให้กัน ฟังผู้ใหญ่อย่างเคารพ แล้วตัดสินใจร่วมกันว่าจะใช้บริการอย่างไรให้ปลอดภัยและเข้าใจตรงกัน
boundary_th: นี่คือบทฝึกสมมติของครอบครัวในเรื่องเล่า ไม่ใช่การประเมินสุขภาพจริง หากมีเรื่องสุขภาพของจริง ให้ปรึกษาบุคลากรสุขภาพหรือผู้ให้บริการที่มีสิทธิโดยตรง
roles:
  mother: คุณคือมะลิ คลอดลูกมาไม่นาน อยากใช้บริการฟื้นฟูหลังคลอดแบบไทยที่ศูนย์ใกล้บ้าน คุณตื่นเต้นและอยากเข้าใจว่าควรถามอะไรก่อนไปใช้บริการ ลองถามเจ้าหน้าที่ แล้วเลือกเองว่าจะบอกนนท์ข้อไหน
  father: คุณคือนนท์ อยากช่วยมะลิเตรียมตัวไปใช้บริการฟื้นฟูแบบไทย คุณอยากรู้ว่าต้องถามเรื่องผู้ให้บริการและสมุนไพรอย่างไร ลองถามเจ้าหน้าที่ แล้วเลือกเองว่าจะบอกมะลิข้อไหน
facts:
  - id: m-timing
    role: mother
    text_th: ผู้ให้บริการต้องรู้ช่วงเวลาหลังคลอดและวิธีคลอดของมะลิ รวมถึงแผลผ่าคลอด ก่อนเลือกบริการ
    skills: [shared_decision]
    leak_terms_th: [ช่วงเวลาหลังคลอดและวิธีคลอด]
  - id: m-heat
    role: mother
    text_th: ควรถามเรื่องความร้อนของบริการ เพราะมีความเสี่ยงเรื่องไหม้ ขาดน้ำ และความดัน
    skills: [shared_decision]
    leak_terms_th: [ความเสี่ยงเรื่องไหม้]
  - id: f-provider
    role: father
    text_th: ควรถามว่าผู้ให้บริการเป็นใครและมีสิทธิให้บริการนี้หรือไม่ ไม่ควรเหมาว่ามีใบอนุญาตเพียงเพราะสืบทอดภูมิปัญญามา
    skills: [shared_decision]
    leak_terms_th: [สืบทอดภูมิปัญญามา]
  - id: f-herb
    role: father
    text_th: ถ้ามีสมุนไพร ควรถามส่วนประกอบ ปฏิกิริยากับยาที่ใช้อยู่ และข้อห้ามเฉพาะตำรับ
    skills: [shared_decision]
    leak_terms_th: [ข้อห้ามเฉพาะตำรับ]
sources:
  - id: S19
    title_th: กรมการแพทย์แผนไทยฯ — คู่มือจัดบริการผดุงครรภ์ไทยแบบบูรณาการ (2569)
    url: https://www.dtam.moph.go.th/news-release/49308/
    category: guidance
    summary_th: คู่มือบริการและบูรณาการเป็นจุดเริ่มต้นสำหรับออกแบบบริการร่วมกับทีมสุขภาพ ก่อนนำไปเป็นขั้นตอนของสถานบริการต้องเปิดอ่านฉบับเต็มและให้ผู้รับผิดชอบวิชาชีพรับรองข้อปฏิบัติจริง
  - id: S22
    title_th: Review of Thai Traditional Principles of Postpartum Care (2025), Journal of Health Science of Thailand
    url: https://thaidj.org/index.php/JHS/article/download/13170/12856/41206
    category: culture
    summary_th: งานทบทวนเชิงสำรวจศึกษาผู้ให้บริการจากสถานพยาบาล 101 แห่ง รายงานการใช้กิจกรรมเช่น นวดประคบสมุนไพร อบสมุนไพร และทับหม้อเกลือ การสำรวจความแพร่หลายไม่ได้ยืนยันประสิทธิผลหรือความปลอดภัยของทุกกิจกรรม
  - id: S23
    title_th: กรมการแพทย์แผนไทยฯ — คลังข้อมูลยาสมุนไพร ข้อห้ามของตำรับประสะไพล
    url: https://ttdkl.dtam.moph.go.th/Module10_Webboard/Webboard_View_Reply.aspx?QuestionID=106
    category: limited_evidence
    summary_th: ฐานข้อมูลระบุข้อห้ามของประสะไพลสำหรับหญิงตั้งครรภ์และผู้ตกเลือดหลังคลอด เป็นตัวอย่างว่าสมุนไพรต้องประเมินตามตำรับและภาวะของผู้ป่วย ไม่ควรเหมารวมว่าปลอดภัยเพราะเป็นธรรมชาติ
  - id: S20
    title_th: พ.ร.บ.วิชาชีพการแพทย์แผนไทย พ.ศ. 2556
    url: https://lawplayer.com/th/act/ocs-%E0%B8%A70078-1B-0001
    category: guidance
    summary_th: ถ้อยคำกฎหมายเรื่องขอบเขตวิชาชีพการแพทย์แผนไทย คลังข้อมูลระบุว่าควรตรวจสอบประกาศต้นฉบับก่อนใช้ทางกฎหมาย และไม่สรุปว่าผู้สืบทอดภูมิปัญญามีใบอนุญาตหรือมีสิทธิทำคลอด
  - id: S04
    title_th: WHO — คำแนะนำการดูแลระยะคลอด (Intrapartum care, 2018)
    url: https://www.who.int/publications/i/item/9789241550215
    category: guidance
    summary_th: การดูแลที่ให้เกียรติและยึดผู้รับบริการเป็นศูนย์กลาง สื่อสารชัดเจน คลังข้อมูลใช้เป็นหลักว่าไม่บังคับและไม่บิดเบือนข้อมูลเมื่อให้ผู้รับบริการตัดสินใจ
  - id: S36
    title_th: WHO — สัญญาณอันตรายหลังคลอด (Postpartum warning signs, 2025)
    url: https://www.who.int/campaigns/world-health-day/2025/key-messages
    category: guidance
    summary_th: ฐานความรู้ของคลังข้อมูลระบุสัญญาณอันตรายทั่วไปของแม่และทารกหลังคลอด ตัวอย่างเป้าหมายการเรียนรู้คือเลือดออกมากผิดปกติ เจ็บหน้าอก หรือหายใจลำบากต้องขอความช่วยเหลือทันที
  - id: S34
    title_th: WHO — การรับบริการสุขภาพหลังคลอด (Getting the health services you need after childbirth)
    url: https://www.who.int/tools/your-life-your-health/life-phase/pregnancy--birth-and-after-childbirth/getting-the-health-services-you-need-after-childbirth
    category: guidance
    summary_th: ข้อมูลสุขภาพของ WHO เรื่องการรับบริการและสัญญาณอันตรายหลังคลอดสำหรับประชาชน
  - id: S48
    title_th: การทดลองปลูกไฟธาตุปี 2025 ในแม่หลังคลอด 60 คน
    url: https://pubmed.ncbi.nlm.nih.gov/41043593/
    category: limited_evidence
    summary_th: ผลปริมาณน้ำนมในเงื่อนไขทดลองระยะสั้น ไม่ใช่คำแนะนำให้ใช้ตำรับเอง
  - id: S49
    title_th: การทดลองปลูกไฟธาตุปี 2020 ในแม่หลังคลอด 49 คน
    url: https://he01.tci-thaijo.org/index.php/JTTAM/article/view/240148
    category: limited_evidence
    summary_th: ไม่พบความต่างอย่างมีนัยสำคัญของการเพิ่มปริมาณน้ำนมเฉลี่ยระหว่างกลุ่มภายในสามวัน ต้องอ่านผลและข้อจำกัดควบคู่กัน
steps:
  - id: ask-service-mother
    chapter_th: ก่อนไปศูนย์บริการ
    role: mother
    speaker_th: พี่ปลา
    kind: discover
    character_th: พี่ปลา เจ้าหน้าที่ศูนย์บริการแพทย์แผนไทย (ตัวละครสมมติ)
    prompt_th: มะลิโทรไปสอบถามศูนย์บริการแพทย์แผนไทยใกล้บ้านก่อนไปใช้บริการฟื้นฟูหลังคลอด พิมพ์ถามพี่ปลาอย่างสุภาพ เมื่อพอแล้วจึงกดไปต่อ
    abstain_th: เรื่องนี้พี่ยังไม่มีข้อมูลอ้างอิงที่ยืนยันได้ในตอนนี้ ลองถามผู้ให้บริการที่ตรวจดูมะลิโดยตรงนะคะ
    min_reveals: 1
    source_ids: [S19, S22, S48, S49]
    intents:
      - id: ASK_FOOD_TRADITION
        label_th: ถามเรื่องสำรับหลังคลอดกับของแสลง
        examples_th: [อาหารหลังคลอดควรดูอะไร, ของแสลงต้องงดทุกอย่างไหม, สำรับอาหารของยายมีความหมายอย่างไร]
        unit_ids: [KB-TM-FOOD-001]
        dimension: evidence_scope
        reply_th: เริ่มจากฟังที่มาของสำรับและดูส่วนผสม ความหลากหลาย ความสะอาดกับอาหารที่แพ้ ไม่งดหลายหมวดเพียงเพราะเรียกว่าของแสลง และไม่รับรองว่าเมนูใดเพิ่มน้ำนมได้เสมอค่ะ
      - id: ASK_MILK_EVIDENCE
        label_th: ถามว่างานวิจัยสมุนไพรเพิ่มน้ำนมบอกอะไรได้บ้าง
        examples_th: [มีงานวิจัยสมุนไพรเพิ่มน้ำนมหรือยัง, ปลูกไฟธาตุพิสูจน์แล้วหรือยัง, ผลทดลองสมุนไพรใช้กับทุกคนได้ไหม]
        unit_ids: [KB-TM-FOOD-001]
        dimension: evidence_scope
        reply_th: มีงานทดลอง แต่ผลและเงื่อนไขต่างกัน งานปี 2025 ใน 60 คนรายงานผลระยะสั้น ส่วนงานปี 2020 ใน 49 คนไม่พบความต่างของการเพิ่มปริมาณน้ำนมเฉลี่ยระหว่างกลุ่ม จึงไม่ใช่คำรับรองให้ทุกคนใช้เองค่ะ
      - id: ASK_PURPOSE
        label_th: ถามว่าบริการฟื้นฟูแบบไทยหลังคลอดมีไว้เพื่ออะไร
        examples_th: [บริการนี้ช่วยอะไร, นวดประคบสมุนไพรทำเพื่ออะไร, บริการฟื้นฟูหลังคลอดแบบไทยคืออะไร]
        reveals: []
        unit_ids: [KB-TM-REST-001]
        dimension: evidence_scope
        reply_th: บริการเหล่านี้เป็นการฟื้นฟูสุขภาพหลังคลอดตามบริบทไทย เช่น นวดและประคบสมุนไพร อบสมุนไพร และทับหม้อเกลือ
      - id: ASK_TIMING_WOUND
        label_th: ถามว่าต้องบอกอะไรเรื่องช่วงเวลาหลังคลอดและวิธีคลอด
        examples_th: [ต้องบอกอะไรเรื่องการคลอด, ผ่าคลอดมาใช้บริการได้ไหม, หลังคลอดกี่วันถึงจะเหมาะ]
        reveals: [m-timing]
        unit_ids: [KB-TM-SAFE-001]
        dimension: discovery
        reply_th: ก่อนเลือกบริการ ผู้ให้บริการต้องรู้ช่วงเวลาหลังคลอดและวิธีคลอด รวมถึงแผลผ่าคลอดค่ะ
      - id: ASK_HEAT
        label_th: ถามเรื่องความร้อนของบริการว่าต้องระวังอะไร
        examples_th: [ความร้อนต้องระวังอะไร, อบสมุนไพรร้อนไหม, ประคบร้อนเสี่ยงไหม]
        reveals: [m-heat]
        unit_ids: [KB-TM-SAFE-001]
        dimension: discovery
        reply_th: เรื่องความร้อนต้องประเมินความเสี่ยงเรื่องไหม้ ขาดน้ำ และความดันก่อนค่ะ
    choices:
      - id: continue
        text_th: ถามพี่ปลาพอแล้ว ไปต่อ
        reply_th: ขอบคุณที่โทรมาถามนะคะ ไว้มาคุยกันที่ศูนย์ได้เลยค่ะ
        feedback_th: ถามผู้ให้บริการก่อนใช้บริการ ช่วยให้ได้ข้อมูลที่ตรงกับสถานการณ์ของตนเอง
  - id: ask-service-father
    chapter_th: ก่อนไปศูนย์บริการ
    role: father
    speaker_th: พี่ปลา
    kind: discover
    character_th: พี่ปลา เจ้าหน้าที่ศูนย์บริการแพทย์แผนไทย (ตัวละครสมมติ)
    prompt_th: นนท์อยากถามพี่ปลาเรื่องผู้ให้บริการ สมุนไพร และสิทธิของผู้รับบริการ พิมพ์ถามอย่างสุภาพ เมื่อพอแล้วจึงกดไปต่อ
    abstain_th: เรื่องนี้พี่ยังไม่มีข้อมูลอ้างอิงที่ยืนยันได้ในตอนนี้ ลองถามผู้ให้บริการโดยตรงนะคะ
    min_reveals: 1
    source_ids: [S20, S23]
    intents:
      - id: ASK_PROVIDER
        label_th: ถามว่าผู้ให้บริการเป็นใครและมีสิทธิให้บริการหรือไม่
        examples_th: [ใครเป็นผู้ให้บริการ, ผู้ให้บริการมีสิทธิไหม, ต้องมีใบอนุญาตหรือเปล่า]
        reveals: [f-provider]
        unit_ids: [KB-RIGHTS-SCOPE-001]
        dimension: discovery
        reply_th: ควรถามให้ชัดว่าผู้ให้บริการเป็นใครและมีสิทธิให้บริการนี้หรือไม่ ไม่ควรเหมาว่ามีใบอนุญาตเพียงเพราะสืบทอดภูมิปัญญามาค่ะ
      - id: ASK_INGREDIENTS
        label_th: ถามว่าถ้ามีสมุนไพรต้องถามอะไรบ้าง
        examples_th: [สมุนไพรต้องถามอะไร, ส่วนประกอบสมุนไพรคืออะไร, สมุนไพรกับยาที่ใช้อยู่เป็นยังไง]
        reveals: [f-herb]
        unit_ids: [KB-TM-HERB-001]
        dimension: discovery
        reply_th: ถ้ามีสมุนไพร ควรถามส่วนประกอบ ปฏิกิริยากับยาที่ใช้อยู่ และข้อห้ามเฉพาะตำรับค่ะ
      - id: ASK_CONSENT
        label_th: ถามว่าขอข้อมูลเพิ่มหรือปฏิเสธก่อนยินยอมได้ไหม
        examples_th: [ปฏิเสธได้ไหม, ขอข้อมูลเพิ่มก่อนได้ไหม, ต้องยินยอมก่อนใช่ไหม]
        reveals: []
        unit_ids: [KB-RIGHTS-CONSENT-001]
        dimension: evidence_scope
        reply_th: ผู้รับบริการขอข้อมูลเพิ่มก่อนตัดสินใจได้ค่ะ และการให้ข้อมูลควรไม่บังคับและไม่บิดเบือน
    choices:
      - id: continue
        text_th: ถามพี่ปลาพอแล้ว ไปต่อ
        reply_th: ขอบคุณที่โทรมาถามนะคะ ไว้มาคุยกันที่ศูนย์ได้เลยค่ะ
        feedback_th: ถามเรื่องผู้ให้บริการและสิทธิของตนก่อนใช้บริการ ช่วยให้ตัดสินใจโดยเข้าใจข้อมูล
  - id: share-checklist
    chapter_th: แบ่งปันสิ่งที่ได้รู้
    role: mother
    speaker_th: นนท์
    prompt_th: นนท์ถามว่ามะลิได้ข้อมูลอะไรจากพี่ปลาบ้าง เปิดบันทึกส่วนตัวแล้วเลือกแบ่งปันข้อที่อยากให้นนท์รู้ได้ จะพิมพ์เล่าหรือกดเลือกด้านล่างก็ได้
    source_ids: [S19]
    choices:
      - id: share-what-we-learned
        text_th: เล่าสิ่งที่ได้ถามมาให้นนท์ฟังตามที่ได้ยินจริง แล้วถามว่านนท์ได้ข้อมูลอะไรมาบ้าง เราจะได้ใช้ข้อมูลร่วมกัน
        reply_th: ขอบคุณที่เล่านะ เราก็ได้ข้อมูลมาเหมือนกัน เอามาวางรวมกันเลย
        feedback_th: แบ่งปันสิ่งที่ได้ยินจริงและเปิดรับข้อมูลของอีกคน ทำให้ครอบครัวมีรายการคำถามร่วมกันก่อนไปใช้บริการ
        skills: [communication, support]
        dimension: communication
      - id: keep-it-to-self
        text_th: เก็บข้อมูลไว้ก่อน เดี๋ยวไปถึงศูนย์ค่อยถามเองก็ได้
        reply_th: ก็ได้ แต่ถ้ามีอะไรที่เธอได้ยินมา บอกเราไว้ก่อนก็ดีนะ
        feedback_th: ข้อมูลที่ได้มาแต่ละคนอาจต่างกัน การเก็บไว้คนเดียวทำให้อีกคนเตรียมคำถามไม่ครบ
  - id: elder-offer
    chapter_th: ผู้ใหญ่ดีใจ
    role: father
    speaker_th: ยายสาย
    prompt_th: ยายสายอยากทำแกงเลียงกับสำรับอุ่นที่บ้านคุ้นเคยให้มะลิได้พัก และบอกว่าจะต้มสมุนไพรให้ดื่มด้วย นนท์จะคุยอย่างไรให้แยกอาหารที่ช่วยกันเตรียมออกจากยาสมุนไพรที่ต้องถามก่อนใช้ พิมพ์ตอบยายหรือกดเลือกด้านล่างก็ได้
    prompt_if:
      fact:f-herb: ยายสายอยากทำแกงเลียงกับสำรับอุ่นให้มะลิได้พัก และบอกว่าจะต้มสมุนไพรให้ดื่มด้วย นนท์เพิ่งได้ข้อมูลมาว่าสมุนไพรมีเรื่องที่ควรถามก่อน จะคุยแยกอาหารออกจากยาสมุนไพรอย่างไรดี
    source_ids: [S22, S23]
    card:
      tradition_th: บริการฟื้นฟูหลังคลอดแบบไทย เช่น นวดประคบสมุนไพร อบสมุนไพร และทับหม้อเกลือ เป็นภูมิปัญญาที่ผู้ใหญ่หลายบ้านภูมิใจและสืบต่อกันมา
      learning_point_th: บริการเหล่านี้เป็นส่วนหนึ่งของการดูแลหลังคลอดตามบริบทไทย ใช้อย่างปลอดภัยได้เมื่อถามผู้ให้บริการให้ชัดก่อน ผลสำรวจการใช้ไม่ได้ยืนยันประสิทธิผลหรือความปลอดภัยของทุกกิจกรรม
      evidence_status: traditional_practice
      precautions_th:
        - สมุนไพรต้องประเมินตามตำรับและภาวะของผู้รับบริการ ไม่ควรเหมาว่าปลอดภัยเพราะเป็นธรรมชาติ
        - ตรวจส่วนประกอบ ปฏิกิริยากับยา และข้อห้ามเฉพาะตำรับก่อนใช้
      when_to_consult_th: ก่อนใช้สมุนไพรหรือบริการใด ให้ถามผู้ให้บริการที่มีสิทธิ และถ้าพบเลือดออกมากผิดปกติ เจ็บหน้าอก หรือหายใจลำบาก ให้ขอความช่วยเหลือจากบุคลากรสุขภาพทันที
      lens:
        wisdom_th: นวดประคบสมุนไพร อบสมุนไพร และทับหม้อเกลือ เป็นกิจกรรมฟื้นฟูหลังคลอดตามบริบทไทย พบรายงานการใช้ในสถานพยาบาลที่เป็นแหล่งฝึก 101 แห่ง
        safety_th: ผลสำรวจไม่ยืนยันประสิทธิผลหรือความปลอดภัยของทุกกิจกรรม ต้องตรวจช่วงเวลา ข้อห้าม แผลผ่าคลอด ความร้อน ส่วนประกอบ และปฏิกิริยาระหว่างยา
        rights_th: ถามผู้ให้บริการว่ามีสิทธิให้บริการหรือไม่ ผู้ใช้บริการขอข้อมูลเพิ่มได้และไม่ถูกบังคับให้ตัดสินใจ
      source_ids: [S22, S23, S20]
    choices:
      - id: welcome-and-ask
        text_th: ขอบคุณที่ยายสนับสนุนนะ ก่อนใช้สมุนไพรเราจะถามผู้ให้บริการเรื่องส่วนประกอบและข้อห้ามก่อน แล้วค่อยตัดสินใจร่วมกัน
        reply_th: ได้เลย ยายดีใจที่หนูใส่ใจ ถ้าเขาบอกว่าเหมาะก็ค่อยทำนะ
        feedback_th: ชื่นชมความตั้งใจของผู้ใหญ่และขอตรวจส่วนประกอบกับข้อห้ามก่อนใช้สมุนไพร ตรงกับหลักว่าสมุนไพรต้องประเมินตามตำรับและภาวะของผู้ใช้
        skills: [communication, support, safety]
        dimension: evidence_scope
        flags: [asked-first]
      - id: accept-herb-now
        text_th: ให้ยายต้มให้ดื่มเลย สมุนไพรเป็นของธรรมชาติ ไม่น่ามีปัญหา
        reply_th: ได้เลย เดี๋ยวยายต้มให้ทันที
        feedback_th: ไม่ควรสรุปว่าสมุนไพรปลอดภัยเพราะเป็นธรรมชาติ เพราะต้องประเมินตามตำรับและภาวะของผู้ใช้ก่อน
        safe: false
        flags: [herb-now]
      - id: reject-tradition
        text_th: ไม่ต้องใช้อะไรแบบไทยเลยยาย ไปโรงพยาบาลอย่างเดียวดีกว่า
        reply_th: ยายแค่อยากช่วยเท่านั้นนะ ไม่คิดว่าหนูจะไม่เอาอะไรเลย
        feedback_th: การปฏิเสธทั้งหมดอาจปิดบทสนทนา ลองรับฟังความตั้งใจดี แล้วขอตรวจข้อมูลที่เป็นข้อห้ามก่อนใช้
        flags: [rejected-tradition]
  - id: joint-booking
    chapter_th: ตัดสินใจร่วมกัน
    role: mother
    speaker_th: พี่ปลา
    joint: true
    prompt_th: พี่ปลาถามว่าจะนัดใช้บริการที่ศูนย์หรือไม่ ข้อมูลที่แบ่งปันกันไว้ในไทม์ไลน์คือสิ่งที่ทั้งสองคนมีตอนตัดสินใจ ตัดสินใจโดยกดปุ่มเท่านั้น แต่ละคนเลือกเองก่อน ถ้าเลือกไม่ตรงกันจะเห็นตัวเลือกของกันและเลือกใหม่ได้
    source_ids: [S19, S04]
    choices:
      - id: book-with-checklist
        text_th: นัดใช้บริการและนำรายการคำถามไปถามผู้ให้บริการก่อนเริ่ม ทั้งเรื่องช่วงเวลาหลังคลอด ความร้อน ผู้ให้บริการ และสมุนไพร
        reply_th: ยินดีค่ะ เตรียมคำถามมาได้เลย พี่จะให้ผู้ให้บริการอธิบายก่อนเริ่มทุกอย่าง
        feedback_th: ใช้บริการฟื้นฟูแบบไทยโดยถามเรื่องช่วงเวลา ความร้อน ผู้ให้บริการ และสมุนไพรก่อน ช่วยให้ตัดสินใจโดยเข้าใจข้อมูล
        skills: [communication, responsibility, safety, support, shared_decision]
        dimension: decision
        flags: [booked-with-checklist]
      - id: book-without-asking
        text_th: นัดใช้บริการเลย ไปถึงแล้วค่อยดูว่าเขาทำอะไรให้
        reply_th: ได้ค่ะ แต่ถ้าสงสัยอะไรถามเราได้ตลอดนะคะ
        feedback_th: ใช้บริการได้ แต่ถ้าไม่ถามล่วงหน้า อาจพลาดข้อมูลเรื่องช่วงเวลา ความร้อน และข้อห้ามที่ควรรู้ก่อนเริ่ม
        flags: [booked-blind]
      - id: skip-service
        text_th: ยังไม่ต้องใช้บริการ ขอรอก่อน
        reply_th: ได้ค่ะ ถ้าเปลี่ยนใจหรืออยากรู้เพิ่ม โทรมาถามได้เสมอนะคะ
        feedback_th: การรอก่อนเป็นสิทธิของผู้รับบริการ ลองเก็บรายการคำถามไว้เพื่อถามเมื่อพร้อม
        flags: [skipped-service]
  - id: at-service
    chapter_th: ที่ศูนย์บริการ
    role: father
    speaker_th: พี่ปลา
    prompt_th: นนท์และมะลิไปถึงศูนย์บริการ ผู้ให้บริการถามว่ามีอะไรที่อยากให้ระวังเป็นพิเศษหรือไม่ พิมพ์ตอบหรือกดเลือกด้านล่างก็ได้
    source_ids: [S19, S36]
    choices:
      - id: tell-and-agree-stop
        text_th: บอกช่วงเวลาหลังคลอด วิธีคลอด แผล และยาที่ใช้อยู่ และตกลงกันไว้ว่าถ้ามีอาการผิดปกติจะหยุดบริการทันทีและให้บุคลากรสุขภาพประเมิน
        reply_th: ขอบคุณที่บอกครบนะคะ เราจะจดไว้ และถ้ามีอะไรผิดปกติเราจะหยุดและประสานทีมสุขภาพให้ค่ะ
        feedback_th: แจ้งข้อมูลสำคัญให้ผู้ให้บริการและตกลงจุดหยุดบริการกับการส่งต่อไว้ล่วงหน้า ตรงกับหลักของการบูรณาการบริการแบบไทยกับทีมสุขภาพ
        skills: [communication, responsibility, safety]
        dimension: communication
      - id: stay-quiet
        text_th: ไม่ต้องบอกอะไรมาก เดี๋ยวเขาไม่ให้ทำ
        reply_th: ถ้าอย่างนั้นเราทำตามขั้นตอนปกติ แต่อยากให้เล่าอะไรที่สำคัญไว้นะคะ
        feedback_th: ข้อมูลที่ไม่ได้แจ้งอาจทำให้ผู้ให้บริการประเมินความเหมาะสมได้ไม่ครบ ลองแจ้งสิ่งสำคัญแม้กลัวว่าจะไม่ได้ใช้บริการ
  - id: family-plan
    chapter_th: ข้อตกลงของครอบครัว
    role: mother
    speaker_th: นนท์
    prompt_th: หลังใช้บริการเสร็จ เราตกลงกันอย่างไรสำหรับครั้งต่อไปที่จะใช้บริการแบบไทยหรือสมุนไพร
    source_ids: [S19, S23]
    choices:
      - id: agree-ask-and-record
        text_th: ตกลงกันว่าทุกครั้งจะถามผู้ให้บริการเรื่องข้อห้ามก่อน จดคำตอบและแผนที่ตกลง และเล่าให้ทีมสุขภาพที่ดูแลเรารู้ด้วย
        reply_th: ตกลง ครอบครัวเราจะได้ใช้ภูมิปัญญาอย่างเข้าใจตรงกัน และทีมสุขภาพก็รู้ด้วย
        feedback_th: วางข้อตกลงให้ถามข้อห้าม จดแผน และประสานกับทีมสุขภาพ ตรงกับหลักการบูรณาการบริการแบบไทยกับทีมสุขภาพ
        skills: [communication, responsibility, safety, support, shared_decision]
        dimension: evidence_scope
      - id: agree-vaguely
        text_th: ค่อยดูกันตอนนั้นแล้วกัน
        reply_th: ก็ได้ แต่เราไม่อยากให้ต่างคนต่างไม่แน่ใจนะ
        feedback_th: ข้อตกลงที่ไม่ชัดอาจทำให้ลังเลอีกในครั้งหน้า ลองระบุสิ่งที่จะถามและจดไว้
