components:
  securitySchemes:
    SessionToken:
      type: http
      scheme: bearer
      description: Opaque learner token returned once by `POST /v1/sessions`. Valid only for that session.
    InstructorSecret:
      type: apiKey
      in: header
      name: X-Instructor-Secret
      description: Shared secret from the `INSTRUCTOR_SECRET` environment variable.

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseId:
      name: case_id
      in: path
      required: true
      schema:
        type: string
        examples: [PP-001]
    ClassCode:
      name: code
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Z0-9]{6}$"

  headers:
    XRequestID:
      description: Request correlation id; also present in error bodies.
      schema:
        type: string
    NoStore:
      description: Always `no-store` for session-specific data.
      schema:
        type: string
        enum: [no-store]
    RateLimitLimit:
      description: Requests allowed per window (default 10 per minute per session).
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests remaining in the current window.
      schema:
        type: integer
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Missing or invalid token/secret (`UNAUTHORIZED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: "ไม่ได้รับอนุญาต กรุณาเข้าสู่ระบบใหม่"
              details: {}
              request_id: 0a1b2c3d
    NotFound:
      description: Resource not found (`NOT_FOUND`, or a more specific code).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: "ไม่พบข้อมูลที่ต้องการ"
              details: {}
              request_id: 0a1b2c3e
    SessionExpired:
      description: Session expired after the idle timeout (`SESSION_EXPIRED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: SESSION_EXPIRED
              message: "เซสชันหมดอายุเนื่องจากไม่มีการใช้งาน กรุณาเริ่มเคสใหม่"
              details:
                idle_timeout_s: 1800
              request_id: 0a1b2c3f
    ValidationError:
      description: Request body or query failed validation (`VALIDATION_ERROR`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: VALIDATION_ERROR
              message: "ข้อมูลที่ส่งมาไม่ถูกต้อง"
              details:
                fields:
                  - loc: [body, learner_name]
                    msg: "ต้องมีความยาว 1-30 ตัวอักษร"
              request_id: 0a1b2c40
    RateLimited:
      description: Too many requests (`RATE_LIMITED`).
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: RATE_LIMITED
              message: "ส่งคำขอถี่เกินไป กรุณารอสักครู่"
              details:
                retry_after_s: 12
              request_id: 0a1b2c41
    LlmUnavailable:
      description: LLM path and fallback both failed (`LLM_UNAVAILABLE`). Retry is safe; the turn was not counted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected server error (`INTERNAL_ERROR`). No state was changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    ClassPilotFeedback:
      properties:
        total:
          type: integer
          title: Total
        usefulness_avg:
          anyOf:
          - type: number
          - type: 'null'
          title: Usefulness Avg
        realism_avg:
          anyOf:
          - type: number
          - type: 'null'
          title: Realism Avg
        items:
          items:
            $ref: '#/components/schemas/PilotFeedback'
          type: array
          title: Items
      type: object
      required:
      - total
      - usefulness_avg
      - realism_avg
      - items
      title: ClassPilotFeedback
    PilotFeedback:
      properties:
        role:
          type: string
          enum:
          - learner
          - instructor
          - practitioner
          title: Role
        usefulness:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Usefulness
        realism:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Realism
        comment:
          type: string
          maxLength: 500
          title: Comment
          default: ''
        consent:
          type: boolean
          const: true
          title: Consent
          default: true
        session_id:
          type: string
          format: uuid
          title: Session Id
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - role
      - usefulness
      - realism
      - session_id
      - created_at
      title: PilotFeedback
    PilotFeedbackRequest:
      properties:
        role:
          type: string
          enum:
          - learner
          - instructor
          - practitioner
          title: Role
        usefulness:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Usefulness
        realism:
          type: integer
          maximum: 5.0
          minimum: 1.0
          title: Realism
        comment:
          type: string
          maxLength: 500
          title: Comment
          default: ''
        consent:
          type: boolean
          const: true
          title: Consent
      additionalProperties: false
      type: object
      required:
      - role
      - usefulness
      - realism
      - consent
      title: PilotFeedbackRequest
    # ---------- Common ----------
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - TEXT_TOO_LONG
        - TURN_LIMIT
        - TURN_IN_PROGRESS
        - SESSION_COMPLETED
        - SESSION_EXPIRED
        - INVALID_PHASE
        - DECISION_ALREADY_COMMITTED
        - DECISION_OPTION_INVALID
        - IDEMPOTENCY_CONFLICT
        - REPORT_NOT_READY
        - UNAUTHORIZED
        - FORBIDDEN
        - GLASSBOX_DISABLED
        - NOT_FOUND
        - CASE_NOT_AVAILABLE
        - VARIANT_NOT_AVAILABLE
        - CLASS_NOT_FOUND
        - RATE_LIMITED
        - LLM_UNAVAILABLE
        - INTERNAL_ERROR
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: Thai, safe to show to the user.
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
    Variant:
      type: string
      enum: [A, B, C]
      description: A = genuine red flag; B = benign look-alike (Could); C = patient minimizes + family pressure (Should).
    CaseStatus:
      type: string
      enum: [Draft, In Review, Approved]
    Phase:
      type: string
      enum: [INTERVIEW, PRESSURE, CLOSING, COMPLETED]
      description: |
        Public phases. The internal `INTRO` state is collapsed into `INTERVIEW`.
        `PRESSURE` occurs only in Variant C after a referral decision.
    SessionStatus:
      type: string
      enum: [active, completed, expired]
    Speaker:
      type: string
      enum: [learner, patient, relative, system]
    SafetyStatus:
      type: string
      enum: [SAFETY_MET, SAFETY_NOT_MET]
    RiskState:
      type: string
      enum: [unrecognized, recognized, escalated]
    ItemResultValue:
      type: string
      enum: [pass, fail, partial, na]
    EventType:
      type: string
      enum:
        - SESSION_STARTED
        - LEARNER_MESSAGE
        - ACTIONS_DETECTED
        - ACTION_REPEATED
        - CLARIFICATION_ASKED
        - FACT_REVEALED
        - RISK_STATE_CHANGED
        - PHASE_CHANGED
        - DECISION_COMMITTED
        - UNSAFE_ACTION
        - PRESSURE_STARTED
        - PRESSURE_RESOLVED
        - NOTE_SUBMITTED
        - VALIDATOR_REJECTED
        - LLM_FALLBACK_USED
        - SESSION_COMPLETED

    Health:
      type: object
      required: [status, version, time]
      properties:
        status:
          type: string
          enum: [ok, degraded, down]
        version:
          type: string
        time:
          type: string
          format: date-time
        db:
          type: string
          enum: [ok, error]
        content_loaded:
          type: boolean
        cases_loaded:
          type: integer
        llm_provider:
          type: string
          description: Provider name, for example `mock`. Never includes keys.
        commit:
          type: [string, "null"]
          description: Git SHA of the running build (`GIT_COMMIT`, or Render's `RENDER_GIT_COMMIT`); null when unknown.

    # ---------- Cases ----------
    LearningObjective:
      type: object
      required: [id, label_th]
      properties:
        id:
          type: string
        label_th:
          type: string
    DecisionOption:
      type: object
      required: [id, label_th]
      properties:
        id:
          type: string
          examples: [refer]
        label_th:
          type: string
    Audience:
      type: string
      enum: [dad, mom, staff]
    CaseSummary:
      type: object
      required: [case_id, version, title_th, status, status_label_th, variants_available]
      properties:
        case_id:
          type: string
        version:
          type: string
        title_th:
          type: string
        status:
          $ref: "#/components/schemas/CaseStatus"
        status_label_th:
          type: string
        audience:
          description: Who the course is for; groups the case list. Null for a case that does not say.
          anyOf:
            - $ref: "#/components/schemas/Audience"
            - type: "null"
        variants_available:
          type: array
          items:
            $ref: "#/components/schemas/Variant"
    CaseBrief:
      allOf:
        - $ref: "#/components/schemas/CaseSummary"
        - type: object
          required: [patient_display_th, learning_objectives, decision_options, disclaimer_th]
          properties:
            patient_display_th:
              type: string
              description: Initial information shown to the learner. Contains no hidden facts.
            learning_objectives:
              type: array
              items:
                $ref: "#/components/schemas/LearningObjective"
            decision_options:
              type: array
              items:
                $ref: "#/components/schemas/DecisionOption"
            disclaimer_th:
              type: string

    # ---------- Sessions ----------
    Limits:
      type: object
      required: [max_turns, max_text_chars, idle_timeout_s, max_rationale_chars, max_note_chars]
      properties:
        max_turns:
          type: integer
          examples: [40]
        max_text_chars:
          type: integer
          examples: [500]
        idle_timeout_s:
          type: integer
          examples: [1800]
        max_rationale_chars:
          type: integer
          examples: [300]
        max_note_chars:
          type: integer
          examples: [500]
    Notice:
      type: object
      required: [code, text_th]
      description: Banners the client must display.
      properties:
        code:
          type: string
          enum: [EDUCATION_ONLY, CASE_STATUS, PRIVACY_LLM, NO_REAL_PII]
        text_th:
          type: string
    CreateSessionRequest:
      type: object
      required: [case_id, learner_name]
      properties:
        case_id:
          type: string
        variant:
          $ref: "#/components/schemas/Variant"
          default: A
        learner_name:
          type: string
          minLength: 1
          maxLength: 30
          description: Nickname. Do not require real names.
        class_code:
          type: [string, "null"]
          pattern: "^[A-Z0-9]{6}$"
    CreateSessionResponse:
      type: object
      required: [session_id, token, token_type, created_at, case, variant, phase, limits, notices]
      properties:
        session_id:
          type: string
          format: uuid
        token:
          type: string
          description: Shown once; store it client-side for this session only.
        token_type:
          type: string
          enum: [Bearer]
        created_at:
          type: string
          format: date-time
        case:
          $ref: "#/components/schemas/CaseBrief"
        variant:
          $ref: "#/components/schemas/Variant"
        phase:
          $ref: "#/components/schemas/Phase"
        limits:
          $ref: "#/components/schemas/Limits"
        notices:
          type: array
          items:
            $ref: "#/components/schemas/Notice"
      example:
        session_id: 6f2b6a52-3a0e-4e3a-9f55-1d1b9f6a0c11
        token: st_9d1f0c...redacted
        token_type: Bearer
        created_at: "2026-10-12T02:41:09Z"
        case:
          case_id: PP-001
          version: "0.1"
          title_th: "[ตัวอย่าง] การประเมินหญิงหลังคลอดก่อนรับบริการ"
          status: Draft
          status_label_th: "ฉบับร่าง — ยังไม่ผ่านการตรวจโดยผู้เชี่ยวชาญ"
          variants_available: [A, C]
          patient_display_th: "[ข้อมูลตั้งต้นของผู้ป่วย]"
          learning_objectives:
            - id: risk_recognition
              label_th: "รับรู้สัญญาณอันตราย"
          decision_options:
            - id: refer
              label_th: "หยุดบริการตามปกติและประสานส่งต่อ"
            - id: proceed_service
              label_th: "ให้บริการตามที่ขอ"
          disclaimer_th: "เพื่อการศึกษาเท่านั้น"
        variant: A
        phase: INTERVIEW
        limits:
          max_turns: 40
          max_text_chars: 500
          idle_timeout_s: 1800
          max_rationale_chars: 300
          max_note_chars: 500
        notices:
          - code: EDUCATION_ONLY
            text_th: "นี่คือการจำลองเพื่อการเรียนรู้ ไม่ใช่คำแนะนำทางการแพทย์"
          - code: CASE_STATUS
            text_th: "ฉบับร่าง — ยังไม่ผ่านการตรวจโดยผู้เชี่ยวชาญ"
          - code: PRIVACY_LLM
            text_th: "ข้อความของคุณจะถูกส่งไปยังผู้ให้บริการโมเดลภาษาเพื่อสร้างคำตอบ"
          - code: NO_REAL_PII
            text_th: "อย่าพิมพ์ข้อมูลส่วนบุคคลจริง"
    Message:
      type: object
      required: [idx, speaker, text, created_at]
      properties:
        idx:
          type: integer
          minimum: 0
          description: Learner turn index (starts at 1). Opening system lines use 0.
        speaker:
          $ref: "#/components/schemas/Speaker"
        text:
          type: string
        created_at:
          type: string
          format: date-time
    DecisionState:
      type: object
      required: [committed]
      properties:
        committed:
          type: boolean
        option_id:
          type: [string, "null"]
        committed_at_idx:
          type: [integer, "null"]
    SessionView:
      type: object
      required: [session_id, case, variant, status, phase, turn_idx, turns_remaining, decision, history, limits, created_at, last_activity_at]
      properties:
        session_id:
          type: string
          format: uuid
        case:
          type: object
          required: [case_id, version, status, status_label_th]
          properties:
            case_id:
              type: string
            version:
              type: string
            status:
              $ref: "#/components/schemas/CaseStatus"
            status_label_th:
              type: string
        variant:
          $ref: "#/components/schemas/Variant"
        status:
          $ref: "#/components/schemas/SessionStatus"
        phase:
          $ref: "#/components/schemas/Phase"
        turn_idx:
          type: integer
        turns_remaining:
          type: integer
        decision:
          $ref: "#/components/schemas/DecisionState"
        history:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        limits:
          $ref: "#/components/schemas/Limits"
        created_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
    TurnRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        client_turn_id:
          type: string
          minLength: 8
          maxLength: 64
          description: Unique per message; makes retries safe.
    Reply:
      type: object
      required: [speaker, text]
      properties:
        speaker:
          type: string
          enum: [patient, relative, system]
        text:
          type: string
    LiveGlassBox:
      type: object
      required: [risk_state, facts, fired_action_ids]
      properties:
        risk_state:
          $ref: "#/components/schemas/RiskState"
        facts:
          type: array
          items:
            $ref: "#/components/schemas/Fact"
        fired_action_ids:
          type: array
          items:
            type: string
    TurnResponse:
      type: object
      required: [turn_idx, replies, phase, clarification, turns_remaining, degraded]
      properties:
        turn_idx:
          type: integer
        replies:
          type: array
          description: One or more speakers (patient, plus scripted relative lines during PRESSURE).
          items:
            $ref: "#/components/schemas/Reply"
        phase:
          $ref: "#/components/schemas/Phase"
        clarification:
          type: boolean
          description: True when the patient asked the learner to rephrase (no unlock, no scoring for this turn).
        turns_remaining:
          type: integer
        degraded:
          type: boolean
          description: True when a fallback path produced this turn.
        glassbox:
          oneOf:
            - $ref: "#/components/schemas/LiveGlassBox"
            - type: "null"
          description: Non-null only when live Glass Box is enabled for the caller.
    DecisionRequest:
      type: object
      required: [option_id]
      properties:
        option_id:
          type: string
        rationale_th:
          type: [string, "null"]
          maxLength: 300
    DecisionResponse:
      type: object
      required: [phase, decision, replies]
      properties:
        phase:
          $ref: "#/components/schemas/Phase"
        decision:
          type: object
          required: [option_id, committed_at_idx]
          properties:
            option_id:
              type: string
            committed_at_idx:
              type: integer
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Reply"
        pressure_turns_allowed:
          type: [integer, "null"]
          description: Number of learner turns allowed in the pressure scene; null when there is none.
    CompleteRequest:
      type: object
      properties:
        note_th:
          type: [string, "null"]
          maxLength: 500
    CompleteResponse:
      type: object
      required: [status, report_ready, report_url]
      properties:
        status:
          type: string
          enum: [completed]
        report_ready:
          type: boolean
        report_url:
          type: string

    # ---------- Report ----------
    Evidence:
      type: object
      required: [event_id, turn_idx, type]
      properties:
        event_id:
          type: integer
        turn_idx:
          type: integer
        type:
          $ref: "#/components/schemas/EventType"
    CompetencyScore:
      type: object
      required: [id, name_th, weight, score_pct, earned, possible]
      properties:
        id:
          type: string
          enum: [HX, RISK, DEC, ESC, COMM, DOC]
        name_th:
          type: string
        weight:
          type: number
          description: Normalized weight (sums to 100 across applicable competencies).
        score_pct:
          type: number
          minimum: 0
          maximum: 100
        earned:
          type: number
        possible:
          type: number
    ItemResult:
      type: object
      required: [id, competency, result, points, earned, critical, evidence]
      properties:
        id:
          type: string
        competency:
          type: string
        label_th:
          type: string
        result:
          $ref: "#/components/schemas/ItemResultValue"
        points:
          type: number
        earned:
          type: number
        critical:
          type: boolean
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
        finding_id:
          type: [string, "null"]
    Finding:
      type: object
      required: [id, polarity, rubric_item_id, text_th, evidence_refs]
      properties:
        id:
          type: string
        polarity:
          type: string
          enum: [strength, improve]
        rubric_item_id:
          type: string
        text_th:
          type: string
          description: Deterministic template text from the rubric.
        evidence_refs:
          type: array
          items:
            type: integer
          description: Event ids.
        reference_ids:
          type: array
          items:
            type: string
    DebriefParagraph:
      type: object
      required: [finding_ids, text_th]
      properties:
        finding_ids:
          type: array
          items:
            type: string
        text_th:
          type: string
    Debrief:
      type: object
      required: [source, paragraphs]
      properties:
        source:
          type: string
          enum: [llm, template]
        paragraphs:
          type: array
          items:
            $ref: "#/components/schemas/DebriefParagraph"
    TimelineEntry:
      type: object
      required: [event_id, turn_idx, type, summary_th]
      properties:
        event_id:
          type: integer
        turn_idx:
          type: integer
        type:
          $ref: "#/components/schemas/EventType"
        summary_th:
          type: string
    Fact:
      type: object
      required: [id, kind, text_th, revealed]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [known, hidden]
        text_th:
          type: string
        risk_relevance:
          type: string
          enum: [critical, contextual, none]
        revealed:
          type: boolean
        revealed_at_idx:
          type: [integer, "null"]
    GlassBoxReport:
      type: object
      required: [facts, risk_state_timeline, learner_actions]
      properties:
        facts:
          type: array
          items:
            $ref: "#/components/schemas/Fact"
        risk_state_timeline:
          type: array
          items:
            type: object
            required: [turn_idx, risk_state]
            properties:
              turn_idx:
                type: integer
              risk_state:
                $ref: "#/components/schemas/RiskState"
        learner_actions:
          type: array
          items:
            type: object
            required: [turn_idx, action_id, label_th, repeated]
            properties:
              turn_idx:
                type: integer
              action_id:
                type: string
              label_th:
                type: string
              repeated:
                type: boolean
    MissedOpportunity:
      type: object
      required: [turn_idx, fact_id, note_th]
      properties:
        turn_idx:
          type: integer
        fact_id:
          type: string
        note_th:
          type: string
    ReplayReport:
      type: object
      required: [terminal_state, timeline_th, missed_opportunities, disclaimer_th]
      properties:
        terminal_state:
          type: string
          description: Case-defined key such as `Referral` or `UnsafeProceed`.
        timeline_th:
          type: array
          items:
            type: string
        missed_opportunities:
          type: array
          items:
            $ref: "#/components/schemas/MissedOpportunity"
        disclaimer_th:
          type: string
    Reference:
      type: object
      required: [id, title_th]
      properties:
        id:
          type: string
        title_th:
          type: string
        locator:
          type: string
    EffectiveScore:
      type: object
      required: [safety_status, total_score]
      properties:
        safety_status:
          $ref: "#/components/schemas/SafetyStatus"
        total_score:
          type: number
    ReportResponse:
      type: object
      required: [session_id, generated_at, engine_version, rubric_version, case, variant, safety_status, total_score, competencies, items, findings, debrief, timeline, glassbox, replay, references, overrides, effective, disclaimers]
      properties:
        session_id:
          type: string
          format: uuid
        generated_at:
          type: string
          format: date-time
        engine_version:
          type: string
        rubric_version:
          type: string
        case:
          type: object
          required: [case_id, version, hash, status, status_label_th, title_th]
          properties:
            case_id:
              type: string
            version:
              type: string
            hash:
              type: string
            status:
              $ref: "#/components/schemas/CaseStatus"
            status_label_th:
              type: string
            title_th:
              type: string
        variant:
          $ref: "#/components/schemas/Variant"
        safety_status:
          $ref: "#/components/schemas/SafetyStatus"
        total_score:
          type: number
          minimum: 0
          maximum: 100
        competencies:
          type: array
          items:
            $ref: "#/components/schemas/CompetencyScore"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemResult"
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        debrief:
          $ref: "#/components/schemas/Debrief"
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEntry"
        glassbox:
          $ref: "#/components/schemas/GlassBoxReport"
        replay:
          $ref: "#/components/schemas/ReplayReport"
        references:
          type: array
          items:
            $ref: "#/components/schemas/Reference"
        overrides:
          type: array
          items:
            $ref: "#/components/schemas/Override"
        effective:
          $ref: "#/components/schemas/EffectiveScore"
        disclaimers:
          type: array
          items:
            type: string

    # ---------- Instructor ----------
    CreateClassRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
    ClassInfo:
      type: object
      required: [class_id, code, name, created_at]
      properties:
        class_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[A-Z0-9]{6}$"
        name:
          type: string
        created_at:
          type: string
          format: date-time
    ClassList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ClassInfo"
    InstructorSessionList:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionSummary"
        next_cursor:
          type: [string, "null"]
    SessionSummary:
      type: object
      required: [session_id, learner_name, case_id, case_status, case_status_label_th, variant, status, started_at]
      properties:
        session_id:
          type: string
          format: uuid
        learner_name:
          type: string
        case_id:
          type: string
        case_version:
          type: string
        case_status:
          $ref: "#/components/schemas/CaseStatus"
        case_status_label_th:
          type: string
        variant:
          $ref: "#/components/schemas/Variant"
        status:
          $ref: "#/components/schemas/SessionStatus"
        started_at:
          type: string
          format: date-time
        ended_at:
          type: [string, "null"]
          format: date-time
        turns:
          type: integer
        safety_status:
          oneOf:
            - $ref: "#/components/schemas/SafetyStatus"
            - type: "null"
        total_score:
          type: [number, "null"]
        competency_pct:
          type: object
          additionalProperties:
            type: number
          description: Map of competency id to percent; empty until completed.
    ClassAnalytics:
      type: object
      required: [class_code, sessions_completed, sessions_active, competency_avg, critical_item_fail_rates]
      properties:
        class_code:
          type: string
        sessions_completed:
          type: integer
        sessions_active:
          type: integer
        avg_total_score:
          type: [number, "null"]
        safety_not_met_rate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
        avg_turns:
          type: [number, "null"]
        competency_avg:
          type: array
          items:
            type: object
            required: [id, name_th, avg_pct]
            properties:
              id:
                type: string
              name_th:
                type: string
              avg_pct:
                type: number
        critical_item_fail_rates:
          type: array
          items:
            type: object
            required: [item_id, label_th, fail_rate, n]
            properties:
              item_id:
                type: string
              label_th:
                type: string
              fail_rate:
                type: number
                minimum: 0
                maximum: 1
              n:
                type: integer
    OverrideRequest:
      type: object
      required: [rubric_item_id, new_result, reason]
      properties:
        rubric_item_id:
          type: string
        new_result:
          type: string
          enum: [pass, fail, partial]
        new_earned:
          type: [number, "null"]
          description: Required when `new_result` is `partial`.
        reason:
          type: string
          minLength: 10
          maxLength: 500
    Override:
      type: object
      required: [id, rubric_item_id, original_result, new_result, reason, created_at]
      properties:
        id:
          type: integer
        rubric_item_id:
          type: string
        original_result:
          $ref: "#/components/schemas/ItemResultValue"
        new_result:
          type: string
          enum: [pass, fail, partial]
        new_earned:
          type: [number, "null"]
        reason:
          type: string
        created_at:
          type: string
          format: date-time

    # ---------- Replay ----------
    RecordingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecordingListItem"
    RecordingListItem:
      description: A recording summary plus the case status of its snapshot (shown as a badge).
      allOf:
        - $ref: "#/components/schemas/RecordingSummary"
        - type: object
          required: [status, status_label_th]
          properties:
            status:
              $ref: "#/components/schemas/CaseStatus"
            status_label_th:
              type: string
    RecordingSummary:
      type: object
      required: [recording_id, title_th, case_id, variant]
      properties:
        recording_id:
          type: string
        title_th:
          type: string
        case_id:
          type: string
        variant:
          $ref: "#/components/schemas/Variant"
        description_th:
          type: string
        steps_count:
          type: integer
    RecordingStep:
      type: object
      required: [t_ms, type]
      properties:
        t_ms:
          type: integer
          description: Delay before this step plays, relative to the previous step.
        type:
          type: string
          enum: [learner, reply, decision, phase_change, complete]
        speaker:
          $ref: "#/components/schemas/Speaker"
        text:
          type: string
        option_id:
          type: string
        phase:
          $ref: "#/components/schemas/Phase"
    Recording:
      allOf:
        - $ref: "#/components/schemas/RecordingSummary"
        - type: object
          required: [case, steps, report]
          properties:
            case:
              $ref: "#/components/schemas/CaseBrief"
            steps:
              type: array
              items:
                $ref: "#/components/schemas/RecordingStep"
            report:
              $ref: "#/components/schemas/ReportResponse"

    FamilyCompetency:
      properties:
        skill:
          type: string
          enum:
          - communication
          - responsibility
          - safety
          - support
          title: Skill
        observed:
          type: integer
          title: Observed
        opportunities:
          type: integer
          title: Opportunities
      additionalProperties: false
      type: object
      required:
      - skill
      - observed
      - opportunities
      title: FamilyCompetency
    FamilyCreate:
      properties:
        story_id:
          type: string
          maxLength: 64
          pattern: ^[a-z0-9-]+$
          title: Story Id
        role:
          type: string
          enum:
          - mother
          - father
          title: Role
      additionalProperties: false
      type: object
      required:
