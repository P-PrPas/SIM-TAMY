openapi: 3.1.0

info:
  title: SIM-TAMY API
  version: 1.0.0
  summary: Backend API for the SIM-TAMY AI virtual patient simulator (Thai traditional medicine / midwifery red-flag training).
  description: |
    Contract for `apps/api`. Derived from `docs/PRD.md` §8; see `docs/API_DESIGN.md` for conventions,
    the phase/permission matrix, SSE protocol, error catalog, and flows.

    ## Hard rules reflected in this contract
    * **No leakage during play.** While a session is `active`, no response may contain hidden facts,
      `revealed_fact_ids`, `risk_state`, detected `actions`, rubric items, or scores. These appear only in
      `ReportResponse` (after completion), or in `LiveGlassBox` when `GLASS_BOX_LIVE=true` or the caller is an instructor.
    * **Decisions are committed through `POST /v1/sessions/{id}/decision`**, never inferred from chat text.
    * **Scoring is deterministic** and never produced by an LLM. `debrief` text may be LLM-phrased but is
      derived only from engine `findings`; `debrief.source` says which path was used.
    * **Education only.** Responses that carry case content include `status` (Draft | In Review | Approved)
      and clients must render the status badge and the education-only disclaimer.

    ## Conventions (summary)
    * JSON, UTF-8, `snake_case`, ISO 8601 UTC timestamps, UUID session ids.
    * Learner auth: `Authorization: Bearer <token>` (returned once by `POST /v1/sessions`).
      Instructor auth: `X-Instructor-Secret: <secret>`.
    * Every response carries `X-Request-ID`. Errors use the envelope in `Error`.
    * Extension fields: `x-priority` (Must | Should | Could), `x-fr` (PRD functional requirement ids).
  contact:
    name: SIM-TAMY engineering

servers:
  - url: http://localhost:8000
    description: Local (docker compose)
  - url: https://{host}
    description: Demo / staging
    variables:
      host:
        default: api.example.com

tags:
  - name: System
    description: Health and readiness.
  - name: Cases
    description: Browse available cases (never exposes hidden facts).
  - name: Sessions
    description: Learner session lifecycle - create, converse, decide, complete.
  - name: Reports
    description: Post-completion report, Glass Box, Consequence Replay.
  - name: Instructor
    description: Classes, session listing, analytics, overrides.
  - name: Replay
    description: Recorded sessions for Replay Mode (demo safety net).

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness and dependency status
      description: Unversioned. Use for container health checks and the demo pre-flight checklist.
      security: []
      x-priority: Must
      x-fr: [FR-OBS-01]
      responses:
        "200":
          description: Service is up (status may be `degraded`).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
                version: 1.0.0
                time: "2026-10-12T02:30:00Z"
                db: ok
                content_loaded: true
                cases_loaded: 2
                llm_provider: mock
        "503":
          description: Service cannot serve traffic (for example the database is unreachable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/cases:
    get:
      tags: [Cases]
      operationId: listCases
      summary: List cases available to learners
      description: |
        Draft cases are included only when `ALLOW_DRAFT_CASES=true`. Each item carries its status so the UI can
        render the badge.
      security: []
      x-priority: Must
      x-fr: [FR-CASE-02, FR-CASE-03]
      responses:
        "200":
          description: Case summaries.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CaseSummary"
              example:
                items:
                  - case_id: PP-001
                    version: "0.1"
                    title_th: "[ตัวอย่าง] การประเมินหญิงหลังคลอดก่อนรับบริการ"
                    status: Draft
                    status_label_th: "ฉบับร่าง — ยังไม่ผ่านการตรวจโดยผู้เชี่ยวชาญ"
                    variants_available: [A, C]
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/cases/{case_id}:
    get:
      tags: [Cases]
      operationId: getCase
      summary: Case briefing (what the learner may see before starting)
      description: Never includes hidden facts, rubric, branch rules, or outcome scripts.
      security: []
      x-priority: Must
      x-fr: [FR-CASE-02]
      parameters:
        - $ref: "#/components/parameters/CaseId"
      responses:
        "200":
          description: Case brief.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseBrief"
              example:
                case_id: PP-001
                version: "0.1"
                title_th: "[ตัวอย่าง] การประเมินหญิงหลังคลอดก่อนรับบริการ"
                status: Draft
                status_label_th: "ฉบับร่าง — ยังไม่ผ่านการตรวจโดยผู้เชี่ยวชาญ"
                variants_available: [A, C]
                patient_display_th: "[ข้อมูลตั้งต้นของผู้ป่วย]"
                learning_objectives:
                  - id: risk_recognition
                    label_th: "รับรู้สัญญาณอันตราย"
                decision_options:
                  - id: refer
                    label_th: "หยุดบริการตามปกติและประสานส่งต่อ"
                  - id: proceed_service
                    label_th: "ให้บริการตามที่ขอ"
                disclaimer_th: "เพื่อการศึกษาเท่านั้น"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/classes/{code}:
    get:
      tags: [Cases]
      operationId: checkClassCode
      summary: Validate a class code before joining
      description: Lets the Join screen show a friendly error for a wrong code. Returns only the class name.
      security: []
      x-priority: Should
      x-fr: [FR-INS-01]
      parameters:
        - $ref: "#/components/parameters/ClassCode"
      responses:
        "200":
          description: Code is valid.
          content:
            application/json:
              schema:
                type: object
                required: [code, name]
                properties:
                  code:
                    type: string
                  name:
                    type: string
              example:
                code: AB12CD
                name: "ผดุงครรภ์ไทย ปี 3"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/sessions:
    post:
      tags: [Sessions]
      operationId: createSession
      summary: Start a session
      description: |
        Creates an anonymous learner session pinned to the current case version/hash. The `token` is returned
        **once**; the server stores only its hash. Initial phase is `INTERVIEW`.
      security: []
      x-priority: Must
      x-fr: [FR-SES-01, FR-AUTH-01, FR-CASE-03, FR-CASE-05]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
            example:
              case_id: PP-001
              variant: A
              learner_name: "น้องมะลิ"
              class_code: AB12CD
      responses:
        "201":
          description: Session created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Location:
              description: URL of the new session.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        "404":
          description: Unknown case (`CASE_NOT_AVAILABLE`) or class code (`CLASS_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                caseNotAvailable:
                  value:
                    error:
                      code: CASE_NOT_AVAILABLE
                      message: "ไม่พบเคสนี้ หรือเคสยังไม่เปิดให้ใช้งาน"
                      details: {}
                      request_id: 7d1c0b52
                classNotFound:
                  value:
                    error:
                      code: CLASS_NOT_FOUND
                      message: "ไม่พบรหัสห้องเรียนนี้"
                      details: {}
                      request_id: 7d1c0b53
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/sessions/{session_id}:
    get:
      tags: [Sessions]
      operationId: getSession
      summary: Session state and chat history (safe to render during play)
      description: |
        Used to resume after a page refresh. Contains no hidden information. Also callable by an instructor.
      security:
        - SessionToken: []
        - InstructorSecret: []
      x-priority: Must
      x-fr: [FR-SES-02]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session view.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionView"
              example:
                session_id: 6f2b6a52-3a0e-4e3a-9f55-1d1b9f6a0c11
                case:
                  case_id: PP-001
                  version: "0.1"
                  status: Draft
                  status_label_th: "ฉบับร่าง — ยังไม่ผ่านการตรวจโดยผู้เชี่ยวชาญ"
                variant: A
                status: active
                phase: INTERVIEW
                turn_idx: 0
                turns_remaining: 40
                decision:
                  committed: false
                history: []
                limits:
                  max_turns: 40
                  max_text_chars: 500
                  idle_timeout_s: 1800
                  max_rationale_chars: 300
                  max_note_chars: 500
                created_at: "2026-10-12T02:41:09Z"
                last_activity_at: "2026-10-12T02:41:09Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/SessionExpired"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/sessions/{session_id}/turns:
    post:
      tags: [Sessions]
      operationId: sendTurn
      summary: Send a learner message and receive the patient's reply
      description: |
        Server pipeline (one transaction per turn): Interpreter (LLM) -> Engine (pure) -> Generator (LLM) ->
        Validator -> persist turn + events + llm_calls.

        **Allowed phases:** `INTERVIEW`, `PRESSURE`. Otherwise `409 INVALID_PHASE`.

        **Pressure scene (Variant C):** each learner turn in `PRESSURE` consumes one of `pressure_turns_allowed`. When the
        last one is consumed the response carries `phase: CLOSING` (the scripted relative lines are in `replies`), and the
        client then calls `completeSession`.

        **Concurrency:** one turn in flight per session (`409 TURN_IN_PROGRESS`).

        **Idempotency:** send a unique `client_turn_id`. Same id + same text returns the stored result with header
        `Idempotent-Replay: true`. Same id + different text returns `409 IDEMPOTENCY_CONFLICT`.

        **Degraded mode:** if the LLM path fails, the server falls back (lexical matcher, canned patient reply) and
        still returns 200 with `degraded: true`. `503 LLM_UNAVAILABLE` only if even the fallback cannot respond.

        **Streaming:** use `?stream=true` (or `Accept: text/event-stream`). The stream is *buffer-then-chunk*:
        text is emitted only after the Validator accepts it. Because this is a POST, clients use `fetch` with a
        readable stream (not `EventSource`).

        Event types:
        * `delta` - `{"seq": 0, "speaker": "patient", "text": "..."}`
        * `done` - the full `TurnResponse` JSON
        * `error` - the `Error` envelope; the stream then closes
        * comment lines `: ping` every 15 s as keep-alive
      security:
        - SessionToken: []
      x-priority: Must
      x-fr: [FR-CHAT-01, FR-CHAT-02, FR-CHAT-03, FR-CHAT-04, FR-SES-03]
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: stream
          in: query
          required: false
          description: Return Server-Sent Events instead of a single JSON body.
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurnRequest"
            example:
              text: "เลือดที่ออกตอนนี้เป็นยังไงบ้างคะ"
              client_turn_id: "c-0007-9f3a"
      responses:
        "200":
          description: Patient reply (and optionally scripted relative lines during `PRESSURE`).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Idempotent-Replay:
              description: "`true` when this is a stored result for a repeated `client_turn_id`."
              schema:
                type: string
                enum: ["true"]
            X-RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            X-RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnResponse"
              examples:
                normal:
                  value:
                    turn_idx: 3
                    replies:
                      - speaker: patient
                        text: "[ตัวอย่าง] ก็... เหมือนจะเยอะกว่าที่คิดค่ะ แต่ที่บ้านบอกว่าปกติ"
                    phase: INTERVIEW
                    clarification: false
                    turns_remaining: 37
                    degraded: false
                    glassbox: null
                clarification:
                  summary: Interpreter confidence was in the 0.5-0.75 band; patient asks the learner to rephrase.
                  value:
                    turn_idx: 4
                    replies:
                      - speaker: patient
                        text: "ขอโทษนะคะ ไม่แน่ใจว่าหมายถึงเรื่องอะไร ช่วยอธิบายอีกนิดได้ไหมคะ"
                    phase: INTERVIEW
                    clarification: true
                    turns_remaining: 36
                    degraded: false
                    glassbox: null
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream. See operation description for event types.
              example: |
                event: delta
                data: {"seq":0,"speaker":"patient","text":"ก็... เหมือนจะเยอะกว่าที่คิดค่ะ"}

                event: delta
                data: {"seq":1,"speaker":"patient","text":" แต่ที่บ้านบอกว่าปกติ"}

                event: done
                data: {"turn_idx":3,"replies":[{"speaker":"patient","text":"..."}],"phase":"INTERVIEW","clarification":false,"turns_remaining":37,"degraded":false,"glassbox":null}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `TURN_IN_PROGRESS`, `SESSION_COMPLETED`, `INVALID_PHASE`, or `IDEMPOTENCY_CONFLICT`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                inProgress:
                  value:
                    error:
                      code: TURN_IN_PROGRESS
                      message: "กำลังประมวลผลข้อความก่อนหน้า กรุณารอสักครู่"
                      details: {}
                      request_id: 91ab34cd
                invalidPhase:
                  value:
                    error:
                      code: INVALID_PHASE
                      message: "ตอนนี้ไม่สามารถพิมพ์ข้อความได้ กรุณาสรุปเคสและส่งรายงาน"
                      details:
                        phase: CLOSING
                      request_id: 91ab34ce
        "410":
          $ref: "#/components/responses/SessionExpired"
        "422":
          description: |
            `VALIDATION_ERROR`, `TEXT_TOO_LONG` (> 500 chars), or `TURN_LIMIT` (> 40 learner turns).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                tooLong:
                  value:
                    error:
                      code: TEXT_TOO_LONG
                      message: "ข้อความยาวเกิน 500 ตัวอักษร"
                      details:
                        max: 500
                        actual: 612
                      request_id: 5c0e11aa
                turnLimit:
                  value:
                    error:
                      code: TURN_LIMIT
                      message: "ครบจำนวนข้อความสูงสุดแล้ว กรุณาตัดสินใจเพื่อจบเคส"
                      details:
                        max_turns: 40
                      request_id: 5c0e11ab
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/LlmUnavailable"

  /v1/sessions/{session_id}/decision:
    post:
      tags: [Sessions]
      operationId: commitDecision
      summary: Commit the learner's decision (Decision Panel)
      description: |
        Final and irreversible. **Allowed phase:** `INTERVIEW`. Repeating the *same* `option_id` is idempotent
        (returns the original result); a *different* option returns `409 DECISION_ALREADY_COMMITTED`.

        Next phase is decided by the case's `branch_rules`:
        * Variant C + referral -> `PRESSURE`; the response carries the scripted `relative` lines and
          `pressure_turns_allowed`.
        * Otherwise -> `CLOSING`.

        Unsafe-action detection happens here; its effects are **not** disclosed in this response.
      security:
        - SessionToken: []
      x-priority: Must
      x-fr: [FR-ENG-03, FR-ENG-04, FR-ENG-05]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
            example:
              option_id: refer
              rationale_th: "พบอาการผิดปกติที่ควรได้รับการประเมินทางการแพทย์"
      responses:
        "200":
          description: Decision recorded.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
              examples:
                variantA:
                  value:
                    phase: CLOSING
                    decision:
                      option_id: refer
                      committed_at_idx: 6
                    replies: []
                    pressure_turns_allowed: null
                variantCReferral:
                  value:
                    phase: PRESSURE
                    decision:
                      option_id: refer
                      committed_at_idx: 6
                    replies:
                      - speaker: relative
                        text: "[ตัวอย่างบทที่ผู้เชี่ยวชาญเขียน] ไม่ต้องไปโรงพยาบาลหรอก ทำต่อเถอะ"
                    pressure_turns_allowed: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`INVALID_PHASE`, `DECISION_ALREADY_COMMITTED`, `SESSION_COMPLETED`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          $ref: "#/components/responses/SessionExpired"
        "422":
          description: "`VALIDATION_ERROR` or `DECISION_OPTION_INVALID` (option id not in this case)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/sessions/{session_id}/complete:
    post:
      tags: [Sessions]
      operationId: completeSession
      summary: Finish the case and generate the report
      description: |
        **Allowed phase:** `CLOSING` (after a decision, and after the pressure scene if any). Locks the session,
        scores deterministically from the Event Log, builds the report (Glass Box, Consequence Replay, debrief), then
        returns. Synchronous, with a server budget of about 20 s; if the debrief LLM is slow or fails the template
        fallback is used (`debrief.source = template`). Calling again after completion returns the same result.
      security:
        - SessionToken: []
      x-priority: Must
      x-fr: [FR-SES-04, FR-SCR-01, FR-DEB-01, FR-DEB-02]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRequest"
            example:
              note_th: "สรุปเหตุผลที่ตัดสินใจส่งต่อ ..."
      responses:
        "200":
          description: Session completed and report ready.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteResponse"
              example:
                status: completed
                report_ready: true
                report_url: /v1/sessions/6f2b6a52-3a0e-4e3a-9f55-1d1b9f6a0c11/report
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`INVALID_PHASE` (no decision yet, or pressure scene unresolved)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          $ref: "#/components/responses/SessionExpired"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/sessions/{session_id}/report:
    get:
      tags: [Reports]
      operationId: getReport
      summary: Full report (score, safety status, findings, Glass Box, Consequence Replay)
      description: |
        Learners: available only after `complete`. Instructors: available once completed. Before that,
        `409 REPORT_NOT_READY`. If safety status is `SAFETY_NOT_MET`, clients must show it more prominently than
        the total score and must never render pass wording.
      security:
        - SessionToken: []
        - InstructorSecret: []
      x-priority: Must
      x-fr: [FR-SCR-01, FR-SCR-02, FR-SCR-03, FR-SCR-05, FR-DEB-01, FR-DEB-03, FR-GB-01, FR-REP-01]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Report.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/XRequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
              example:
                session_id: 6f2b6a52-3a0e-4e3a-9f55-1d1b9f6a0c11
                generated_at: "2026-10-12T03:05:11Z"
                engine_version: 1.0.0
                rubric_version: "0.1"
                case:
                  case_id: PP-001
                  version: "0.1"
                  hash: 3f9a1c0e
                  status: Draft
                  status_label_th: "ฉบับร่าง — ยังไม่ผ่านการตรวจโดยผู้เชี่ยวชาญ"
                  title_th: "[ตัวอย่าง] การประเมินหญิงหลังคลอดก่อนรับบริการ"
                variant: A
                safety_status: SAFETY_NOT_MET
                total_score: 54.5
                competencies:
                  - id: RISK
