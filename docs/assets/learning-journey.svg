  <rect x=".5" y=".5" width="1279" height="327" rx="24" fill="url(#grid)" stroke="#e6dfd4"/>
  <path d="M40 40h8v8h-8zm12 0h8v8h-8zm12 0h8v8h-8z" fill="#c68d1c"/>
