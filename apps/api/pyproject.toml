[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-tamy-api"
version = "0.1.0"
description = "SIM-TAMY API: FastAPI backend, deterministic engine, AI components"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",  # typed env config (PRD 6.5)
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "httpx2>=2",  # openai_like LLM provider (plain HTTP, no vendor SDK)
  "pyyaml>=6",  # mock LLM script; content loader (T-010)
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",  # property tests for the pure engine (T-024)
  "types-pyyaml>=6",
  "openapi-spec-validator>=0.7",  # docs/openapi.yaml must stay a valid spec
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["ai/prompts/*.md", "services/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import shared helpers as tests.unit...
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# AGENTS.md: mypy strict on the pure layers.
[[tool.mypy.overrides]]
module = ["app.engine.*", "app.domain.*"]
strict = true
