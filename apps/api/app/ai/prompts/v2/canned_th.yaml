# Fixed lines for the v2 typed-chat controller (not clinical content).
boundary: "นี่คือบทฝึกสมมติ ไม่สามารถประเมินหรือแนะนำเรื่องสุขภาพจริงได้ หากมีอาการจริงให้ติดต่อบุคลากรสุขภาพโดยตรง"
